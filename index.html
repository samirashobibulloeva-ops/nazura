    <script>
      // Кнопки: склад, поставщики, приёмка товара.

      function stockActions(a, b, o, byId, e) {
        switch (a) {
          case "stockIn":
            qtyModal(b.dataset.k, "in");
            return;
          case "waste":
            qtyModal(b.dataset.k, "waste");
            return;
          case "doIn": {
            const k = b.dataset.k,
              qIn = Math.max(0, +$("#sq").value || 0),
              pIn = Math.max(0, +$("#sp").value || 0),
              q = isG(k) ? qIn * 1000 : qIn,
              old = ING[k].cost,
              nc = isG(k) ? pIn / 1000 : pIn;
            ING[k].s += q;
            LOG.unshift({ t: now(), k, d: q, why: "Stok girişi" });
            GIDER.push({
              id: ++GID,
              cat: "Malzeme",
              amt: Math.round(qIn * pIn),
              date: today(),
              note: `${ING[k].n} · ${qIn} ${qLbl(k)}`,
            });
            modal("");
            if (Math.abs(nc - old) > 1e-9) {
              ING[k].cost = nc;
              render();
              costChange([{ k, old }]);
              return;
            }
            toast(`${ING[k].n}: +${fq(q, ING[k].u)}`);
            break;
          }
          case "doWaste": {
            const k = b.dataset.k,
              q = Math.min(ING[k].s, Math.max(0, (+$("#sq").value || 0) * (isG(k) ? 1000 : 1)));
            ING[k].s -= q;
            LOG.unshift({ t: now(), k, d: -q, why: "Fire: " + ($("#sr").value || "") });
            modal("");
            toast(`Fire kaydedildi: ${fq(q, ING[k].u)} ${ING[k].n}`);
            break;
          }
          case "applyPrices": {
            let n = 0;
            (S.pend || []).forEach((x, i) => {
              if ($("#pc-" + i)?.checked) {
                const p = P(x.pid),
                  v = Math.round(+$("#pv-" + i).value || 0),
                  va = Math.round(+$("#pa-" + i).value || 0);
                if (v > 0 && v !== p.price) {
                  setPrice(x.pid, v, "price");
                  n++;
                }
                if (va > 0 && APPK.some(k => p[k] !== va)) {
                  APPK.forEach(k => setPrice(x.pid, va, k));
                  n++;
                }
              }
            });
            S.pend = null;
            modal("");
            toast(n ? `Fiyatlar güncellendi: salon, paket, Yemeksepeti/Getir/Trendyol ve QR menü` : "Fiyat değişmedi");
            break;
          }
          case "copyBuy": {
            const txt = critList()
              .map(k => `${lvl(k) === "acil" ? "[ACİL] " : ""}${ING[k].n}: ${$("#bq-" + k)?.value || ""} ${qLbl(k)}`)
              .join("\n");
            navigator.clipboard?.writeText(txt).then(
              () => toast("Liste kopyalandı"),
              () => toast("Kopyalanamadı, listeyi elle seçin"),
            );
            return;
          }
          case "recvOne": {
            const k = b.dataset.k,
              r = receive(k);
            if (r === null) {
              toast("Alınan miktarı yazın");
              return;
            }
            render();
            if (r) costChange([r]);
            else toast(`${ING[k].n} stoka eklendi, gider kaydedildi`);
            return;
          }
          case "recvAll": {
            const ch = [];
            let n = 0;
            critList().forEach(k => {
              const r = receive(k);
              if (r !== null) n++;
              if (r) ch.push(r);
            });
            render();
            if (ch.length) costChange(ch);
            else toast(`${n} malzeme stoka eklendi, gider kaydedildi`);
            return;
          }
          case "ingModal":
            ingModal();
            return;
          case "saveIng": {
            const n = $("#ni-n").value.trim();
            if (!n) {
              toast("Malzeme adını yazın");
              $("#ni-n").focus();
              return;
            }
            if (Object.values(ING).some(g => g.n.toLocaleLowerCase("tr-TR") === n.toLocaleLowerCase("tr-TR"))) {
              toast("Bu isimde bir malzeme zaten var");
              return;
            }
            const u = $("#ni-u").value,
              m = u === "g" ? 1000 : 1,
              k = "m" + Date.now();
            ING[k] = {
              n,
              u,
              c: $("#ni-cat").value,
              cost: (+$("#ni-p").value || 0) / m,
              pack: $("#ni-pk").checked,
              s: (+$("#ni-s").value || 0) * m,
              use: (+$("#ni-use").value || 0) * m,
              crit: (+$("#ni-c").value || 0) * m,
            };
            modal("");
            toast(`${n} eklendi. Reçetelere eklemek için ürün reçetesini düzenleyin.`);
            break;
          }
          case "delIng":
            delIngModal(b.dataset.k);
            return;
          case "bulkDel":
            if (S.sel.size) delIngModal([...S.sel]);
            return;
          case "doDelIng": {
            const ks = b.dataset.k.split(",").filter(k => ING[k]);
            const bak = {},
              rb = [];
            ks.forEach(k => {
              bak[k] = ING[k];
              Object.entries(RECIPES).forEach(([pid, r]) => {
                for (let i = r.length - 1; i >= 0; i--)
                  if (r[i][0] === k) {
                    rb.push([pid, i, r[i]]);
                    r.splice(i, 1);
                  }
              });
              delete ING[k];
              S.sel.delete(k);
            });
            modal("");
            render();
            const lbl = ks.length > 1 ? ks.length + " malzeme" : bak[ks[0]].n;
            toast(`${lbl} silindi`, () => {
              Object.assign(ING, bak);
              rb.reverse().forEach(([pid, i, row]) => RECIPES[pid].splice(i, 0, row));
              toast(`${lbl} geri getirildi`);
            });
            return;
          }
          case "supModal":
            supModal(b.dataset.id);
            return;
          case "supSave": {
            const n = $("#sp-n").value.trim();
            if (!n) {
              $("#sp-err").textContent = "Firma adını yazın.";
              return;
            }
            const ks = [...document.querySelectorAll('input[name="spk"]:checked')].map(x => x.value);
            let s = b.dataset.id ? SUPPLIERS.find(x => x.id === +b.dataset.id) : null;
            SUPPLIERS.forEach(x => {
              if (x !== s) x.ings = x.ings.filter(k => !ks.includes(k));
            });
            const v = { n, phone: $("#sp-p").value.trim(), days: $("#sp-d").value.trim(), ings: ks };
            if (s) Object.assign(s, v);
            else SUPPLIERS.push(Object.assign({ id: ++SPID }, v));
            modal("");
            toast(`${n} kaydedildi`);
            break;
          }
          case "supDel": {
            const i = SUPPLIERS.findIndex(x => x.id === +b.dataset.id),
              s = SUPPLIERS.splice(i, 1)[0];
            modal("");
            render();
            toast(`${s.n} silindi`, () => {
              SUPPLIERS.splice(i, 0, s);
              toast("Geri getirildi");
            });
            return;
          }
          case "poModal":
            poModal(b.dataset.id);
            return;
          case "poSend": {
            const s = SUPPLIERS.find(x => x.id === +b.dataset.id),
              lines = s.ings
                .filter(k => ING[k])
                .map(k => [k, Math.max(0, +$("#po-" + k)?.value || 0), Math.max(0, +$("#pp-" + k)?.value || 0)])
                .filter(([, q]) => q > 0);
            if (!lines.length) {
              toast("En az bir malzeme için miktar yazın");
              return;
            }
            const txt =
              `Merhaba, ${S.rname} sipariş listesi:\n` +
              lines.map(([k, q]) => `- ${ING[k].n}: ${q} ${qLbl(k)}`).join("\n") +
              "\nTeşekkürler.";
            PURCH.unshift({ id: ++POID, sup: s.id, t: now(), lines, status: "bekliyor" });
            act("Tedarikçi siparişi", `${s.n} · ${lines.length} kalem`);
            modal("");
            if (b.dataset.w) {
              const w = window.open(
                `https://wa.me/90${digits(s.phone)}?text=${encodeURIComponent(txt)}`,
                "_blank",
                "noopener",
              );
              if (!w) navigator.clipboard?.writeText(txt);
              toast(
                w
                  ? "WhatsApp açıldı · sipariş “bekleyen” olarak kaydedildi"
                  : "WhatsApp açılamadı; liste kopyalandı, sipariş kaydedildi",
              );
            } else {
              navigator.clipboard?.writeText(txt).then(
                () => toast("Liste kopyalandı · sipariş kaydedildi"),
                () => toast("Sipariş kaydedildi"),
              );
            }
            S.stockTab = "ted";
            break;
          }
          case "poRecv":
            recvModal(PURCH.find(x => x.id === +b.dataset.id));
            return;
          case "poRecvDo": {
            const po = PURCH.find(x => x.id === +b.dataset.id),
              s = SUPPLIERS.find(x => x.id === po.sup),
              changes = [];
            let tt = 0;
            po.lines.forEach(([k], ix) => {
              if (!ING[k]) return;
              const q = Math.max(0, +$("#rq-" + ix).value || 0),
                pr = Math.max(0, +$("#rp-" + ix).value || 0),
                qty = isG(k) ? q * 1000 : q,
                nc = isG(k) ? pr / 1000 : pr;
              tt += q * pr;
              if (!q) return;
              ING[k].s += qty;
              LOG.unshift({ t: now(), k, d: qty, why: "Tedarikçi teslimatı · " + (s?.n || "") });
              if (Math.abs(nc - ING[k].cost) > 1e-9) {
                changes.push({ k, old: ING[k].cost });
                ING[k].cost = nc;
              }
            });
            tt = Math.round(tt);
            GIDER.push({
              id: ++GID,
              cat: "Malzeme",
              amt: tt,
              date: today(),
              note: `${s?.n || "Tedarikçi"} · ${po.lines.length} kalem`,
            });
            po.status = "teslim";
            po.recvAt = now();
            act("Mal kabul", `${s?.n} · ${fmt(tt)}`, "");
            modal("");
            render();
            if (changes.length) costChange(changes);
            else toast(`Teslim alındı: stok güncellendi, ${fmt(tt)} gider yazıldı`);
            return;
          }
          case "poDel": {
            const i = PURCH.findIndex(x => x.id === +b.dataset.id);
            PURCH.splice(i, 1);
            toast("Sipariş silindi");
            break;
          }
          default:
            return false;
        }
        render();
      }
      ACTIONS.push(stockActions);
    </script>

    <!-- ============================== js/actions/menu.js ============================== -->
    <script>
      // Кнопки: блюда, опции, комбо, копирование, архив.

      function menuActions(a, b, o, byId, e) {
        switch (a) {
          case "applyRule": {
            let n = 0;
            AP()
              .filter(p => !p.combo)
              .forEach(p => {
                const g = sugPrice(p.id),
                  ga = sugApp(g);
                if (g !== p.price || APPK.some(k => p[k] !== ga)) {
                  setPrice(p.id, g, "price");
                  APPK.forEach(k => setPrice(p.id, ga, k));
                  n++;
                }
              });
            toast(`${n} ürünün fiyatı kurala göre güncellendi`);
            break;
          }
          case "prodModal":
            prodModal();
            return;
          case "pfRow":
            pfAddRow();
            [...document.querySelectorAll(".pfing")].pop()?.focus();
            return;
          case "pfPick": {
            const inp = b.closest(".pfpick").querySelector(".pfing");
            inp.value = ING[b.dataset.k].n;
            inp.dataset.k = b.dataset.k;
            b.closest(".pfdd").hidden = true;
            pfCalc();
            inp.closest(".pfrow").querySelector(".pfq").focus();
            return;
          }
          case "pfDel":
            b.closest(".pfrow").remove();
            pfCalc();
            return;
          case "pfSave": {
            const n = $("#pf-n").value.trim();
            let cat = $("#pf-cat").value;
            const err = t => {
              $("#pf-err").textContent = t;
            };
            if (!n) return err("Ürün adını yazın.");
            if (AP().some(p => p.id !== S.pfEdit && p.name.toLocaleLowerCase("tr-TR") === n.toLocaleLowerCase("tr-TR")))
              return err("Bu isimde bir ürün zaten var.");
            if (!cat) return err("Kategori seçmeden ürün eklenemez.");
            if (cat === "__new") {
              const cn = $("#pf-newcat").value.trim();
              if (!cn) return err("Yeni kategorinin adını yazın.");
              cat = "k" + Date.now();
              CATS.push([cat, cn]);
            }
            const price = Math.round(+$("#pf-price").value || 0);
            if (price <= 0) return err("Salon fiyatını yazın.");
            const app = Math.round(+$("#pf-app").value || 0) || sugApp(price);
            if (S.pfEdit) {
              const p = P(S.pfEdit);
              const appChanged = app !== p.app;
              Object.assign(p, { name: n, cat, price, desc: $("#pf-desc").value.trim() });
              if (S.pfImg) p.img = S.pfImg;
              if (appChanged) APPK.forEach(k => (p[k] = app));
              RECIPES[p.id] = pfRead();
              setPrice(p.id, price, "price");
              modal("");
              toast(`${n} güncellendi`);
              break;
            }
            const id = "u" + Date.now();
            PRODUCTS.push({
              id,
              cat,
              name: n,
              price,
              app,
              ty: app,
              mg: app,
              ys: app,
              stop: false,
              desc: $("#pf-desc").value.trim(),
              img: S.pfImg || "",
            });
            RECIPES[id] = pfRead();
            modal("");
            toast(`${n} menüye eklendi`);
            break;
          }
          case "prodEdit": {
            const p = P(b.dataset.p);
            if (p && p.combo) comboModal(p.id);
            else prodModal(b.dataset.p);
            return;
          }
          case "prodDelAsk": {
            const p = P(b.dataset.p);
            modal(
              `<h2>Ürünü sil</h2><p style="margin:0"><b>${esc(p.name)}</b> menüden kaldırılacak. Geçmiş siparişlerde ve raporlarda görünmeye devam eder.</p><button class="btn danger solid" data-act="prodDel" data-p="${p.id}">Onayla ve sil</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
            );
            return;
          }
          case "prodDel": {
            const p = P(b.dataset.p);
            p.archived = true;
            p.catName = catName(p.cat);
            modal("");
            render();
            toast(`${p.name} menüden kaldırıldı`, () => {
              p.archived = false;
              toast("Geri getirildi");
            });
            return;
          }
          case "readyModal":
            readyModal();
            return;
          case "rdSave": {
            const n = $("#rd-n").value.trim(),
              cat = $("#rd-cat").value,
              buy = +$("#rd-buy").value || 0,
              price = Math.round(+$("#rd-price").value || 0),
              err = t => {
                $("#rd-err").textContent = t;
              };
            if (!n) return err("Ürün adını yazın.");
            if (!cat) return err("Kategori seçin.");
            if (price <= 0) return err("Satış fiyatını yazın.");
            const k = "m" + Date.now(),
              id = "u" + Date.now();
            ING[k] = { n, u: "adet", c: "İçecek", cost: buy, pack: false, s: +$("#rd-s").value || 0, use: 0, crit: 0 };
            const app = sugApp(price);
            PRODUCTS.push({ id, cat, name: n, price, app, ty: app, mg: app, ys: app, stop: false });
            RECIPES[id] = [[k, 1]];
            modal("");
            toast(`${n} eklendi (stok + menü)`);
            break;
          }
          case "stop": {
            const p = P(b.dataset.p);
            p.stop = !p.stop;
            toast(p.stop ? `${p.name} tüm kanallarda kapatıldı` : `${p.name} tekrar satışta`);
            break;
          }
          case "modMulti": {
            const g = MODS.find(x => x.id === b.dataset.g);
            g.multi = b.dataset.v === "1";
            break;
          }
          case "modCat": {
            const g = MODS.find(x => x.id === b.dataset.g),
              c = b.dataset.c;
            g.cats = g.cats.includes(c) ? g.cats.filter(x => x !== c) : [...g.cats, c];
            break;
          }
          case "modDel": {
            const i = MODS.findIndex(x => x.id === b.dataset.g),
              g = MODS.splice(i, 1)[0];
            render();
            toast(`${g.n} grubu silindi`, () => {
              MODS.splice(i, 0, g);
              toast("Geri getirildi");
            });
            return;
          }
          case "modOptDel": {
            const g = MODS.find(x => x.id === b.dataset.g);
            g.opts.splice(+b.dataset.o, 1);
            break;
          }
          case "modOptAdd": {
            const g = MODS.find(x => x.id === b.dataset.g),
              id = g.id,
              n = $("#mo-n-" + id).value.trim();
            if (!n) {
              toast("Seçenek adını yazın");
              return;
            }
            const e = $("#mo-e-" + id).value,
              k = $("#mo-k-" + id).value,
              q = +$("#mo-q-" + id).value || 0,
              o2 = { n, p: Math.max(0, Math.round(+$("#mo-p-" + id).value || 0)) };
            if (e === "add") {
              if (!q) {
                toast("Eklenecek miktarı yazın");
                return;
              }
              o2.add = [[k, q]];
            }
            if (e === "rm") o2.rm = [k];
            g.opts.push(o2);
            toast(`${n} eklendi`);
            break;
          }
          case "modAdd": {
            const n = $("#mg-new").value.trim();
            if (!n) {
              toast("Grup adını yazın");
              return;
            }
            MODS.push({ id: "g" + Date.now(), n, multi: true, cats: [], opts: [] });
            toast(`${n} grubu eklendi; kategori seçip seçenek ekleyin`);
            break;
          }
          case "comboModal":
            comboModal(b.dataset.p);
            return;
          case "comboSave": {
            const n = $("#cb-n").value.trim(),
              fx = [0, 1, 2].map(i => $("#cb-f" + i).value).filter(Boolean),
              pc = $("#cb-pc").value,
              price = Math.round(+$("#cb-p").value || 0),
              err = x => {
                $("#cb-err").textContent = x;
              };
            if (!n) return err("Menü adını yazın.");
            if (!fx.length) return err("En az bir sabit ürün seçin.");
            if (price <= 0) return err("Menü fiyatını yazın.");
            const app = Math.round(+$("#cb-a").value || 0) || sugApp(price),
              combo = { fixed: fx, pick: pc ? [{ n: $("#cb-pn").value.trim() || "Seçim", cat: pc }] : [] };
            if (!CATS.some(c => c[0] === "menuler")) CATS.unshift(["menuler", "Menüler"]);
            const ep = b.dataset.p ? P(b.dataset.p) : null;
            if (ep) {
              Object.assign(ep, { name: n, price, combo });
              if (app !== ep.app) APPK.forEach(k => (ep[k] = app));
              setPrice(ep.id, price, "price");
            } else {
              const id = "c" + Date.now();
              PRODUCTS.push({ id, cat: "menuler", name: n, price, app, ty: app, mg: app, ys: app, stop: false, combo });
              RECIPES[id] = [];
            }
            act(ep ? "Menü güncellendi" : "Menü eklendi", n);
            modal("");
            toast(`${n} kaydedildi`);
            break;
          }
          case "prodCopy": {
            const p = P(b.dataset.p),
              id = (p.combo ? "c" : "u") + Date.now(),
              cp = JSON.parse(JSON.stringify(p));
            Object.assign(cp, { id, name: p.name + " (kopya)", archived: false, deleted: false, stop: false });
            PRODUCTS.splice(PRODUCTS.indexOf(p) + 1, 0, cp);
            RECIPES[id] = JSON.parse(JSON.stringify(RECIPES[p.id] || []));
            act("Ürün kopyalandı", `${p.name} → ${cp.name}`);
            render();
            if (p.combo) comboModal(id);
            else prodModal(id);
            toast("Kopya oluşturuldu: adını ve içeriğini değiştirin");
            return;
          }
          case "unarch": {
            const p = P(b.dataset.p);
            if (!CATS.some(c => c[0] === p.cat)) {
              const ex = CATS.find(c => c[1] === p.catName);
              if (ex) p.cat = ex[0];
              else CATS.push([p.cat, p.catName || "Arşivden"]);
            }
            p.archived = false;
            toast(`${p.name} menüye geri alındı`);
            break;
          }
          case "pDelFullAsk": {
            const p = P(b.dataset.p);
            modal(
              `<h2>Tamamen silinsin mi?</h2><p style="margin:0"><b>${esc(p.name)}</b> ve reçetesi kalıcı olarak silinir, arşivden de kalkar. Geçmiş siparişlerde adı görünmeye devam eder.</p><button class="btn danger solid" data-act="pDelFull" data-p="${p.id}">Onayla, tamamen sil</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
            );
            return;
          }
          case "pDelFull": {
            const p = P(b.dataset.p),
              nm = p.name;
            purgeProducts([p.id]);
            act("Ürün tamamen silindi", nm);
            modal("");
            toast(`${nm} tamamen silindi`);
            break;
          }
          default:
            return false;
        }
        render();
      }
      ACTIONS.push(menuActions);
    </script>

    <script>
      // Кнопки: расходы, напоминания, касса.

      function financeActions(a, b, o, byId, e) {
        switch (a) {
          case "z":
            zModal();
            return;
          case "addGider": {
            const amt = Math.round(+$("#g-amt").value || 0);
            if (amt <= 0) {
              toast("Tutarı yazın");
              $("#g-amt").focus();
              return;
            }
            GIDER.push({
              id: ++GID,
              cat: $("#g-cat").value,
              amt,
              date: $("#g-date").value || T0,
              note: $("#g-note").value.trim(),
              file: S.newFile || null,
            });
            S.newFile = null;
            toast(`${$("#g-cat").value}: ${fmt(amt)} eklendi`);
            break;
          }
          case "delGider": {
            const i = GIDER.findIndex(g => g.id === +b.dataset.id);
            if (i >= 0) GIDER.splice(i, 1);
            toast("Gider silindi");
            break;
          }
          case "remModal":
            remModal();
            return;
          case "saveRem": {
            const name = $("#r-name").value.trim(),
              amt = Math.round(+$("#r-amt").value || 0);
            if (!name || !$("#r-due").value) {
              toast("Ad ve tarih girin");
              return;
            }
            REM.push({
              id: Date.now(),
              name,
              cat: $("#r-cat").value,
              amt,
              due: $("#r-due").value,
              every: +$("#r-ev").value,
              notify: Math.max(0, +$("#r-not").value || 0),
            });
            modal("");
            toast("Hatırlatıcı kaydedildi");
            break;
          }
          case "paidRem": {
            const r = REM.find(x => x.id === +b.dataset.id);
            GIDER.push({ id: ++GID, cat: r.cat, amt: r.amt, date: today(), note: r.name });
            if (r.every) {
              r.due = addMonths(r.due, r.every);
              toast(`${r.name} ödendi, giderlere eklendi. Sonraki: ${dLong(r.due)}`);
            } else {
              REM.splice(REM.indexOf(r), 1);
              toast(`${r.name} ödendi`);
            }
            modal("");
            break;
          }
          case "delRem": {
            const i = REM.findIndex(x => x.id === +b.dataset.id);
            if (i >= 0) REM.splice(i, 1);
            break;
          }
          case "viewFis": {
            const g = GIDER.find(x => x.id === +b.dataset.id);
            modal(`<h2>Fiş · ${esc(g.cat)} ${fmt(g.amt)}</h2>${g.file.img ? `<img class="fisimg" src="${g.file.url}" alt="Fiş fotoğrafı">` : `<div class="hint">${esc(g.file.name)} (PDF) eklendi.</div>`}
         <div class="hint">${esc(g.file.name)} · ${dLong(g.date)}</div><button class="btn danger" data-act="rmFis" data-id="${g.id}">Fişi kaldır</button><button class="btn ghost" data-act="close">Kapat</button>`);
            return;
          }
          case "rmFis": {
            const g = GIDER.find(x => x.id === +b.dataset.id);
            g.file = null;
            modal("");
            toast("Fiş kaldırıldı");
            break;
          }
          case "kasaOpen":
            need("kasa", "Kasa açma", ok => {
              KASA.open = true;
              KASA.openAt = now();
              KASA.opening = Math.max(0, Math.round(+$("#k-open").value || 0));
              KASA.by = S.user.n;
              KASA.moves = [];
              act("Kasa açıldı", "Açılış " + fmt(KASA.opening), ok);
              toast("Kasa açıldı · açılış " + fmt(KASA.opening));
              render();
            });
            return;
          case "kasaMove":
            kasaMoveModal(b.dataset.t);
            return;
          case "kasaMoveDo": {
            const amt = Math.round(+$("#km-a").value || 0),
              t = b.dataset.t;
            if (amt <= 0) {
              toast("Tutarı yazın");
              return;
            }
            const why = $("#km-w").value,
              note = $("#km-n").value.trim(),
              g = t === "out" && $("#km-g")?.checked,
              gc = $("#km-c")?.value;
            need("kasa", "Kasa işlemi", ok => {
              KASA.moves.push({ t: now(), type: t, amt, why, note, u: S.user.n });
              if (g) GIDER.push({ id: ++GID, cat: gc, amt, date: today(), note: why + (note ? " · " + note : "") });
              act(t === "out" ? "Kasadan çıkış" : "Kasaya giriş", `${fmt(amt)} · ${why}${note ? " · " + note : ""}`, ok);
              modal("");
              toast(`${t === "out" ? "Kasadan çıkış" : "Kasaya giriş"}: ${fmt(amt)}${g ? " · gider kaydedildi" : ""}`);
              render();
            });
            return;
          }
          case "kasaClose":
            kasaCloseModal();
            return;
          case "kasaCloseDo": {
            const k = kasaCalc(),
              c = Math.round(+$("#kc-c").value || 0),
              d = c - Math.round(k.exp);
            need("kasa", "Kasa kapatma", ok => {
              KASA.hist.unshift({
                date: T0,
                opening: KASA.opening,
                cash: k.by.Nakit || 0,
                card: k.by.Kart || 0,
                online: k.by.Online || 0,
                exp: Math.round(k.exp),
                counted: c,
                diff: d,
                u: S.user.n,
              });
              KASA.open = false;
              act("Kasa kapatıldı", `Sayılan ${fmt(c)} · fark ${fmt(d)}`, ok);
              modal("");
              toast(d ? `Kasa kapatıldı · fark ${d > 0 ? "+" : ""}${fmt(d)}` : "Kasa kapatıldı · tam");
              render();
            });
            return;
          }
          default:
            return false;
        }
        render();
      }
      ACTIONS.push(financeActions);
    </script>

    <script>
      // Кнопки: сотрудники, смены, аванс, зарплата, курьеры.

      function staffActions(a, b, o, byId, e) {
        switch (a) {
          case "staffModal":
            staffModal(b.dataset.id);
            return;
          case "staffSave": {
            const n = $("#sf-n").value.trim(),
              pin = $("#sf-p").value.trim(),
              err = t => {
                $("#sf-err").textContent = t;
              };
            if (!n) return err("Adı yazın.");
            if (!/^\d{4}$/.test(pin)) return err("PIN 4 rakam olmalı.");
            const ex = b.dataset.id ? SF(+b.dataset.id) : null;
            if (STAFF.some(s => s.pin === pin && s !== ex)) return err("Bu PIN başka bir çalışanda var.");
            const role = $("#sf-r").value;
            if (ex && ex.id === S.user.id && role !== "admin") return err("Kendi yönetici rolünüzü değiştiremezsiniz.");
            const v = {
              n,
              pin,
              role,
              phone: $("#sf-ph").value.trim(),
              wageType: $("#sf-wt").value,
              wage: Math.max(0, +$("#sf-w").value || 0),
              fee: role === "kurye" ? Math.max(0, Math.round(+$("#sf-f").value || 0)) : 0,
              note: $("#sf-note").value.trim(),
            };
            if (ex) {
              Object.assign(ex, v);
              act("Personel güncellendi", n);
            } else {
              STAFF.push(Object.assign({ id: ++SID, active: true, adv: [], paid: {}, mh: 0 }, v));
              act("Personel eklendi", `${n} · ${ROLES[role].n}`);
            }
            modal("");
            toast(`${n} kaydedildi`);
            break;
          }
          case "staffDelAsk": {
            const s = SF(+b.dataset.id);
            if (s.id === S.user.id) {
              toast("Kendinizi silemezsiniz");
              return;
            }
            if (s.role === "admin" && STAFF.filter(x => x.role === "admin").length < 2) {
              toast("Son yönetici silinemez");
              return;
            }
            modal(
              `<h2>Personel silinsin mi?</h2><p style="margin:0"><b>${esc(s.n)}</b> (${ROLES[s.role].n}) listeden silinir, PIN'i ile artık giriş yapamaz. Geçmiş siparişlerde, vardiya ve işlem kayıtlarında adı kalır.</p><p class="hint" style="margin:0">Sadece bir süre çalışmayacaksa silmek yerine “Aktif” anahtarını kapatın.</p><button class="btn danger solid" data-act="staffDel" data-id="${s.id}">Onayla, sil</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
            );
            return;
          }
          case "staffDel": {
            const i = STAFF.findIndex(x => x.id === +b.dataset.id),
              s = STAFF[i];
            STAFF.splice(i, 1);
            act("Personel silindi", `${s.n} · ${ROLES[s.role].n}`);
            modal("");
            render();
            toast(`${s.n} silindi`, () => {
              STAFF.splice(i, 0, s);
              toast("Geri getirildi");
            });
            return;
          }
          case "staffOn": {
            const s = SF(+b.dataset.id);
            if (s.id === S.user.id) return;
            s.active = !s.active;
            act(s.active ? "Personel aktif" : "Personel pasif", s.n);
            toast(`${s.n}: ${s.active ? "aktif" : "pasif, giriş yapamaz"}`);
            break;
          }
          case "shiftIn": {
            const s = SF(+b.dataset.id);
            SHIFTS.push({ sid: s.id, in: now() });
            act("Vardiya giriş", s.n);
            toast(`${s.n} giriş yaptı · ${tStr(now())}`);
            break;
          }
          case "shiftOut": {
            const s = SF(+b.dataset.id),
              x = inNow(s.id);
            if (x) x.out = now();
            act("Vardiya çıkış", s.n);
            toast(`${s.n} çıkış yaptı · bugün ${hh(hToday(s.id))}`);
            break;
          }
          case "advModal": {
            const s = SF(+b.dataset.id);
            modal(`<h2>Avans · ${esc(s.n)}</h2><div class="hint">Bu ay hak ediş ${fmt(wageOf(s))} · avans ${fmt(advM(s))} · kalan ${fmt(wageOf(s) - advM(s) - paidM(s))}</div>
         ${fld("av-a", "Tutar (₺)", `<input id="av-a" class="num" type="number" min="1">`)}${fld("av-n", "Not", inp("av-n", "Avans"))}${KASA.open ? '<label class="check"><input type="checkbox" id="av-k" checked> Kasadan nakit verildi</label>' : ""}
         <button class="btn pri" data-act="advDo" data-id="${s.id}">Kaydet</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
            setTimeout(() => $("#av-a")?.focus(), 30);
            return;
          }
          case "advDo": {
            const s = SF(+b.dataset.id),
              amt = Math.round(+$("#av-a").value || 0),
              note = $("#av-n").value.trim() || "Avans";
            if (amt <= 0) {
              toast("Tutarı yazın");
              return;
            }
            s.adv.push({ date: T0, amt, note });
            GIDER.push({ id: ++GID, cat: "Maaş", amt, date: today(), note: `${note} · ${s.n}` });
            if ($("#av-k")?.checked)
              KASA.moves.push({ t: now(), type: "out", amt, why: "Personel avansı", note: s.n, u: S.user.n });
            act("Avans", `${s.n} · ${fmt(amt)}`);
            modal("");
            toast(`${s.n}: ${fmt(amt)} avans · giderlere yazıldı`);
            break;
          }
          case "wageAsk": {
            const s = SF(+b.dataset.id),
              k = wageOf(s) - advM(s) - paidM(s);
            modal(`<h2>Maaş ödemesi</h2><p style="margin:0"><b>${esc(s.n)}</b> · hak ediş ${fmt(wageOf(s))} − avans ${fmt(advM(s))}${paidM(s) ? " − ödenen " + fmt(paidM(s)) : ""} = <b>${fmt(k)}</b></p>
         ${fld("wg-a", "Ödenecek tutar (₺)", `<input id="wg-a" class="num" type="number" min="1" value="${k}">`)}<button class="btn pri" data-act="wageDo" data-id="${s.id}">Ödendi, gidere yaz</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
            return;
          }
          case "wageDo": {
            const s = SF(+b.dataset.id),
              amt = Math.round(+$("#wg-a").value || 0);
            if (amt <= 0) return;
            const mk2 = monthKey(T0);
            s.paid[mk2] = (s.paid[mk2] || 0) + amt;
            GIDER.push({ id: ++GID, cat: "Maaş", amt, date: today(), note: `Maaş · ${s.n}` });
            act("Maaş ödendi", `${s.n} · ${fmt(amt)}`);
            modal("");
            toast(`${s.n}: maaş ${fmt(amt)} giderlere yazıldı`);
            break;
          }
          case "cPay": {
            const s = SF(+b.dataset.id),
              cnt = closedToday().filter(o => o.courier === s.n).length,
              amt = cnt * (s.fee || 0) - (s.paid[T0] || 0);
            if (amt <= 0) return;
            s.paid[T0] = (s.paid[T0] || 0) + amt;
            GIDER.push({ id: ++GID, cat: "Kurye", amt, date: today(), note: `${s.n} · ${cnt} paket` });
            if (KASA.open) KASA.moves.push({ t: now(), type: "out", amt, why: "Kurye ödemesi", note: s.n, u: S.user.n });
            act("Kurye ödemesi", `${s.n} · ${fmt(amt)}`);
            toast(`${s.n}: ${fmt(amt)} ödendi${KASA.open ? " (kasadan)" : ""}`);
            break;
          }
          default:
            return false;
        }
        render();
      }
      ACTIONS.push(staffActions);
    </script>

            const d = D(b.dataset.d);
            toast(
              d.id === "okc"
                ? "ÖKC: test fişi yazdırıldı"
                : d.id === "cid"
                  ? "Caller ID: hat 1 dinleniyor"
                  : `${d.n}: test başarılı`,
            );
            return;
          }
          case "addPlat": {
            const n = $("#pl-n").value.trim();
            let u = $("#pl-u").value.trim();
            if (!n || !u) {
              toast("Ad ve adres girin");
              return;
            }
            if (!/^https?:\/\//.test(u)) u = "https://" + u;

            toast(`${n} eklendi`);
            break;
          }
          case "delPlat": {
            const i = PLATFORMS.findIndex(x => x.id === b.dataset.id);
            const x = PLATFORMS.splice(i, 1)[0];
            render();
            toast(`${x.n} kaldırıldı`, () => {
              PLATFORMS.splice(i, 0, x);
              toast("Geri getirildi");
            });
            return;
          }
          case "setTables": {
            const n = Math.min(60, Math.max(1, Math.round(+$("#tcount").value || 0))),
              busy = HALLS.Salon.filter((t, i) => i >= n && tableOrder(t) && tableOrder(t).items.length);
            if (busy.length) {
              toast(`Açık hesabı olan masa silinemez: ${busy.join(", ")}`);
              return;
            }
            HALLS.Salon = Array.from({ length: n }, (_, i) => "M" + (i + 1));
            toast(`Masa sayısı: ${n}`);
            break;
          }
          case "katAdd": {
            const n = $("#newkat").value.trim();
            if (!n) {
              toast("Kategori adını yazın");
              return;
            }
            if (CATS.some(c => c[1].toLocaleLowerCase("tr-TR") === n.toLocaleLowerCase("tr-TR"))) {
              toast("Bu kategori zaten var");
              return;
            }
            CATS.push(["k" + Date.now(), n]);
            toast(`${n} eklendi`);
            break;
          }
          case "katMove": {
            const i = CATS.findIndex(c => c[0] === b.dataset.id),
              j = i + +b.dataset.d;
            [CATS[i], CATS[j]] = [CATS[j], CATS[i]];
            break;
          }
          case "katDel": {
            const i = CATS.findIndex(c => c[0] === b.dataset.id);
            if (AP().some(p => p.cat === b.dataset.id)) return;
            const x = CATS.splice(i, 1)[0];
            render();
            toast(`${x[1]} silindi`, () => {
              CATS.splice(i, 0, x);
              toast("Geri getirildi");
            });
            return;
          }
          case "qrMake": {
            const x = $("#qrx").value.trim(),
              t = $("#qrt").value.trim();
            if (!x) {
              toast("Bağlantı veya metin girin");
              $("#qrx").focus();
              return;
            }
            S.qrList.unshift({ id: "q" + Date.now(), t: t || "QR kod", x });
            render();
            toast("QR oluşturuldu");
            break;
          }
          case "qrDel": {
            S.qrList = S.qrList.filter(q => q.id !== b.dataset.id);
            render();
            break;
          }
          case "qrPng": {
            const svg = $("#qc-" + b.dataset.id + " svg");
            if (!svg) {
              toast("QR hazır değil");
              return;
            }
            const q = b.dataset.id === "menu" ? { t: "Genel menü" } : S.qrList.find(z => z.id === b.dataset.id);
            const img = new Image(),
              sz = 1000;
            img.onload = () => {
              const c = document.createElement("canvas");
              c.width = c.height = sz;
              const g = c.getContext("2d");
              g.fillStyle = "#fff";
              g.fillRect(0, 0, sz, sz);
              g.drawImage(img, 0, 0, sz, sz);
              const fn = (S.rname + "-" + q.t).replace(/[^\wğüşıöçĞÜŞİÖÇ-]+/g, "-") + ".png";
              c.toBlob(async blob => {
                let dl = null;
                try {
                  dl = window.claude?.use ? await window.claude.use("downloads") : null;
                } catch (e) {}
                if (dl) {
                  try {
                    await dl.save({ filename: fn, data: blob });
                    toast("PNG kaydedildi");
                  } catch (e) {
                    if (e?.code !== "declined") toast("İndirme şu an kullanılamıyor");
                  }
                  return;
                }
                const a2 = document.createElement("a");
                a2.href = URL.createObjectURL(blob);
                a2.download = fn;
                document.body.appendChild(a2);
                a2.click();
                a2.remove();
              }, "image/png");
            };
            img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
            break;
          }
          case "qrPrint": {
            const el = $("#qc-" + b.dataset.id);
            if (!el) return;
            const f = document.createElement("iframe");
            f.style.cssText = "position:fixed;width:0;height:0;border:0;right:0;bottom:0";
            document.body.appendChild(f);
            const card = el.cloneNode(true);
            card.querySelector(".qract")?.remove();
            f.contentDocument.write(
              `<!doctype html><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif;display:grid;place-items:center;min-height:100vh}.c{text-align:center;display:grid;justify-items:center;gap:10px;border:2px solid #0d4f40;border-radius:18px;padding:28px 36px}.qrbrand{font-size:32px;font-weight:800;color:#0d4f40}.qrbrand b{color:#e9b44c}.qrbox{width:8cm;height:8cm}.qrbox svg{width:100%;height:100%}.qrt{font-size:24px}.purl{color:#555;font-size:13px}</style><div class="c">${card.innerHTML}</div>`,
            );
            f.contentDocument.close();
            setTimeout(() => {
              try {
                f.contentWindow.focus();
                f.contentWindow.print();
              } catch (e) {
                toast("Yazdırma açılamadı, PNG indirip yazdırın");
              }
              setTimeout(() => f.remove(), 1500);
            }, 150);
            break;
          }
          case "wzGo":
            S.wz = +b.dataset.s;
            break;
          case "wzFinish":
            toast(`Kurulum tamamlandı: ${AP().length} ürün, ${Object.keys(ING).length} malzeme, ${HALLS.Salon.length} masa`);
            S.view = "home";
            break;
          case "naAdd": {
            const n = $("#na-n").value.trim();
            if (!n) {
              toast("Malzeme adını yazın");
              $("#na-n").focus();
              return;
            }
            if (Object.values(ING).some(g => g.n.toLocaleLowerCase("tr-TR") === n.toLocaleLowerCase("tr-TR"))) {
              toast("Bu malzeme zaten var");
              return;
            }
            const u = $("#na-u").value,
              m = u === "g" ? 1000 : 1;
            ING["m" + Date.now()] = {
              n,
              u,
              c: $("#na-c").value,
              cost: (+$("#na-p").value || 0) / m,
              pack: $("#na-c").value === "Ambalaj",
              s: (+$("#na-s").value || 0) * m,
              use: 0,
              crit: 0,
            };
            toast(`${n} eklendi`);
            break;
          }
          case "resetAsk":
            modal(
              `<h2>Tüm veriler silinsin mi?</h2><p style="margin:0">Menü, malzemeler, reçeteler, kategoriler, masalar, siparişler ve müşteriler silinir. Program boş açılır. Demo verilerine dönmek için: Ayarlar → Veri ve yedek → Demoya dön.</p><button class="btn danger solid" data-act="doReset">Onayla, sıfırdan başla</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
            );
            return;
          case "doReset": {
            PRODUCTS.length = 0;
            CATS.length = 0;
            Object.keys(ING).forEach(k => delete ING[k]);
            Object.keys(RECIPES).forEach(k => delete RECIPES[k]);
            S.orders.length = 0;
            CUSTOMERS.length = 0;
            GIFTS.length = 0;
            LOG.length = 0;
            HALLS.Salon = [];
            S.sel.clear();
            RESV.length = 0;
            WASTE.length = 0;
            IKRAM.length = 0;
            PURCH.length = 0;
            SUPPLIERS.length = 0;
            MODS.length = 0;
            CAMPS.length = 0;
            S.wz = 1;
            S.showTables = true;
            modal("");
            toast("Program sıfırlandı. Kuruluma restoran adıyla başlayın.");
            break;
          }
          case "impGo": {
            const r = S.imp,
              key = n => n.trim().toLocaleLowerCase("tr-TR"),
              ik = {};
            let ni = 0,
              np = 0;
            r.ing.forEach(x => {
              let k = Object.keys(ING).find(k => key(ING[k].n) === key(x.n));
              if (!k) {
                k = "x" + Date.now() + "_" + ni++;
                ING[k] = {
                  n: x.n,
                  u: x.u,
                  c: /kutu|poşet|poset|ambalaj/i.test(x.n) ? "Ambalaj" : "Diğer",
                  pack: /kutu|poşet|poset|ambalaj/i.test(x.n),
                  s: 0,
                  use: 0,
                  crit: 0,
                };
              }
              ING[k].cost = x.u === "g" ? x.pr / 1000 : x.pr;
              ik[key(x.n)] = k;
            });
            r.prod.forEach(x => {
              const cn = guessCat(x.n);
              let c = CATS.find(c => c[1] === cn);
              if (!c) {
                c = ["k" + Date.now() + np, cn];
                CATS.push(c);
              }
              const lines = x.lines.map(([mn, q]) => [ik[key(mn)], q]);
              let p = AP().find(p => key(p.name) === key(x.n));
              if (!p) {
                p = { id: "u" + Date.now() + "_" + np++, cat: c[0], name: x.n, stop: false };
                PRODUCTS.push(p);
              }
              RECIPES[p.id] = lines;
              const pr = x.price || ceilTo(costOf(p.id) / (SET.fc / 100)),
                ap = x.app || sugApp(pr);
              Object.assign(p, { price: pr, app: ap, ty: ap, mg: ap, ys: ap });
            });
            modal("");
            toast(`İçe aktarıldı: ${r.ing.length} malzeme, ${r.prod.length} ürün`);
            break;
          }
          case "katArchAsk":
          case "katFullAsk": {
            const id = b.dataset.id,
              c = CATS.find(x => x[0] === id),
              n = AP().filter(p => p.cat === id).length,
              full = a === "katFullAsk";
            modal(`<h2>${full ? "Kategori tamamen silinsin mi?" : "Kategori arşive gönderilsin mi?"}</h2><p style="margin:0"><b>${esc(c[1])}</b> kategorisi ve içindeki <b>${n} ürün</b> ${full ? "reçeteleriyle birlikte <b>kalıcı olarak silinir</b>. Geçmiş siparişlerde ürün adları görünmeye devam eder." : "menüden kalkar. Raporlarda kalır; Menü → Arşiv'den tek tek geri alabilirsiniz."}</p>
         <button class="btn ${full ? "danger solid" : "pri"}" data-act="${full ? "katFull" : "katArch"}" data-id="${id}">Onayla</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
            return;
          }
          case "katArch": {
            const id = b.dataset.id,
              i = CATS.findIndex(x => x[0] === id),
              c = CATS[i],
              ps = AP().filter(p => p.cat === id);
            ps.forEach(p => {
              p.archived = true;
              p.catName = c[1];
            });
            CATS.splice(i, 1);
            act("Kategori arşivlendi", `${c[1]} · ${ps.length} ürün`);
            modal("");
            render();
            toast(`${c[1]} ve ${ps.length} ürün arşive gönderildi`, () => {
              CATS.splice(i, 0, c);
              ps.forEach(p => (p.archived = false));
              toast("Geri getirildi");
            });
            return;
          }
          case "katFull": {
            const id = b.dataset.id,
              i = CATS.findIndex(x => x[0] === id),
              c = CATS[i],
              ids = PRODUCTS.filter(p => p.cat === id).map(p => p.id),
              n = purgeProducts(ids);
            CATS.splice(i, 1);
            MODS.forEach(g => (g.cats = g.cats.filter(x => x !== id)));
            act("Kategori tamamen silindi", `${c[1]} · ${n} ürün`);
            modal("");
            toast(`${c[1]} ve ${n} ürün tamamen silindi`);
            break;
          }
          case "printTest":
            toast(`${D("kp").on ? "Mutfak yazıcısı" : "Yazıcı bağlı değil"}: test fişi (demo)`);
            return;
          case "pairModal":
            pairModal();
            return;
          case "pairDo": {
            DEVICES.push({ id: Date.now(), n: $("#pr-n").value.trim() || "Yeni cihaz", t: "Tarayıcı", on: true });
            modal("");
            toast("Cihaz bağlandı (demo)");
            break;
          }
          case "tgOffline": {
            S.forceOff = !S.forceOff;
            if (!isOff() && S.offQ) {
              toast(`İnternet geldi: ${S.offQ} işlem gönderildi`);
              S.offQ = 0;
            } else
              toast(
                S.forceOff ? "Çevrimdışı mod: program çalışmaya devam ediyor, işlemler bu cihazda bekliyor" : "Çevrimiçi",
              );
            break;
          }
          case "intTy": {
            const I = INTEG.trendyol;
            I.sid = $("#it-sid").value.trim();
            I.key = $("#it-key").value.trim();
            I.sec = $("#it-sec").value.trim();
            if (!I.sid || !I.key || !I.sec) {
              I.on = false;
              toast("Satıcı ID, API Key ve Secret gerekli");
              break;
            }
            I.on = true;
            act("Entegrasyon", "Trendyol Yemek bağlandı (demo)");
            toast("Trendyol Yemek: bağlantı başarılı (demo)");
            break;
          }
          case "intToggle": {
            const I = INTEG[b.dataset.k];
            I.on = !I.on;
            toast(I.on ? "Bağlı olarak işaretlendi (demo)" : "Bağlantı kesildi");
            break;
          }
          case "intEf": {
            const E = INTEG.efat;
            E.prov = $("#ef-p").value;
            E.vkn = $("#ef-v").value.trim();
            E.title = $("#ef-t").value.trim();
            E.auto = $("#ef-a").checked;
            E.on = !!(E.prov && E.vkn && E.title);
            toast(E.on ? "e-Arşiv ayarları kaydedildi (demo)" : "Entegratör, VKN ve ünvan gerekli");
            break;
          }
          case "intSync":
            INTEG.sync = !INTEG.sync;
            toast(INTEG.sync ? "Menü senkronizasyonu açık" : "Menü senkronizasyonu kapalı");
            break;
          case "tgSave":
            S.autosave = !S.autosave;
            if (!S.autosave) {
              try {
                localStorage.removeItem(SKEY);
              } catch (e) {}
            }
            toast(S.autosave ? "Otomatik kayıt açık" : "Otomatik kayıt kapalı · bu cihazdaki kayıt silindi");
            break;
          case "backupDl": {
            const name = `${S.rname}-yedek-${T0}.json`.replace(/\s+/g, "-");
            saveFile(name, new Blob([JSON.stringify(snapshot(), null, 1)], { type: "application/json" }), "application/json");
            act("Yedek indirildi", name);
            return;
          }
          case "demoAsk":
            modal(
              `<h2>Demoya dönülsün mü?</h2><p style="margin:0">Bu cihazdaki kayıtlı veriler silinir, sayfa yenilenir ve demo verileri yüklenir.</p><button class="btn danger solid" data-act="demoDo">Onayla</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
            );
            return;
          case "demoDo":
            S.autosave = false;
            clearTimeout(persist.t);
            try {
              localStorage.removeItem(SKEY);
            } catch (e) {}
            location.reload();
            return;
          case "bkGo": {
            if (restore(S.bk)) {
              S.bk = null;
              modal("");
              act("Yedekten geri yüklendi", "");
              toast("Yedek yüklendi");
              S.view = "home";
              break;
            }
            toast("Yedek dosyası uyumsuz");
            return;
          }
          default:
            return false;
        }
        render();
      }
      ACTIONS.push(settingsActions);
    </script>

    <!-- ============================== js/actions/courier.js ============================== -->
    <script>
      // Кнопки курьера.

      function courierActions(a, b, o, byId, e) {
        switch (a) {
          case "kTake": {
            const x = byId();
            if (x.courier && x.courier !== S.user.n) {
              toast(`Bu siparişi ${x.courier} aldı`);
              break;
            }
            x.courier = S.user.n;
            act("Kurye siparişi aldı", x.code || "#" + x.id);
            toast(`${oTitle(x)} siparişini aldınız`);
            break;
          }
          case "kGo": {
            const x = byId();
            if (!setStage(x, "kuryede")) return;
            break;
          }
          case "kDone":
            kDoneModal(byId());
            return;
          case "kDoneDo": {
            const x = byId();
            x.collect = x.pay === "Online" ? "Online" : document.querySelector('input[name="kc"]:checked')?.value || "Nakit";
            modal("");
            setStage(x, "teslim");
            act("Teslim edildi", `${x.code || "#" + x.id} · ${x.collect} · ${fmt(net(x))}`);
            break;
          }
          default:
            return false;
        }
        render();
      }
      ACTIONS.push(courierActions);
    </script>

    <!-- ============================== js/main.js ============================== -->
    <script>
      // Запуск: загрузка сохранённых данных, часы, статус интернета.

      setInterval(
        () => document.querySelectorAll("[data-since]").forEach(el => (el.textContent = ago(+el.dataset.since))),
        20000,
      );

      S.autosave = true;

      try {
        const raw = localStorage.getItem(SKEY);
        if (raw && restore(JSON.parse(raw))) S.restored = true;
      } catch (e) {
        console.warn("Kayıt okunamadı", e);
      }

      window.addEventListener("online", () => {
        if (S.offQ && !S.forceOff) {
          toast(`İnternet geldi: ${S.offQ} işlem gönderildi`);
          S.offQ = 0;
        }
        render();
      });

      window.addEventListener("offline", () => {
        toast("İnternet kesildi: program çalışmaya devam ediyor");
        render();
      });

      document.title = APP_NAME;

      lgClock();
      setInterval(lgClock, 15000);

      (() => {
        const a = S.orders.filter(o => o.status === "acik" && (o.channel !== "masa" || o.items.some(i => i.sent))).length,
          el = $("#lg-open");
        if (el) el.textContent = a;
      })();
    </script>
  </body>
