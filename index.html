      // Левое меню и отрисовка открытого раздела (render).

      const TITLES = {
        home: "Ana Sayfa",
        pos: "Adisyon",
        kitchen: "Mutfak Ekranı",
        stock: "Stok Takip",
        cust: "Müşteriler",
        menu: "Menü ve Fiyatlar",
        gider: "Giderler",
        report: "Rapor",
        dev: "Cihazlar",
        plat: "Platformlar",
        set: "Ayarlar",
        kasa: "Kasa",
        staff: "Personel",
        takip: "Takip ve istatistik",
        kurye: "Paket siparişleri",
      };

      function render() {
        if (!S.user) return;
        if (!viewOK(S.view)) S.view = RL().views === "all" ? "home" : RL().views[0];
        const pending = S.orders.filter(o => o.status === "acik" && o.stage === "yeni").length,
          kq = kitchenQueue().length,
          cr = urgent().length;
        $("#rail").innerHTML =
          `<div class="logo">${esc(S.rname)}</div>` +
          [
            ["kurye", "Paketler", S.orders.filter(o => o.status === "acik" && o.channel !== "masa" && !o.courier).length],
            ["home", "Ana Sayfa", pending],
            ["kitchen", "Mutfak", kq],
            ["stock", "Stok", cr],
            ["cust", "Müşteri", 0],
            ["menu", "Menü", 0],
            ["kasa", "Kasa", KASA.open ? 0 : "!"],
            ["staff", "Personel", 0],
            ["gider", "Gider", dueRems().length],
            ["report", "Rapor", 0],
            ["takip", "Takip", 0],
            ["plat", "Platform", 0],
            ["set", "Ayarlar", 0],
          ]
            .filter(([v]) => viewOK(v) && (v !== "kurye" || S.user.role === "kurye"))
            .map(
              ([v, l, b]) =>
                `<button class="navbtn ${S.view === v || (v === "home" && S.view === "pos") ? "on" : ""}" data-act="nav" data-v="${v}">${IC[v]}<span>${l}</span>${b ? `<span class="badge">${b}</span>` : ""}</button>`,
            )
            .join("") +
          `<div class="spacer"></div><button class="navbtn out" data-act="logout">${IC.out}<span>Çıkış</span></button>`;
        const dr = RL().views === "all" ? dueRems().length + (urgent().length ? 1 : 0) : 0;
        $("#bell").innerHTML =
          `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>${dr ? `<span class="badge">${dr}</span>` : ""}`;
        $("#who").innerHTML = S.user.n === RL().n ? `<b>${esc(S.user.n)}</b>` : `<b>${esc(S.user.n)}</b> · ${RL().n}`;
        $("#net").innerHTML = isOff()
          ? `<span class="netst">Çevrimdışı${S.offQ ? ` · ${S.offQ} işlem bekliyor` : ""}</span>`
          : "";
        const o = S.view === "pos" ? S.orders.find(x => x.id === S.activeId) : null;
        $("#vtitle").textContent = o ? (o.channel === "masa" ? "Masa " + o.table : "Yeni paket sipariş") : TITLES[S.view];
        $("#view").innerHTML = {
          home: vHome,
          pos: vPos,
          kitchen: vKitchen,
          stock: vStock,
          cust: vCust,
          menu: vMenu,
          gider: vGider,
          report: vReport,
          dev: vDev,
          plat: vPlat,
          set: vSet,
          kasa: vKasa,
          staff: vStaff,
          kurye: vKurye,
          takip: vTakip,
        }[S.view]();
        persist();
      }
    </script>

    <!-- ============================== js/views/home.js ============================== -->
    <script>
      // Ana Sayfa: столы и все заказы.

      function tileChip(o) {
        if (!o.items.length) return '<span class="chip">Oturdu</span>';
        if (o.items.some(i => !i.sent))
          return '<span class="chip bad" title="Mutfağa gönderilmemiş ürün var">Yeni ürün</span>';
        const m = { alindi: "warn", hazirlaniyor: "warn", hazir: "ok", servis: "ok" },
          l = { alindi: "Alındı", hazirlaniyor: "Hazırlanıyor", hazir: "Hazır", servis: "Servis" };
        return `<span class="chip ${m[o.stage] || ""}">${l[o.stage] || ""}</span>`;
      }

      function vHome() {
        const tiles = HALLS.Salon.map(t => {
          const o = tableOrder(t);
          if (!o || (!o.items.length && !o.custId)) {
            const rv = resFor(t);
            return `<button class="tile free ${rv ? "resv" : ""}" data-act="table" data-t="${t}" ${rv ? `title="${esc(rv.name)} · ${rv.people} kişi"` : ""}><span class="tn">${t}</span><span class="st">${rv ? `Rez. ${rv.time} · ${rv.people} kişi` : "Boş"}</span></button>`;
          }
          const c = now() - o.createdAt > 40 * 60000 ? "var(--warn)" : o.stage === "hazir" ? "var(--ok)" : "var(--accent)";
          return `<button class="tile busy" style="--c:${c}" data-act="table" data-t="${t}"><span class="tt"><span class="tn">${t}</span>${tileChip(o)}</span>${o.custId ? `<span class="cn">${esc(C(o.custId).name)}</span>` : ""}<span class="tf"><span class="amt num">${fmt(net(o))}</span><span class="st" data-since="${o.createdAt}">${ago(o.createdAt)}</span></span></button>`;
        }).join("");
        const busy = HALLS.Salon.filter(t => {
          const o = tableOrder(t);
          return o && (o.items.length || o.custId);
        }).length;
        const fit = o => S.ofilt === "tum" || (S.ofilt === "masa") === (o.channel === "masa");
        const isAct = o => o.status === "acik" && (o.channel !== "masa" || o.items.some(i => i.sent));
        const all = S.orders.filter(isAct);
        const act = all.filter(fit).sort((a, b) => a.createdAt - b.createdAt);
        const done = S.orders
          .filter(o => ["kapali", "iptal"].includes(o.status) && fit(o))
          .sort((a, b) => (b.closedAt || 0) - (a.closedAt || 0))
          .slice(0, 15);
        const nYeni = all.filter(o => o.stage === "yeni").length,
          nMut = kitchenQueue().length,
          nYol = all.filter(o => o.stage === "kuryede").length;
        const ciro = S.orders.filter(o => o.status === "kapali").reduce((s, o) => s + net(o), 0);
        const LANES = [
          ["yeni", "Yeni", ["yeni", "alindi"], "var(--bad)"],
          ["mut", "Hazırlanıyor", ["hazirlaniyor"], "var(--warn)"],
          ["hazir", "Hazır · Yolda · Serviste", ["hazir", "kuryede", "servis"], "var(--ok)"],
        ];
        const lanes =
          S.otab === "aktif"
            ? `<div class="lanes">${LANES.map(([k, n, st, c]) => {
                const l = act
                  .filter(o => st.includes(o.stage))
                  .sort((a, b) => (b.stage === "yeni") - (a.stage === "yeni") || a.createdAt - b.createdAt);
                return `<section class="lane" style="--lc:${c}"><header><span class="ldot"></span><h3>${n}</h3><span class="lcount num">${l.length}</span></header><div class="lbody">${l.length ? l.map(oCard).join("") : `<div class="lempty">Sipariş yok</div>`}</div></section>`;
              }).join("")}</div>`
            : `<div class="donegrid">${done.length ? done.map(oCard).join("") : `<div class="empty">Burada sipariş yok.</div>`}</div>`;
        setTimeout(() => (S.otab === "aktif" ? act : done).forEach(o => S.seen.add(o.id)), 2500);
        return `${!KASA.open && can("kasa") ? `<div class="warnbar" style="margin-bottom:12px"><b>Kasa açılmadı.</b><span style="flex:1;min-width:0">Güne başlamak için kasadaki nakdi sayıp girin.</span><button class="btn pri" data-act="nav" data-v="kasa">Kasayı aç</button></div>` : ""}<div class="hbar">
         <div class="hstrip">
          <div class="hs ${nYeni ? "alert" : ""}"><span class="lbl">Onay bekleyen</span><b class="num">${nYeni}</b></div>
          <div class="hs"><span class="lbl">Mutfakta</span><b class="num">${nMut}</b></div>
          <div class="hs"><span class="lbl">Kuryede</span><b class="num">${nYol}</b></div>
          <div class="hs"><span class="lbl">Dolu masa</span><b class="num">${busy}<small> / ${HALLS.Salon.length}</small></b></div>
          <div class="hs"><span class="lbl">Rezervasyon</span><b class="num">${resToday().length}</b></div>
         </div>
         <button class="btn tblbtn ${S.showTables ? "on" : ""}" data-act="tglTables" aria-expanded="${S.showTables}">${IC.home} Masalar <span class="num">${busy}/${HALLS.Salon.length}</span> ${S.showTables ? "▴" : "▾"}</button>
         <div class="hsact"><button class="btn" data-act="newPaket">${IC.plus} Yeni paket sipariş</button><button class="btn pri" data-act="sim">${IC.plus} Platform siparişi (demo)</button></div>
        </div>
        <div class="home ${S.showTables ? "" : "notables"}">
        ${S.showTables ? "" : "<!--"}<section class="tables"><div class="sechead"><h2 class="sec">Masalar</h2><div class="legend"><span style="--c:var(--accent)">Dolu</span><span style="--c:var(--ok)">Hazır</span><span style="--c:var(--warn)">40 dk+</span></div></div>
         <div class="floor">${tiles}</div></section>${S.showTables ? "" : "-->"}
        <section class="board">
         <div class="sechead"><h2 class="sec">Siparişler</h2>
          <div class="tabs sm" style="margin:0"><button class="tab ${S.otab === "aktif" ? "on" : ""}" data-act="otab" data-f="aktif">Aktif (${act.length})</button><button class="tab ${S.otab === "bitti" ? "on" : ""}" data-act="otab" data-f="bitti">Tamamlanan</button></div>
          <label class="tg sm"><button class="switch ${S.autoAccept ? "on" : ""}" role="switch" aria-checked="${S.autoAccept}" data-act="tgAccept" aria-label="Otomatik onay"></button><span>Otomatik onay</span></label>
          <div class="seg2" role="group" aria-label="Filtre">${[
            ["tum", "Tümü"],
            ["masa", "Masa"],
            ["paket", "Paket"],
          ]
            .map(([k, n]) => `<button class="${S.ofilt === k ? "on" : ""}" data-act="ofilt" data-f="${k}">${n}</button>`)
            .join("")}</div></div>
         ${lanes}
        </section></div>`;
      }

      function oCard(o) {
        const c = CH[o.channel],
          on = online(o),
          closed = o.status !== "acik";
        const steps = on ? ON : OFF,
          si = steps.findIndex(s => s[0] === o.stage);
        const cu = o.custId && C(o.custId);
        const who =
          o.channel === "masa" ? `<b>Masa ${o.table}</b>${cu ? ` · ${esc(cu.name)}` : ""}` : `<b>${esc(oTitle(o))}</b>`;
        const sub = on && o.customer?.address ? `<div class="cust">${esc(o.customer.address)}</div>` : "";
        const items = `<div class="oitems">${o.items.map(i => `${i.qty}× ${esc(iName(i))}${i.mods && i.mods.length ? ` <small>(${esc(iMods(i))})</small>` : ""}${i.ikram ? " <small>(ikram)</small>" : ""}${i.note ? ` <small>(${esc(i.note)})</small>` : ""}`).join(", ")}</div>`;
        const note = o.note ? `<div class="onote">Not: ${esc(o.note)}</div>` : "";
        let match = "";
        if (on && !closed) {
          if (cu)
            match = `<div class="mline ok">${IC.cust}<b>${esc(cu.name)}</b> · ${cu.visits + 1}. sipariş${loyCounts(o) && LOY.on ? (loyGiftDue(cu) ? ` <span class="giftchip">${IC.gift}${LOY.type === "disc" ? `%${LOY.pct} indirimli sipariş${o.loyDisc ? " ✓" : ""}` : `Hediyeli sipariş${o.items.some(i => i.gift) ? " ✓" : ""}`}</span>` : ` · sadakat ${loyNext(cu)}/${LOY.every}`) : ""}</div>`;
          else if (o.channel !== "telefon") {
            const m = matchCustomer(o);
            match = m
              ? `<div class="mline">Kayıtlı adres: <b>${esc(m.name)}</b> · ${m.visits} sipariş <button class="lnk" data-act="linkCust" data-id="${o.id}" data-c="${m.id}">Bağla</button></div>`
              : `<div class="mline">Yeni müşteri <button class="lnk" data-act="custFromOrder" data-id="${o.id}">Kaydet</button></div>`;
          }
        }
        let ctrl = "";
        if (closed)
          ctrl = `<div class="lbl">${o.status === "iptal" ? (o.cancelReason ? "İptal edildi · " + esc(o.cancelReason) : "Reddedildi") : STL[o.stage] || "Kapandı"} · ${ago(o.closedAt || o.createdAt)}</div>`;
        else if (false) ctrl = "";
        else if (o.stage === "yeni")
          ctrl = `<div class="lbl" style="color:var(--bad)">Onay bekliyor</div><div class="row"><button class="btn pri" style="flex:1" data-act="accept" data-id="${o.id}">Onayla</button><button class="btn danger" data-act="reject" data-id="${o.id}">Reddet</button></div>`;
        else {
          const nx = steps[si + 1];
          ctrl = `<div class="stline"><span class="stpill">${STL[o.stage]}</span><button class="prbtn" data-act="receipt" data-id="${o.id}" title="Adisyonu yazdır${o.prints ? ` (${o.prints} kez yazdırıldı)` : ""}" aria-label="Adisyonu yazdır">${IC.print}${o.prints ? `<small>${o.prints}</small>` : ""}</button>${nx ? `<button class="btn pri nextbtn" data-act="stage" data-id="${o.id}" data-s="${nx[0]}">${nx[1]} →</button>` : ""}</div>
         <div class="prog" style="--n:${steps.length}" role="group" aria-label="Sipariş durumu">${steps.map(([k, l], i) => `<button class="${i < si ? "done" : i === si ? "cur" : ""}" data-act="stage" data-id="${o.id}" data-s="${k}" title="${l}" aria-label="${l}" aria-pressed="${i === si}"><i></i><span>${l}</span></button>`).join("")}</div>`;
          if (on && ["alindi", "hazirlaniyor", "hazir"].includes(o.stage))
            ctrl += `<div class="row"><select class="sel" id="cr-${o.id}" data-act="courier" data-id="${o.id}" aria-label="Kurye seç"><option value="">Kurye seçin</option>${couriers()
              .map(k => `<option ${o.courier === k ? "selected" : ""}>${k}</option>`)
              .join("")}</select></div>`;
          if (on)
            ctrl += `<div class="row lnks"><button class="lnk danger" data-act="cancelAsk" data-id="${o.id}">Siparişi iptal et</button></div>`;
          if (on && o.stage === "kuryede")
            ctrl += `<div class="hint">Kurye: <b>${esc(o.courier)}</b> · ${esc(o.pay || "")}</div>`;
          const pr = "";
          if (o.channel === "masa" && cu && LOY.on && loyGiftDue(cu))
            ctrl += `<div class="mline"><span class="giftchip">${IC.gift}${LOY.type === "disc" ? `%${LOY.pct} indirimli sipariş${o.loyDisc ? " ✓" : ""}` : `Hediyeli sipariş${o.items.some(i => i.gift) ? " ✓" : ": " + esc(P(LOY.gift)?.name || "—")}`}</span></div>`;
          if (o.channel === "masa")
            ctrl += `<div class="row lnks">${o.items.some(i => !i.sent) ? '<span class="chip bad">Gönderilmemiş ürün var</span>' : ""}<button class="lnk" data-act="openTable" data-id="${o.id}">Adisyonu aç</button><button class="lnk" data-act="payFrom" data-id="${o.id}">Ödeme al</button></div>`;
        }
        return `<article class="oc ${S.seen.has(o.id) ? "" : "fresh"}" style="--c:${c.c}">
        <div class="oh"><span class="ch" style="--c:${c.c}">${c.n}</span><span class="oid">${o.code || "#" + o.id}</span><span class="hint" data-since="${o.createdAt}">${ago(o.createdAt)}</span><b class="num" style="margin-left:auto">${fmt(net(o))}</b></div>
        <div>${who}</div>${sub}${items}${note}${match}${ctrl}</article>`;
      }
    </script>

    <!-- ============================== js/views/pos.js ============================== -->
    <script>
      // Адисьон стола/телефонного заказа, оплата, окна опций, ikram, перенос.

      function vPos() {
        const o = S.orders.find(x => x.id === S.activeId);
        if (!o) {
          S.view = "home";
          return vHome();
        }
        if (!CATS.some(c => c[0] === S.cat) && CATS.length) S.cat = CATS[0][0];
        const cats = CATS.map(
          ([id, n]) => `<button class="tab ${S.cat === id ? "on" : ""}" data-act="cat" data-c="${id}">${n}</button>`,
        ).join("");
        const prods = AP()
          .filter(p => p.cat === S.cat)
          .map(p => {
            const inCart = o.items.filter(i => i.pid === p.id && !i.sent).reduce((s, i) => s + i.qty, 0);
            const cm = canMake(p.id),
              left = cm === Infinity ? null : cm - inCart,
              opt = p.combo || modsFor(p).length;
            const tag =
              left === null
                ? ""
                : `<span class="left ${left <= 0 ? "out" : left <= 5 ? "low" : ""}">${left <= 0 ? "Malzeme bitti" : left + " porsiyon yapılabilir"}</span>`;
            return `<button class="prod" data-act="add" data-p="${p.id}" ${p.stop || (left !== null && left <= 0) ? "disabled" : ""}><span class="pn">${esc(p.name)}</span>${p.combo ? `<span class="left">${comboTxt(p)}</span>` : ""}${tag}<span class="pp num">${fmt(priceFor(p, o.channel))}${opt ? ' <small class="optmark">seçenekli</small>' : ""}</span></button>`;
          })
          .join("");
        const lines = o.items.length
          ? o.items
              .map(
                (
                  i,
                  ix,
                ) => `<div class="line ${i.sent ? "" : "new"} ${i.gift || i.ikram ? "giftline" : ""}"><div class="ln">${esc(iName(i))}${i.gift ? ' <span class="giftchip">Hediye</span>' : ""}${i.ikram ? ' <span class="giftchip">İkram</span>' : ""}${i.mods && i.mods.length ? `<small class="mods">${esc(iMods(i))}</small>` : ""}${i.note ? `<small class="mods">Not: ${esc(i.note)}</small>` : ""}<small>${i.sent ? (i.ready ? "Hazır" : "Mutfakta · " + ago(i.sentAt)) : "Yeni · gönderilmedi"}</small></div>
         <div class="qty"><button data-act="qty" data-i="${ix}" data-d="-1" aria-label="Azalt">−</button><span class="num">${i.qty}</span><button data-act="qty" data-i="${ix}" data-d="1" aria-label="Arttır" ${i.ikram ? "disabled" : ""}>+</button></div>
         <div class="lnr"><span class="num">${fmt(i.price * i.qty)}</span>${i.sent ? `<button class="lact" data-act="lineAct" data-i="${ix}" title="İkram veya iptal" aria-label="İkram veya iptal">⋯</button>` : `<button class="lact" data-act="lineNote" data-i="${ix}" title="Not ekle" aria-label="Not ekle">✎</button>`}</div></div>`,
              )
              .join("")
          : `<div class="empty">Önce ürünleri seçin.</div>`;
        const unsent = o.items.some(i => !i.sent);
        let head,
          extra = "",
          acts;
        const lc = o.custId && C(o.custId),
          gb =
            lc && loyCounts(o) && loyGiftDue(lc)
              ? (() => {
                  const low = total(o) < LOY.min;
                  if (LOY.type === "disc") {
                    const has = o.loyDisc;
                    return `<div class="giftbar">${IC.gift}<div style="min-width:0"><b>Bu sipariş %${LOY.pct} indirimli!</b><span>${esc(lc.name)} · ${LOY.every}. sipariş · sadakat indirimi</span>${low ? `<span class="warnt">İndirim için sipariş en az ${fmt(LOY.min)} olmalı</span>` : ""}</div>${has ? '<span class="giftok">Uygulandı ✓</span>' : `<button class="btn pri" data-act="addLoyDisc">İndirimi uygula</button>`}</div>`;
                  }
                  const has = o.items.some(i => i.gift);
                  return `<div class="giftbar">${IC.gift}<div style="min-width:0"><b>Bu sipariş hediyeli!</b><span>${esc(lc.name)} · ${LOY.every}. sipariş · Hediye: ${esc(P(LOY.gift)?.name || "—")}</span>${low ? `<span class="warnt">Hediye için sipariş en az ${fmt(LOY.min)} olmalı</span>` : ""}</div>${has ? '<span class="giftok">Eklendi ✓</span>' : `<button class="btn pri" data-act="addGift">Hediyeyi ekle</button>`}</div>`;
                })()
              : "";
        const cf = campFor(o)[0],
          ac = o.camp && CAMPS.find(c => c.id === o.camp);
        const cb = ac
          ? `<div class="campbar on"><span>Kampanya: <b>${esc(ac.n)}</b> · −${fmt(campAmt(o))}</span><button class="btn ghost" data-act="campRemove">Kaldır</button></div>`
          : cf
            ? `<div class="campbar"><span><b>${esc(cf.n)}</b> uygulanabilir · ${esc(campDesc(cf))}</span><button class="btn pri" data-act="campApply" data-c="${cf.id}">Uygula</button></div>`
            : "";
        if (o.channel === "masa") {
          const c = o.custId && C(o.custId);
          head =
            `<h2>Masa ${o.table}</h2><span class="hint" data-since="${o.createdAt}">${ago(o.createdAt)}</span>` +
            (c
              ? `<div class="custchip"><span><b>${esc(c.name)}</b> · bugün ${c.visits + 1}. ziyaret${LOY.on ? ` · sadakat ${loyNext(c)}/${LOY.every}` : ""}${c.note ? `<br><span class="hint">${esc(c.note)}</span>` : ""}</span><button class="btn ghost" data-act="custModal">Değiştir</button></div>`
              : `<button class="btn ghost" style="width:100%" data-act="custModal">${IC.cust} Müşteri bağla</button>`);
          acts = `<button class="btn pri wide" data-act="send" ${unsent ? "" : "disabled"}>Mutfağa gönder</button>
         <button class="btn" data-act="move">Masa taşı</button><button class="btn" data-act="mergeModal">Masa birleştir</button>
         <button class="btn" data-act="itemMoveModal" ${o.items.length ? "" : "disabled"}>Ürün taşı</button><button class="btn pri" data-act="pay" ${o.items.length ? "" : "disabled"} style="background:var(--fg);color:var(--bg)">Ödeme al</button>`;
        } else {
          const c = o.custId && C(o.custId),
            cu = o.customer;
          head = `${o.call ? `<div class="callbar">${IC.phone}<span>Gelen arama · <b class="num">${esc(o.call)}</b>${c ? ` · ${esc(c.name)} · ${c.visits + 1}. sipariş` : " · kayıtlı değil"}</span></div>` : ""}
         <h2>Paket sipariş</h2><span class="ch" style="--c:${CH.telefon.c}">Telefon</span>
         <div class="tf2"><div class="field"><label class="lbl" for="tf-phone">Telefon</label><input id="tf-phone" class="num" data-act="tf" data-f="phone" value="${esc(cu.phone)}" placeholder="05xx xxx xx xx"></div>
         <div class="field"><label class="lbl" for="tf-name">Ad soyad</label><input id="tf-name" data-act="tf" data-f="name" value="${esc(cu.name)}" placeholder="Müşteri adı"></div></div>
         ${c && c.note ? `<div class="hint" style="width:100%">Müşteri notu: ${esc(c.note)}</div>` : ""}`;
          const saved = c ? c.addresses : [];
          extra = `<div class="field"><label class="lbl" for="tf-addr">Teslimat adresi *</label><textarea id="tf-addr" data-act="tf" data-f="address" placeholder="Mahalle, sokak, no, daire, tarif">${esc(cu.address)}</textarea></div>
         ${saved.length ? `<div class="addrchips"><span class="hint">Kayıtlı:</span>${saved.map((a, i) => `<button class="chipbtn" data-act="useAddr" data-i="${i}">${esc(a)}</button>`).join("")}</div>` : ""}
         <label class="check"><input type="checkbox" id="tf-save" data-act="tfsave" ${o.saveAddr !== false ? "checked" : ""}> Adresi müşteri kartına kaydet</label>
         <div class="field"><label class="lbl" for="tf-note">Sipariş notu (mutfak ve kurye görür)</label><textarea id="tf-note" data-act="tf" data-f="note" placeholder="Örn. acısız, zile basmayın">${esc(o.note)}</textarea></div>
         <div class="field"><label class="lbl" for="tf-pay">Ödeme</label><select id="tf-pay" class="sel" data-act="tfpay">${["Kapıda nakit", "Kapıda kart"].map(x => `<option ${o.pay === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>`;
          acts = `<button class="btn pri wide" data-act="confirmTel" ${o.items.length ? "" : "disabled"}>Siparişi onayla ve mutfağa gönder</button><button class="btn danger wide" data-act="cancelTel">Vazgeç</button>`;
        }
        const ca = campAmt(o);
        return `<div class="pos"><div style="min-width:0"><div class="row" style="margin-bottom:12px"><button class="btn ghost" data-act="back">← Ana Sayfa</button></div>
        <div class="cats">${cats}</div><div class="prods">${prods || `<div class="empty" style="grid-column:1/-1">Bu kategoride ürün yok. Ürünleri Ayarlar → Kurulum'dan ekleyin.</div>`}</div></div>
        <aside class="ticket"><div class="th">${head}</div>${gb}${cb}<div class="lines">${lines}</div>
        <div class="tfoot">${ca ? `<div class="split hint"><span>Kampanya</span><span class="num">−${fmt(ca)}</span></div>` : ""}${o.discount ? `<div class="split hint"><span>İndirim %${o.discount}</span><span class="num">−${fmt(((total(o) - ca) * o.discount) / 100)}</span></div>` : ""}${o.override != null ? `<div class="split hint"><span>Fiyat elle değiştirildi</span><span class="num">${fmt(o.override)}</span></div>` : ""}
        <div class="total"><span class="lbl">Toplam</span><b>${fmt(net(o))}</b></div>${extra}<div class="acts">${acts}</div></div></aside></div>`;
      }

      function payModal(wait) {
        const o = S.orders.find(x => x.id === S.activeId);
        const rem = Math.max(0, net(o) - paidSum(o));
        const okc = D("okc").on,
          c = o.custId && C(o.custId),
          ca = campAmt(o);
        modal(`<h2>Ödeme · ${o.channel === "masa" ? "Masa " + o.table : esc(oTitle(o))}</h2>
       <div class="split"><span class="hint">Ara toplam</span><span class="num">${fmt(total(o))}</span></div>
       ${ca ? `<div class="split"><span class="hint">Kampanya · ${esc(CAMPS.find(x => x.id === o.camp).n)}</span><span class="num">−${fmt(ca)}</span></div>` : ""}
       <div class="row"><input id="kupon" class="search" style="flex:1;min-width:0" placeholder="Kupon kodu (örn. NAZURA50)" aria-label="Kupon kodu"><button class="btn" data-act="kuponGo">Kuponu uygula</button></div>
       <div class="tf2"><div class="field"><label class="lbl" for="disc">İndirim (%)</label><input id="disc" type="number" min="0" max="100" value="${o.discount}" data-act="disc"></div>
       <label class="check" style="align-self:end;padding-bottom:10px"><input type="checkbox" id="pm-ov" data-act="ovToggle" ${o.override != null ? "checked" : ""}> Fiyat farklı</label></div>
       ${o.override != null ? `<div class="field"><label class="lbl" for="pm-ovv">Yeni toplam (₺) · hesaplanan ${fmt(Math.max(0, total(o) - ca) * (1 - (o.discount || 0) / 100))}</label><input id="pm-ovv" class="num" type="number" min="0" value="${Math.round(o.override)}" data-act="ovVal"></div>` : ""}
       <div class="split"><span class="lbl">Kalan</span><b class="num" style="font-size:24px">${fmt(rem)}</b></div>
       ${o.paid.length ? `<div class="paylist">${o.paid.map(p => `<div class="split"><span>${p.m}</span><span class="num">${fmt(p.a)}</span></div>`).join("")}</div>` : ""}
       ${
         wait
           ? `<div class="okc-wait"><div class="spin"></div><b>ÖKC'de kart bekleniyor</b><span class="hint">${fmt(wait)} · müşteri kartını okutsun</span></div>`
           : rem > 0
             ? `<div class="field"><label class="lbl" for="amt">Bu ödemenin tutarı</label><input id="amt" class="num" type="number" min="1" value="${Math.round(rem)}"></div>
       <div class="row splitbtns"><span class="hint">Hesabı böl:</span>${[2, 3, 4].map(n => `<button class="btn sm" data-act="splitN" data-n="${n}">${n} kişi</button>`).join("")}<button class="btn sm" data-act="splitItems">Ürün seçerek</button></div><div id="splitbox"></div>
       <div class="row"><button class="btn pri" style="flex:1" data-act="payIt" data-m="Nakit">Nakit</button><button class="btn pri" style="flex:1" data-act="payIt" data-m="Kart">Kredi kartı${okc ? " (ÖKC)" : ""}</button></div>`
             : `<button class="btn pri" data-act="closeTable">Hesabı kapat${okc ? ", mali fiş kes" : ""}</button>`
       }
       <div class="hint">${okc ? "ÖKC bağlı: kart çekimi ve mali fiş cihazdan yapılır." : "ÖKC bağlı değil: ödeme elle kaydedilir."}</div>
       <button class="btn ghost" data-act="close">Kapat</button>`);
      }

      function moveModal() {
        const free = Object.values(HALLS)
          .flat()
          .filter(t => !tableOrder(t) || (!tableOrder(t).items.length && !tableOrder(t).custId));
        modal(
          `<h2>Masa taşı</h2><p class="hint" style="margin:0">Boş masalardan birini seçin.</p><div class="freegrid">${free.map(t => `<button class="btn" data-act="moveTo" data-t="${t}">${t}</button>`).join("")}</div><button class="btn ghost" data-act="close">Vazgeç</button>`,
        );
      }

      function receiptModal(o) {
        const L = o.items,
          W = 32;
        const ln = (a, b) => {
          a = String(a);
          b = String(b);
          return a.slice(0, W - b.length - 1).padEnd(W - b.length, " ") + b;
        };
        const t = [
          S.rname.toLocaleUpperCase("tr-TR").padStart(Math.min(32, 16 + S.rname.length / 2), " "),
          "-".repeat(W),
          ln(o.channel === "masa" ? "MASA " + o.table : CH[o.channel].n.toUpperCase(), o.code || "#" + o.id),
          ln(
            new Date(o.createdAt).toLocaleDateString("tr-TR"),
            new Date(o.createdAt).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }),
          ),
          ...(o.customer?.name ? [o.customer.name] : []),
          ...(o.customer?.address ? [o.customer.address] : []),
          "-".repeat(W),
          ...L.flatMap(i => [
            ln(i.qty + "x " + iName(i), i.ikram ? "İKRAM" : fmt(i.price * i.qty)),
            ...(i.mods && i.mods.length ? ["   " + iMods(i)] : []),
            ...(i.note ? ["   NOT: " + i.note] : []),
          ]),
          "-".repeat(W),
          ...(campAmt(o) ? [ln("KAMPANYA", "-" + fmt(campAmt(o)))] : []),
          ...(o.discount ? [ln("İNDİRİM %" + o.discount, "-" + fmt(((total(o) - campAmt(o)) * o.discount) / 100))] : []),
          ln("TOPLAM", fmt(net(o))),
          ...(() => {
            const c = o.custId && C(o.custId);
            if (!c || !LOY.on || !loyCounts(o)) return [];
            return loyGiftDue(c)
              ? [
                  "SADAKAT: " +
                    LOY.every +
                    ". SİPARİŞ - " +
                    (LOY.type === "disc" ? "%" + LOY.pct + " İNDİRİMLİ!" : "HEDİYELİ!"),
                ]
              : ["SADAKAT: " + loyNext(c) + "/" + LOY.every + " · hediyeye " + (LOY.every - loyNext(c)) + " sipariş"];
          })(),
          ...(o.note ? ["NOT: " + o.note] : []),
          "-".repeat(W),
          "Bu belge mali fiş değildir.",
        ].join("\n");
        modal(`<h2>Adisyon</h2><pre class="slip">${esc(t)}</pre><div class="hint">${o.prints ? `Bu adisyon ${o.prints} kez yazdırıldı.` : "Henüz yazdırılmadı."} Yazıcı: Mutfak yazıcısı (demo)</div>
       <button class="btn pri" data-act="doPrint" data-id="${o.id}">${IC.print} ${o.prints ? "Tekrar yazdır" : "Yazdır"}</button><button class="btn ghost" data-act="close">Kapat</button>`);
      }

      function optModal(pid) {
        const p = P(pid),
          gs = modsFor(p),
          o = S.orders.find(x => x.id === S.activeId);
        modal(
          `<h2>${esc(p.name)}</h2><div class="hint">${fmt(priceFor(p, o.channel))}${p.combo ? " · " + comboTxt(p) : ""}</div>
       ${
         p.combo
           ? p.combo.pick
               .map(
                 (g, gi) =>
                   `<div class="optg"><span class="lbl">${esc(g.n)} seçin</span><div class="optl">${
                     AP()
                       .filter(x => x.cat === g.cat && !x.combo && !x.stop)
                       .map(
                         (x, xi) =>
                           `<label class="opt"><input type="radio" name="pk${gi}" value="${x.id}" ${xi === 0 ? "checked" : ""}><span>${esc(x.name)}</span></label>`,
                       )
                       .join("") || '<span class="hint">Bu kategoride ürün yok</span>'
                   }</div></div>`,
               )
               .join("")
           : ""
       }
       ${gs
         .filter(g => g.id !== "ekb" && g.id !== "ekm")
         .map(
           g =>
             `<div class="optg"><span class="lbl">${esc(g.n)}${g.multi ? " · birden fazla seçilebilir" : " · birini seçin"}</span><div class="optl">${g.opts.map((x, xi) => `<label class="opt"><input type="${g.multi ? "checkbox" : "radio"}" name="md-${g.id}" value="${xi}"><span>${esc(x.n)}${x.p ? ` <b class="num">+${fmt(x.p)}</b>` : ""}</span></label>`).join("")}</div></div>`,
         )
         .join("")}
       ${(() => {
         const ex = extrasFor(p);
         return ex.length
           ? `<div class="optg"><span class="lbl">Ekstra · birden fazla seçilebilir</span><div class="optl">${ex.map(x => `<label class="opt"><input type="checkbox" name="ex" value="${x.k}" data-q="${x.q}" data-p="${x.p}"><span>${esc(x.n)} <b class="num">+${fmt(x.p)}</b></span></label>`).join("")}</div></div>`
           : "";
       })()}
       <div class="field"><label class="lbl" for="opt-note">Not (mutfak görür)</label><textarea id="opt-note" rows="2" placeholder="Örn. az pişsin, sos ayrı gelsin"></textarea></div>
       <button class="btn pri" data-act="optAdd" data-p="${pid}">Adisyona ekle</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
          true,
        );
      }

      function lineModal(ix) {
        const o = S.orders.find(x => x.id === S.activeId),
          i = o.items[ix];
        modal(`<h2>${esc(iName(i))}</h2><div class="hint">${i.qty} adet · ${fmt(i.price * i.qty)} · mutfağa gönderildi${i.mods && i.mods.length ? " · " + esc(iMods(i)) : ""}</div>
       <div class="tf2">${fld("la-q", "Adet", `<input id="la-q" class="num" type="number" min="1" max="${i.qty}" value="1">`)}
       ${fld("la-w", "Neden", sel("la-w", ["Müşteri memnuniyeti", "Uzun bekleme", "Müşteri vazgeçti", "Yanlış sipariş", "Yandı / düştü", "Personel yemeği", "Diğer"], ""))}</div>
       <div class="lacts"><button class="btn" data-act="lineDo" data-k="ikram" data-i="${ix}" ${i.ikram || i.gift ? "disabled" : ""}><b>${IC.gift} İkram et</b><small>Hesaptan düşer, malzeme kullanılmış sayılır</small></button>
        <button class="btn" data-act="lineDo" data-k="iade" data-i="${ix}"><b>İptal · stoka geri dön</b><small>Hazırlanmadı, malzeme kullanılmadı</small></button>
        <button class="btn" data-act="lineDo" data-k="fire" data-i="${ix}"><b>İptal · fire</b><small>Hazırlandı ama satılamadı (yandı, düştü)</small></button></div>
       <button class="btn ghost" data-act="close">Vazgeç</button>`);
      }

      function mergeModal() {
        const o = S.orders.find(x => x.id === S.activeId);
        const others = HALLS.Salon.filter(t => t !== o.table && tableOrder(t) && tableOrder(t).items.length);
        modal(`<h2>Masa birleştir</h2><p class="hint" style="margin:0">Seçtiğiniz masanın hesabı <b>Masa ${o.table}</b> hesabına eklenir, o masa boşalır.</p>
       ${others.length ? `<div class="freegrid wide">${others.map(t => `<button class="btn" data-act="mergeDo" data-t="${t}">${t}<small class="num">${fmt(net(tableOrder(t)))}</small></button>`).join("")}</div>` : '<div class="empty">Birleştirilecek dolu masa yok.</div>'}
       <button class="btn ghost" data-act="close">Vazgeç</button>`);
      }

      function itemMoveModal() {
        const o = S.orders.find(x => x.id === S.activeId);
        const ts = HALLS.Salon.filter(t => t !== o.table);
        modal(`<h2>Ürün taşı</h2><p class="hint" style="margin:0">Başka masaya geçecek ürünlerin adedini yazın.</p>
       <div class="mvlist">${o.items.map((i, ix) => `<div class="split"><span>${esc(iName(i))}${i.mods && i.mods.length ? ` <small class="hint">${esc(iMods(i))}</small>` : ""}</span><span class="inunit"><input class="price num" id="mv-${ix}" type="number" min="0" max="${i.qty}" value="0" aria-label="Adet"><small>/ ${i.qty}</small></span></div>`).join("")}</div>
       ${fld(
         "mv-t",
         "Hedef masa",
         sel(
           "mv-t",
           ts.map(t => [t, t + (tableOrder(t) && tableOrder(t).items.length ? " · dolu" : "")]),
           "",
         ),
       )}
       <button class="btn pri" data-act="itemMoveDo">Taşı</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
      }
    </script>

    <!-- ============================== js/views/kitchen.js ============================== -->
    <script>
      // Экран кухни.

      function vKitchen() {
        const q = kitchenQueue();
        if (!q.length) return `<div class="empty">Mutfakta bekleyen ürün yok.</div>`;
        return `<p class="hint" style="margin:0 0 14px">Masadan ve paketten gelen tüm ürünler tek sırada. 15 dk sonra sarı, 25 dk sonra kırmızı. Buradaki durum ana sayfada da güncellenir.</p><div class="kds">${q
          .map(({ o, items, since }) => {
            const m = (now() - since) / 60000,
              c = m > 25 ? "var(--bad)" : m > 15 ? "var(--warn)" : o.channel === "masa" ? "var(--ch-masa)" : CH[o.channel].c;
            return `<div class="kcard" style="--c:${c}"><div class="kh"><h3>${o.channel === "masa" ? "Masa " + o.table : CH[o.channel].n}</h3><span class="num" data-since="${since}">${ago(since)}</span></div>
        <ul>${items.map(i => `<li><b>${i.qty}×</b><span>${esc(iName(i))}</span>${i.mods && i.mods.length ? `<small class="kmod">${esc(iMods(i))}</small>` : ""}${i.note ? `<small class="kmod">Not: ${esc(i.note)}</small>` : ""}</li>`).join("")}</ul>${o.note ? `<div class="onote" style="margin:0 14px 10px">Not: ${esc(o.note)}</div>` : ""}
        <div class="kf row">${o.stage === "alindi" ? `<button class="btn" style="flex:1" data-act="stage" data-id="${o.id}" data-s="hazirlaniyor">Başla</button>` : ""}<button class="btn pri" style="flex:1" data-act="stage" data-id="${o.id}" data-s="hazir">Hazır</button></div></div>`;
          })
          .join("")}</div>`;
      }
    </script>

    <!-- ============================== js/views/stock.js ============================== -->
    <script>
      // Раздел Stok и его окна (приход, fire, поставщики, приёмка).

      function critBar() {
        const u = urgent(),
          y = critList().filter(k => lvl(k) === "yakin");
        if (!u.length && !y.length) return "";
        return `${
          u.length
            ? `<div class="urgent"><div class="uh"><b>ACİL SİPARİŞ VERİLMELİ</b><button class="btn" data-act="stab" data-s="satin">Satın alma listesi</button></div>
       <div class="ulist">${u.map(k => `<span><b>${ING[k].n}</b> ${fq(ING[k].s, ING[k].u)} kaldı · ${lasts(k)} yeter</span>`).join("")}</div></div>`
            : ""
        }
       ${y.length ? `<div class="warnbar"><b>Yakında bitecek:</b><span style="flex:1;min-width:0">${y.map(k => `${ING[k].n} (${lasts(k)})`).join(" · ")}</span></div>` : ""}`;
      }

      function ingTable(q) {
        q = (q || "").toLocaleLowerCase("tr-TR").trim();
        const q2 = q.length >= 4 ? q.slice(0, -1) : q; // "ekmek" → "ekmeği" de bulunsun
        const keys = Object.keys(ING)
          .filter(k => {
            const n = ING[k].n.toLocaleLowerCase("tr-TR");
            return (!S.icat || ING[k].c === S.icat) && (!q || n.includes(q) || n.includes(q2));
          })
          .sort((a, b) => LVL[lvl(a)] - LVL[lvl(b)] || daysLeft(a) - daysLeft(b));
        if (!keys.length) return `<div class="empty">Eşleşen malzeme yok.</div>`;
        const allSel = keys.every(k => S.sel.has(k));
        return `<table class="mtable"><thead><tr><th class="cb"><input type="checkbox" data-act="selAll" ${allSel ? "checked" : ""} aria-label="Hepsini seç"></th><th>Malzeme</th><th class="r">Stok</th><th class="r">Günlük kullanım</th><th class="r">Ne kadar yeter</th><th class="r">Birim fiyat</th><th>Durum</th><th class="r">İşlem</th></tr></thead><tbody>${keys
          .map(k => {
            const g = ING[k];
            const l = lvl(k),
              col = l === "ok" ? "var(--ok)" : l === "yakin" ? "var(--warn)" : "var(--bad)",
              pct = Math.min(100, (daysLeft(k) / 7) * 100);
            return `<tr class="${l === "acil" ? "rowbad" : ""} ${S.sel.has(k) ? "selrow" : ""}"><td class="cb"><input type="checkbox" data-act="selIng" data-k="${k}" ${S.sel.has(k) ? "checked" : ""} aria-label="${g.n} seç"></td><td><b>${g.n}</b><br><small class="hint">${g.c}</small></td><td class="r num">${fq(g.s, g.u)}</td><td class="r"><span class="inunit"><input class="price num" id="iu-${k}" data-act="ingUse" data-k="${k}" type="number" min="0" step="${isG(k) ? 0.1 : 1}" value="${+(isG(k) ? g.use / 1000 : g.use).toFixed(2)}" aria-label="${g.n} günlük kullanım"><small>${qLbl(k)}/gün</small></span></td><td class="r num" style="color:${col};font-weight:600">${lasts(k)}</td>
         <td class="r"><span class="inunit"><input class="price num" id="ip-${k}" data-act="ingPrice" data-k="${k}" type="number" min="0" step="0.5" value="${+uPrice(k).toFixed(2)}" aria-label="${g.n} birim fiyatı"><small>${uLbl(k)}</small></span></td>
         <td><div class="row" style="flex-wrap:nowrap"><div class="lvl" style="flex:1"><i style="width:${pct}%;--c:${col}"></i></div><span class="chip ${l === "acil" ? "bad" : l === "yakin" ? "warn" : "ok"}">${l === "acil" ? "ACİL" : l === "yakin" ? "Yakında" : "Yeterli"}</span></div></td>
         <td><div class="acts"><button class="btn" data-act="stockIn" data-k="${k}">+ Giriş</button><button class="btn ghost" data-act="waste" data-k="${k}">Fire</button><button class="btn ghost iconbtn" data-act="delIng" data-k="${k}" title="Malzemeyi sil" aria-label="${g.n} sil">${IC.trash}</button></div></td></tr>`;
          })
          .join("")}</tbody></table>`;
      }

      function vStock() {
        const tabs = [
          ["malz", "Malzemeler"],
          ["rec", "Reçeteler"],
          ["satin", "Satın alma"],
          ["ted", "Tedarikçiler"],
          ["log", "Hareketler"],
        ]
          .map(([k, n]) => `<button class="tab ${S.stockTab === k ? "on" : ""}" data-act="stab" data-s="${k}">${n}</button>`)
          .join("");
        let body = "";
        if (S.stockTab === "malz") {
          body = `<div class="row" style="margin-bottom:12px"><select class="sel catsel" id="icat" data-act="icat" aria-label="Kategori"><option value="">Tüm kategoriler</option>${ICATS.map(c => `<option ${S.icat === c ? "selected" : ""}>${c}</option>`).join("")}</select><input class="search" id="ingsearch" data-act="sq" placeholder="Malzeme ara (örn. ekmek)" value="${esc(S.sq)}" aria-label="Malzeme ara">
        <span class="hint" style="flex:1;min-width:200px">Birim fiyatı veya günlük kullanımı tabloda değiştirebilirsiniz. Fiyat değişince ürün fiyatı için öneri gelir.</span><button class="btn danger" id="bulkdel" data-act="bulkDel" ${S.sel.size ? "" : "hidden"}>${IC.trash} Seçilenleri sil (<span id="selcount">${S.sel.size}</span>)</button><button class="btn pri" data-act="ingModal">${IC.plus} Malzeme ekle</button></div>
        <div class="wrapx" id="ingtable">${ingTable(S.sq)}</div>`;
        } else if (S.stockTab === "rec") {
          body = `<p class="hint" style="margin:0 0 12px">Maliyet, malzeme alış fiyatlarından otomatik hesaplanır. Ambalaj sadece paket siparişte stoktan düşer; salon maliyeti ambalajsızdır. FC = maliyet ÷ salon fiyatı (hedef %${SET.fc}).</p>
        <div class="wrapx"><table class="mtable"><thead><tr><th>Ürün</th><th>Reçete (1 porsiyon)</th><th class="r">Yapılabilir</th><th class="r">Maliyet<br><small>paket · salon</small></th><th class="r">Salon</th><th class="r">Uygulama</th><th class="r">FC</th></tr></thead><tbody>${AP()
          .filter(p => !p.combo)
          .map(p => {
            const pid = p.id,
              n = canMake(pid),
              nk = neck(pid),
              cost = costOf(pid),
              fc = Math.round((cost / p.price) * 1000) / 10;
            return `<tr><td><b>${esc(p.name)}</b></td><td><div class="recipe">${RECIPES[pid].map(([k, q]) => `<span class="${k === nk && n < 20 ? "neck" : ""}${ING[k].pack ? " pk" : ""}">${fq(q, ING[k].u)} ${ING[k].n}</span>`).join("")}</div></td>
         <td class="r"><span class="big" style="color:${n === 0 ? "var(--bad)" : n <= 5 ? "var(--warn)" : "var(--fg)"}">${n}</span></td>
         <td class="r num">${fmt2(cost)}<br><span class="hint">${fmt2(costOf(pid, false))}</span></td><td class="r num">${fmt(p.price)}</td><td class="r num">${fmt(p.app)}</td>
         <td class="r num" style="${fc > SET.fc + 0.5 ? "color:var(--bad);font-weight:600" : ""}">%${fc.toLocaleString("tr-TR")}</td></tr>`;
          })
          .join("")}</tbody></table></div>`;
        } else if (S.stockTab === "ted") {
          body = supBody();
        } else if (S.stockTab === "satin") {
          const need = critList();
          body = need.length
            ? `<p class="hint" style="margin:0 0 12px">Önerilen miktar 3 günlük tüketim + kritik seviye kadardır. Gerçekte aldığınız miktarı ve ödediğiniz birim fiyatı yazın, sonra “Teslim aldım”a basın. Tutar giderlere “Malzeme” olarak eklenir.</p>
        <div class="wrapx"><table class="mtable"><thead><tr><th>Malzeme</th><th>Tedarikçi</th><th class="r">Mevcut</th><th class="r">Yeter</th><th class="r">Önerilen</th><th class="r">Alınan miktar</th><th class="r">Birim fiyat</th><th class="r">Tutar</th><th></th></tr></thead><tbody>${need
          .map(k => {
            const g = ING[k],
              sug = buyQty(k),
              sugU = isG(k) ? sug / 1000 : sug;
            return `<tr class="${lvl(k) === "acil" ? "rowbad" : ""}"><td><b>${g.n}</b> ${lvl(k) === "acil" ? '<span class="chip bad">ACİL</span>' : '<span class="chip warn">Yakında</span>'}</td><td class="hint">${esc(supOf(k)?.n || "—")}</td><td class="r num">${fq(g.s, g.u)}</td><td class="r num">${lasts(k)}</td><td class="r num hint">${fq(sug, g.u)}</td>
         <td class="r"><span class="inunit"><input class="price num" id="bq-${k}" data-act="buyCalc" data-k="${k}" type="number" min="0" step="${isG(k) ? 0.5 : 1}" value="${sugU}" aria-label="${g.n} alınan miktar"><small>${qLbl(k)}</small></span></td>
         <td class="r"><span class="inunit"><input class="price num" id="bp-${k}" data-act="buyCalc" data-k="${k}" type="number" min="0" step="0.5" value="${+uPrice(k).toFixed(2)}" aria-label="${g.n} birim fiyat"><small>${uLbl(k)}</small></span></td>
         <td class="r num" id="bt-${k}">${fmt(sugU * uPrice(k))}</td><td><button class="btn pri" data-act="recvOne" data-k="${k}">Teslim aldım</button></td></tr>`;
          })
          .join("")}</tbody></table></div>
        <div class="row" style="margin-top:12px"><button class="btn" data-act="copyBuy">Listeyi kopyala (tedarikçiye göndermek için)</button><button class="btn pri" data-act="recvAll">Tümünü teslim aldım</button></div>`
            : `<div class="empty">Şu an sipariş verilmesi gereken malzeme yok.</div>`;
        } else {
          body = LOG.length
            ? `<div class="wrapx"><table class="mtable"><thead><tr><th>Zaman</th><th>Malzeme</th><th class="r">Değişim</th><th>Neden</th></tr></thead><tbody>${LOG.slice(
                0,
                50,
              )
                .map(
                  l =>
                    `<tr><td class="hint">${ago(l.t)}</td><td>${ING[l.k]?.n || "Silinmiş malzeme"}</td><td class="r num" style="color:${l.d < 0 ? "var(--bad)" : l.d > 0 ? "var(--ok)" : "var(--muted)"}">${l.d === 0 ? "—" : (l.d > 0 ? "+" : "−") + fq(Math.abs(l.d), ING[l.k]?.u || "g")}</td><td>${esc(l.why)}</td></tr>`,
                )
                .join("")}</tbody></table></div>`
            : `<div class="empty">Henüz hareket yok.</div>`;
        }
        return `${critBar()}<div class="tabs">${tabs}</div>${body}`;
      }

      // malzeme fiyatı değişti → ürün maliyeti ve fiyat önerisi
      function costChange(changes) {
        // [{k,old}] — ING[k].cost yeni değerde
        const ks = changes.map(c => c.k);
        const aff = PRODUCTS.filter(p => RECIPES[p.id].some(([k]) => ks.includes(k)));
        if (!aff.length) {
          toast("Birim fiyat güncellendi");
          return;
        }
        const oldCost = pid =>
          RECIPES[pid].reduce((s, [k, q]) => {
            const c = changes.find(x => x.k === k);
            return s + (c ? c.old : ING[k].cost) * q;
          }, 0);
        S.pend = aff.map(p => {
          const sug = sugPrice(p.id);
          return { pid: p.id, oc: oldCost(p.id), nc: costOf(p.id), sug, sugA: sugApp(sug) };
        });
        const up = changes.some(c => ING[c.k].cost > c.old);
        modal(
          `<h2>${up ? "Malzemeye zam geldi" : "Malzeme fiyatı değişti"}</h2>
       <div class="paylist">${changes.map(c => `<div class="split"><span>${ING[c.k].n}</span><span class="num">${fmt(isG(c.k) ? c.old * 1000 : c.old)} → <b>${fmt(uPrice(c.k))}</b> ${uLbl(c.k)}</span></div>`).join("")}</div>
       <p class="hint" style="margin:0">Bu malzemeyi kullanan ${aff.length} ürün. Yeni fiyat tablodaki kuralla hesaplandı: maliyet ÷ %${SET.fc}, uygulama +%${SET.app}, ${SET.step} ₺'ye yuvarlama. İsterseniz değiştirin.</p>
       <div class="wrapx"><table class="mtable sm"><thead><tr><th></th><th>Ürün</th><th class="r">Maliyet</th><th class="r">Salon</th><th class="r">Uygulamalar</th></tr></thead><tbody>${S.pend
         .map((x, i) => {
           const p = P(x.pid);
           return `<tr>
       <td><input type="checkbox" id="pc-${i}" ${x.sug !== p.price || x.sugA !== p.app ? "checked" : ""} aria-label="${esc(p.name)} fiyatını güncelle"></td><td>${esc(p.name)}</td>
       <td class="r num">${fmt2(x.oc)} → <b style="color:${x.nc > x.oc ? "var(--bad)" : "var(--ok)"}">${fmt2(x.nc)}</b></td>
       <td class="r"><span class="inunit"><small>${fmt(p.price)} →</small><input class="price num" id="pv-${i}" type="number" min="0" value="${x.sug}" aria-label="${esc(p.name)} yeni salon fiyatı"></span></td>
       <td class="r"><span class="inunit"><small>${fmt(p.app)} →</small><input class="price num" id="pa-${i}" type="number" min="0" value="${x.sugA}" aria-label="${esc(p.name)} yeni uygulama fiyatı"></span></td></tr>`;
         })
         .join("")}</tbody></table></div>
       <button class="btn pri" data-act="applyPrices">Seçili fiyatları her yerde güncelle</button><button class="btn ghost" data-act="close">Satış fiyatlarını değiştirme</button>`,
          true,
        );
      }

      function qtyModal(k, kind) {
        const g = ING[k];
        modal(`<h2>${kind === "in" ? "Stok girişi" : "Fire kaydı"}</h2><div class="hint">${g.n} · mevcut ${fq(g.s, g.u)}</div>
       <div class="field"><label class="lbl" for="sq">Miktar (${qLbl(k)})</label><input id="sq" class="num" type="number" min="0" step="${isG(k) ? 0.1 : 1}" value="${kind === "in" ? (isG(k) ? 1 : 10) : isG(k) ? 0.05 : 1}"></div>
       ${kind === "in" ? `<div class="field"><label class="lbl" for="sp">Birim fiyat (${uLbl(k)})</label><input id="sp" class="num" type="number" min="0" step="0.5" value="${+uPrice(k).toFixed(2)}"></div>` : `<div class="field"><label class="lbl" for="sr">Neden</label><input id="sr" value="Bozuldu"></div>`}
       <button class="btn pri" data-act="${kind === "in" ? "doIn" : "doWaste"}" data-k="${k}">Kaydet</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
        setTimeout(() => $("#sq")?.select(), 30);
      }

      function ingModal() {
        modal(`<h2>Yeni malzeme</h2>
       <div class="tf2"><div class="field"><label class="lbl" for="ni-n">Malzeme adı</label><input id="ni-n" placeholder="Örn. Jalapeno biber"></div>
       <div class="field"><label class="lbl" for="ni-cat">Kategori</label><select id="ni-cat" class="sel">${ICATS.map(c => `<option>${c}</option>`).join("")}</select></div></div>
       <div class="tf2"><div class="field"><label class="lbl" for="ni-u">Birim</label><select id="ni-u" class="sel"><option value="g">g / ml (kg veya lt ile alınır)</option><option value="adet">adet</option></select></div>
       <div class="field"><label class="lbl" for="ni-p">Alış fiyatı (₺/kg·lt veya ₺/adet)</label><input id="ni-p" class="num" type="number" min="0" step="0.5"></div></div>
       <div class="tf2"><div class="field"><label class="lbl" for="ni-s">Mevcut stok (kg·lt veya adet)</label><input id="ni-s" class="num" type="number" min="0" step="0.1" value="0"></div>
       <div class="field"><label class="lbl" for="ni-use">Günlük kullanım (kg·lt veya adet)</label><input id="ni-use" class="num" type="number" min="0" step="0.1" value="0"></div></div>
       <div class="field"><label class="lbl" for="ni-c">Kritik seviye (kg·lt veya adet)</label><input id="ni-c" class="num" type="number" min="0" step="0.1" value="0"></div>
       <label class="check"><input type="checkbox" id="ni-pk"> Ambalaj (sadece paket siparişte düşer)</label>
       <button class="btn pri" data-act="saveIng">Malzemeyi ekle</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
        setTimeout(() => $("#ni-n")?.focus(), 30);
      }

      function delIngModal(ks) {
        ks = [].concat(ks);
        const names = ks.map(k => ING[k].n),
          used = PRODUCTS.filter(p => RECIPES[p.id].some(([x]) => ks.includes(x)));
        modal(`<h2>${ks.length > 1 ? ks.length + " malzemeyi sil" : "Malzemeyi sil"}</h2><div class="recipe">${names.map(n => `<span><b>${esc(n)}</b></span>`).join("")}</div>
       ${used.length ? `<div class="warnbox"><b>Dikkat: ${ks.length > 1 ? "bu malzemeler" : "bu malzeme"} ${used.length} üründe kullanılıyor.</b> Silerseniz bu ürünlerin reçetesinden çıkar ve maliyetleri değişir:<div class="recipe" style="margin-top:6px">${used.map(p => `<span>${esc(p.name)}</span>`).join("")}</div></div>` : '<div class="hint">Hiçbir reçetede kullanılmıyor.</div>'}
       <p class="hint" style="margin:0">Silmeden sonra birkaç saniye “Geri al” ile geri getirebilirsiniz.</p>
       <button class="btn danger solid" data-act="doDelIng" data-k="${ks.join(",")}">Onayla ve sil</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
      }

      function supBody() {
        const pend = PURCH.filter(p => p.status === "bekliyor");
        return `<div class="row" style="margin-bottom:12px"><p class="hint" style="margin:0;flex:1">Her malzemenin hangi tedarikçiden alındığını girin. “Sipariş hazırla” azalan malzemeleri önerir, listeyi WhatsApp ile gönderir. Mal gelince “Teslim aldım”: stok artar, gider yazılır.</p><button class="btn pri" data-act="supModal">${IC.plus} Tedarikçi ekle</button></div>
       ${
         pend.length
           ? `<section class="panel" style="margin-bottom:14px"><h3>Bekleyen siparişler</h3>${pend
               .map(po => {
                 const s = SUPPLIERS.find(x => x.id === po.sup);
                 return `<div class="rem"><div style="min-width:0"><b>${esc(s?.n || "Tedarikçi")}</b><div class="hint">${ago(po.t)} · ${po.lines.map(([k, q]) => `${esc(ING[k]?.n || "?")} ${q} ${ING[k] ? qLbl(k) : ""}`).join(", ")}</div></div><div class="r"><b class="num">${fmt(poTotal(po))}</b></div><div class="acts"><button class="btn pri" data-act="poRecv" data-id="${po.id}">Teslim aldım</button><button class="btn ghost" data-act="poDel" data-id="${po.id}">Sil</button></div></div>`;
               })
               .join("")}</section>`
           : ""
       }
       <div class="sups">${SUPPLIERS.map(s => {
         const ks = s.ings.filter(k => ING[k]),
           nd = ks.filter(k => lvl(k) !== "ok");
         return `<article class="dev"><div class="split"><h3>${esc(s.n)}</h3>${nd.length ? `<span class="chip warn">${nd.length} malzeme azaldı</span>` : '<span class="chip ok">Stok yeterli</span>'}</div><div class="hint">${esc(s.phone)} · Teslimat: ${esc(s.days)}</div>
        <div class="recipe">${ks.map(k => `<span class="${lvl(k) !== "ok" ? "neck" : ""}">${esc(ING[k].n)}</span>`).join("") || "<span>Malzeme seçilmedi</span>"}</div>
        <div class="row"><button class="btn pri" data-act="poModal" data-id="${s.id}" ${ks.length ? "" : "disabled"}>Sipariş hazırla</button><button class="btn ghost" data-act="supModal" data-id="${s.id}">Düzenle</button></div></article>`;
       }).join("")}</div>`;
      }

      function supModal(id) {
        const s = id ? SUPPLIERS.find(x => x.id === +id) : null;
        const ks = Object.keys(ING).sort(
          (a, b) => ICATS.indexOf(ING[a].c) - ICATS.indexOf(ING[b].c) || ING[a].n.localeCompare(ING[b].n, "tr"),
        );
        modal(
          `<h2>${s ? "Tedarikçiyi düzenle" : "Yeni tedarikçi"}</h2><div class="tf2">${fld("sp-n", "Firma adı", inp("sp-n", s?.n))}${fld("sp-p", "Telefon (WhatsApp)", inp("sp-p", s?.phone, 'class="num"'))}</div>
       ${fld("sp-d", "Teslimat günleri", inp("sp-d", s?.days, 'placeholder="Örn. Pazartesi, Perşembe"'))}
       <div class="field"><span class="lbl">Bu firmadan alınan malzemeler</span><div class="optl ingpick">${ks
         .map(k => {
           const o = supOf(k);
           return `<label class="opt"><input type="checkbox" name="spk" value="${k}" ${s && s.ings.includes(k) ? "checked" : ""}><span>${esc(ING[k].n)}${o && o !== s ? ` <small class="hint">· ${esc(o.n)}</small>` : ""}</span></label>`;
         })
         .join("")}</div></div>
       <div class="err" id="sp-err"></div><button class="btn pri" data-act="supSave" data-id="${s ? s.id : ""}">Kaydet</button>${s ? `<button class="btn danger" data-act="supDel" data-id="${s.id}">Tedarikçiyi sil</button>` : ""}<button class="btn ghost" data-act="close">Vazgeç</button>`,
          true,
        );
      }

      function poModal(id) {
        const s = SUPPLIERS.find(x => x.id === +id),
          ks = s.ings.filter(k => ING[k]);
        modal(
          `<h2>Sipariş · ${esc(s.n)}</h2><p class="hint" style="margin:0">Azalan malzemeler için miktar önerildi (3 günlük kullanım + kritik seviye). İstediğiniz gibi değiştirin, 0 olanlar listeye girmez.</p>
       <div class="wrapx"><table class="mtable sm"><thead><tr><th>Malzeme</th><th class="r">Mevcut</th><th class="r">Yeter</th><th class="r">Sipariş</th><th class="r">Birim fiyat</th></tr></thead><tbody>${ks
         .map(k => {
           const q = lvl(k) !== "ok" ? (isG(k) ? buyQty(k) / 1000 : buyQty(k)) : 0;
           return `<tr class="${lvl(k) === "acil" ? "rowbad" : ""}"><td>${esc(ING[k].n)}</td><td class="r num">${fq(ING[k].s, ING[k].u)}</td><td class="r num">${lasts(k)}</td><td class="r"><span class="inunit"><input class="price num" id="po-${k}" type="number" min="0" step="${isG(k) ? 0.5 : 1}" value="${+q.toFixed(1)}" aria-label="${esc(ING[k].n)} miktar"><small>${qLbl(k)}</small></span></td><td class="r"><span class="inunit"><input class="price num" id="pp-${k}" type="number" min="0" step="0.5" value="${+uPrice(k).toFixed(2)}" aria-label="${esc(ING[k].n)} birim fiyat"><small>${uLbl(k)}</small></span></td></tr>`;
         })
         .join("")}</tbody></table></div>
       <div class="row"><button class="btn pri" data-act="poSend" data-id="${s.id}" data-w="1">WhatsApp ile gönder</button><button class="btn" data-act="poSend" data-id="${s.id}">Kopyala ve kaydet</button><button class="btn ghost" data-act="close">Vazgeç</button></div>`,
          true,
        );
      }

      // Mal kabul: gelen gerçek miktar ve fiyat girilir. Fiyat değiştiyse ürün fiyatları için öneri açılır.
      function recvModal(po) {
        const s = SUPPLIERS.find(x => x.id === po.sup);
        modal(
          `<h2>Mal kabul · ${esc(s?.n || "Tedarikçi")}</h2><p class="hint" style="margin:0">Gelen miktarı ve faturadaki birim fiyatı kontrol edin. Fiyat değiştiyse malzeme fiyatı güncellenir ve ürün fiyatları için öneri gelir.</p>
       <div class="wrapx"><table class="mtable sm"><thead><tr><th>Malzeme</th><th class="r">Sipariş</th><th class="r">Gelen</th><th class="r">Birim fiyat</th></tr></thead><tbody>${po.lines
         .map(([k, q, pr], ix) =>
           ING[k]
             ? `<tr><td>${esc(ING[k].n)}</td><td class="r num hint">${q} ${qLbl(k)}</td><td class="r"><span class="inunit"><input class="price num" id="rq-${ix}" type="number" min="0" step="${isG(k) ? 0.5 : 1}" value="${q}"><small>${qLbl(k)}</small></span></td><td class="r"><span class="inunit"><input class="price num" id="rp-${ix}" type="number" min="0" step="0.5" value="${+(pr ?? uPrice(k)).toFixed(2)}"><small>${uLbl(k)}</small></span></td></tr>`
             : "",
         )
         .join("")}</tbody></table></div>
       <button class="btn pri" data-act="poRecvDo" data-id="${po.id}">Teslim aldım</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
          true,
        );
      }
    </script>

    <!-- ============================== js/views/customers.js ============================== -->
    <script>
      // Клиенты, брони, акции.

      function custListBody() {
        const opts = AP()
          .map(
            p =>
              `<option value="${p.id}" ${p.id === LOY.gift ? "selected" : ""}>${esc(p.name)} (maliyet ${fmt(costOf(p.id))})</option>`,
          )
          .join("");
        return `<section class="panel loyp"><div class="split"><h3>${IC.gift} Sadakat programı</h3><label class="tg"><button class="switch ${LOY.on ? "on" : ""}" role="switch" aria-checked="${LOY.on}" data-act="loyOn" aria-label="Sadakat programı"></button><span>${LOY.on ? "Açık" : "Kapalı"}</span></label></div>
        <div class="row"><span class="lbl">Ödül türü</span><div class="seg2" role="group" aria-label="Ödül türü"><button class="${LOY.type === "gift" ? "on" : ""}" data-act="loyType" data-t="gift">Hediye ürün</button>${[10, 15, 20].map(x => `<button class="${LOY.type === "disc" && LOY.pct === x ? "on" : ""}" data-act="loyType" data-t="disc" data-p="${x}">%${x} indirim</button>`).join("")}</div></div>
        <p class="hint" style="margin:0">${LOY.type === "disc" ? `Her <b>${LOY.every}.</b> siparişte hesaba <b>%${LOY.pct} indirim</b>.` : `Her <b>${LOY.every}.</b> siparişte <b>${esc(P(LOY.gift)?.name || "—")}</b> hediye. Hediye maliyeti ${fmt(costOf(LOY.gift) || 0)}, menü fiyatı ${fmt(P(LOY.gift)?.price || 0)}.`}</p>
        <div class="gform"><div class="field"><label class="lbl" for="loy-every">Kaçıncı siparişte</label><input id="loy-every" class="num" type="number" min="2" max="20" value="${LOY.every}" data-act="loySet" data-k="every"></div>
         <div class="field wide2" ${LOY.type === "disc" ? "hidden" : ""}><label class="lbl" for="loy-gift">Hediye ürün</label><select id="loy-gift" class="sel" data-act="loySet" data-k="gift">${opts}</select></div>
