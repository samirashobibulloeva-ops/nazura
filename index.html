        <div class="wzsum"><div><span class="lbl">Ürün</span><b class="num">${AP().length}</b></div><div><span class="lbl">Malzeme</span><b class="num">${Object.keys(ING).length}</b></div><div><span class="lbl">Kategori</span><b class="num">${CATS.length}</b></div><div><span class="lbl">Masa</span><b class="num">${HALLS.Salon.length}</b></div><div><span class="lbl">Kurala uymayan fiyat</span><b class="num">${off}</b></div></div>
        <div class="row"><button class="btn" data-act="applyRule" ${off ? "" : "disabled"}>Tüm fiyatları kurala göre ayarla</button><button class="btn" data-act="nav" data-v="menu">Fiyatları tek tek düzenle</button><button class="btn pri" data-act="wzFinish">Kurulumu tamamla</button></div></section>`;
        }
        return `${nav}${b}<div class="row wznav">${st > 1 ? `<button class="btn ghost" data-act="wzGo" data-s="${st - 1}">← Geri</button>` : ""}${st < 6 ? `<button class="btn pri" data-act="wzGo" data-s="${st + 1}" style="margin-left:auto">İleri →</button>` : ""}</div>`;
      }

      function importRows(malz, rec, mal) {
        const num = v =>
          typeof v === "number"
            ? v
            : parseFloat(
                String(v ?? "")
                  .replace(/TL|₺|\s|\u00a0/g, "")
                  .replace(/\.(?=\d{3}(\D|$))/g, "")
                  .replace(",", "."),
              );
        const hi = (rows, h) =>
          rows.findIndex(
            r =>
              r &&
              String(r[0] ?? "")
                .trim()
                .toLocaleLowerCase("tr-TR") === h,
          );
        const out = { ing: [], prod: [], err: [] };
        const i0 = hi(malz, "malzeme");
        if (i0 < 0) {
          out.err.push("“Malzemeler” sayfasında başlık satırı bulunamadı.");
          return out;
        }
        malz.slice(i0 + 1).forEach(r => {
          if (!r || !r[0]) return;
          const n = String(r[0]).trim(),
            u = /adet/i.test(String(r[1])) ? "adet" : "g",
            pr = num(r[2]);
          if (!n) return;
          if (!(pr >= 0)) out.err.push(n + ": alış fiyatı okunamadı");
          out.ing.push({ n, u, pr: pr || 0 });
        });
        const j0 = hi(rec, "ürün");
        if (j0 < 0) {
          out.err.push("“Reçeteler” sayfasında başlık satırı bulunamadı.");
          return out;
        }
        const key = n => n.trim().toLocaleLowerCase("tr-TR");
        const known = new Set(out.ing.map(x => key(x.n)));
        const pm = {};
        rec.slice(j0 + 1).forEach(r => {
          if (!r || !r[0] || !r[1]) return;
          const pn = String(r[0]).trim(),
            mn = String(r[1]).trim(),
            q = num(r[2]);
          if (!known.has(key(mn))) {
            out.err.push(`${pn}: “${mn}” malzeme listesinde yok`);
            return;
          }
          (pm[pn] = pm[pn] || []).push([mn, q || 0]);
        });
        const prices = {};
        if (mal) {
          const m0 = hi(mal, "ürün");
          if (m0 >= 0)
            mal.slice(m0 + 1).forEach(r => {
              if (r && r[0]) prices[String(r[0]).trim()] = [num(r[3]), num(r[7])];
            });
        }
        out.prod = Object.entries(pm).map(([n, lines]) => ({
          n,
          lines,
          price: prices[n]?.[0] || 0,
          app: prices[n]?.[1] || 0,
        }));
        return out;
      }

      const guessCat = n => {
        n = n.toLocaleLowerCase("tr-TR");
        return /burger/.test(n)
          ? "Burgerler"
          : /wrap/.test(n)
            ? "Wrap"
            : /sosis|hot ?dog|pata/.test(n)
              ? "Sosisli"
              : /makarna|arabiata|pesto|sicilya|soslu|penne|cheese/.test(n)
                ? "Makarnalar"
                : /kola|fanta|sprite|ayran|ice tea|su$|soda|içecek/.test(n)
                  ? "İçecekler"
                  : "Atıştırmalık";
      };

      function importModal(r) {
        S.imp = r;
        modal(
          `<h2>Excel özeti</h2><div class="wzsum"><div><span class="lbl">Malzeme</span><b class="num">${r.ing.length}</b></div><div><span class="lbl">Ürün</span><b class="num">${r.prod.length}</b></div><div><span class="lbl">Reçete satırı</span><b class="num">${r.prod.reduce((s, p) => s + p.lines.length, 0)}</b></div><div><span class="lbl">Hata</span><b class="num" style="color:${r.err.length ? "var(--bad)" : "var(--ok)"}">${r.err.length}</b></div></div>
       ${
         r.err.length
           ? `<div class="warnbox"><b>Kontrol edin:</b><ul style="margin:6px 0 0;padding-left:18px">${r.err
               .slice(0, 8)
               .map(e => `<li>${esc(e)}</li>`)
               .join("")}</ul>${r.err.length > 8 ? `<div class="hint">ve ${r.err.length - 8} satır daha</div>` : ""}</div>`
           : ""
       }
       <p class="hint" style="margin:0">Ürünler adlarına göre kategorilere yerleştirilir (Burgerler, Makarnalar…); sonra Kategoriler adımından taşıyabilirsiniz. Aynı isimde olanlar güncellenir.</p>
       <button class="btn pri" data-act="impGo" ${r.ing.length ? "" : "disabled"}>İçe aktar</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
          true,
        );
      }

      function wzList() {
        const q = (S.wzq || "").toLocaleLowerCase("tr-TR").trim();
        if (!CATS.length) return '<div class="empty">Önce 3. adımda kategori ekleyin.</div>';
        const m = p => !q || p.name.toLocaleLowerCase("tr-TR").includes(q);
        let any = false;
        const h = CATS.map(([id, n]) => {
          const ps = AP().filter(p => p.cat === id && m(p));
          if (q && !ps.length) return "";
          if (ps.length) any = true;
          return `<h4 class="wzh">${esc(n)} <span class="hint">${ps.length} ürün</span></h4>${
            ps.length
              ? `<div class="wzprods">${ps
                  .map(
                    p => `<div class="wzp"><div style="min-width:0"><b>${esc(p.name)}</b><div class="hint">${p.combo ? "menü: " + comboTxt(p) : RECIPES[p.id] && RECIPES[p.id].length ? RECIPES[p.id].length + " malzeme · maliyet " + fmt2(costOf(p.id)) : "reçete yok"}</div></div><b class="num">${fmt(p.price)}</b>
         <button class="btn ghost" data-act="prodCopy" data-p="${p.id}" title="Kopyasını oluştur">Kopyala</button><button class="btn ghost" data-act="${p.combo ? "comboModal" : "prodEdit"}" data-p="${p.id}">Düzenle</button><button class="btn ghost iconbtn" data-act="prodDelAsk" data-p="${p.id}" aria-label="Sil">${IC.trash}</button></div>`,
                  )
                  .join("")}</div>`
              : '<div class="hint">Bu kategoride ürün yok.</div>'
          }`;
        }).join("");
        return q && !any ? `<div class="empty">“${esc(S.wzq)}” ile eşleşen ürün yok.</div>` : h;
      }
    </script>

    <!-- ============================== js/views/courier.js ============================== -->
    <script>
      // Экран курьера: свободные заказы, «взять», «в пути», «доставил» и способ оплаты.

      const COLLECT = [
        ["Nakit", "Nakit"],
        ["Kart", "Kredi kartı (POS)"],
        ["Havale", "Havale / EFT"],
      ];
      const collectOf = o => o.collect || o.paid?.[0]?.m || "";

      function kCard(o, mode) {
        const c = o.custId && C(o.custId),
          cu = o.customer || {};
        const btn =
          mode === "free"
            ? `<span class="chip ${o.stage === "yeni" ? "bad" : o.stage === "hazir" ? "ok" : "warn"}">${STL[o.stage] || "Yeni"}</span><button class="btn pri" data-act="kTake" data-id="${o.id}">Siparişi al</button>`
            : mode === "wait"
              ? o.stage === "hazir"
                ? `<button class="btn pri" data-act="kGo" data-id="${o.id}">Yola çıktım</button>`
                : `<span class="chip warn">Mutfakta: ${STL[o.stage] || "hazırlanıyor"}</span>`
              : `<button class="btn pri" data-act="kDone" data-id="${o.id}">Teslim ettim</button>`;
        return `<article class="oc" style="--c:${CH[o.channel].c}">
        <div class="oh"><span class="ch" style="--c:${CH[o.channel].c}">${CH[o.channel].n}</span><span class="oid">${o.code || "#" + o.id}</span><span class="hint">${ago(o.createdAt)}</span><b class="num" style="margin-left:auto">${fmt(net(o))}</b></div>
        <div><b>${esc(c ? c.name : cu.name || "Müşteri")}</b>${cu.phone ? ` · <a class="num" href="tel:${esc(cu.phone)}">${esc(cu.phone)}</a>` : ""}</div>
        <div class="cust">${esc(cu.address || "Adres yok")}</div>
        <div class="oitems">${o.items.map(i => `${i.qty}× ${esc(iName(i))}`).join(", ")}</div>
        ${o.note ? `<div class="onote">Not: ${esc(o.note)}</div>` : ""}
        <div class="hint">Ödeme: <b>${esc(o.pay === "Online" ? "Online ödendi" : o.pay || "Kapıda")}</b>${c && payMix(c) !== "—" ? ` · müşteri genelde: ${esc(payMix(c))}` : ""}</div>
        <div class="row">${btn}</div></article>`;
      }

      function vKurye() {
        const me = S.user.n,
          open = S.orders.filter(o => o.status === "acik" && o.channel !== "masa");
        const free = open.filter(o => !o.courier),
          wait = open.filter(o => o.courier === me && o.stage !== "kuryede"),
          road = open.filter(o => o.courier === me && o.stage === "kuryede"),
          done = closedToday()
            .filter(o => o.courier === me)
            .sort((a, b) => b.closedAt - a.closedAt);
        const sum = m => done.filter(o => collectOf(o) === m).reduce((s, o) => s + net(o), 0);
        const fee = (STAFF.find(s => s.n === me)?.fee || 0) * done.length;
        const sec = (t, list, mode, empty) =>
          `<section class="panel"><div class="split"><h3>${t}</h3><span class="chip">${list.length}</span></div>${list.length ? `<div class="kgrid">${list.map(o => kCard(o, mode)).join("")}</div>` : `<div class="hint">${empty}</div>`}</section>`;
        return `<div class="wzsum" style="margin-bottom:14px"><div><span class="lbl">Bugün teslim</span><b class="num">${done.length}</b></div><div><span class="lbl">Nakit (kasaya verilecek)</span><b class="num">${fmt(sum("Nakit"))}</b></div><div><span class="lbl">Kart</span><b class="num">${fmt(sum("Kart"))}</b></div><div><span class="lbl">Havale</span><b class="num">${fmt(sum("Havale"))}</b></div><div><span class="lbl">Online</span><b class="num">${fmt(sum("Online"))}</b></div><div><span class="lbl">Hakedişim</span><b class="num">${fmt(fee)}</b></div></div>
        ${sec("Yoldaki siparişlerim", road, "road", "Şu an yolda siparişiniz yok.")}
        ${sec("Aldığım siparişler", wait, "wait", "Henüz sipariş almadınız.")}
        ${sec("Alınabilir siparişler", free, "free", "Bekleyen paket sipariş yok.")}
        <section class="panel"><h3>Bugün teslim ettiklerim</h3>${
          done.length
            ? `<div class="wrapx"><table class="mtable sm"><thead><tr><th>Saat</th><th>Müşteri</th><th>Adres</th><th>Ödeme</th><th class="r">Tutar</th></tr></thead><tbody>${done
                .map(
                  o =>
                    `<tr><td class="num">${tStr(o.closedAt)}</td><td>${esc(oTitle(o))}</td><td class="hint">${esc(o.customer?.address || "")}</td><td><span class="chip">${esc(collectOf(o))}</span></td><td class="r num">${fmt(net(o))}</td></tr>`,
                )
                .join("")}</tbody></table></div>`
            : '<div class="hint">Bugün teslim edilen sipariş yok.</div>'
        }</section>`;
      }

      function kDoneModal(o) {
        const online = o.pay === "Online",
          def = online ? "Online" : String(o.pay).toLocaleLowerCase("tr-TR").includes("kart") ? "Kart" : "Nakit";
        modal(`<h2>Teslim · ${esc(oTitle(o))}</h2><div class="split"><span class="lbl">Tutar</span><b class="num" style="font-size:22px">${fmt(net(o))}</b></div>
       ${
         online
           ? '<p class="hint" style="margin:0">Bu sipariş platformda online ödendi. Müşteriden para alınmaz.</p>'
           : `<div class="field"><span class="lbl">Ödemeyi nasıl aldınız?</span><div class="optl">${COLLECT.map(([v, l]) => `<label class="opt"><input type="radio" name="kc" value="${v}" ${v === def ? "checked" : ""}><span>${l}</span></label>`).join("")}</div></div>`
       }
       <button class="btn pri" data-act="kDoneDo" data-id="${o.id}">Teslim edildi</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
      }
    </script>

    <!-- ============================== js/views/audit.js ============================== -->
    <script>
      // Takip: статистика за период и лента всех действий, выгрузка в Excel.

      function vTakip() {
        const p = S.tkP || "gun",
          st = periodStats(p),
          nk = st.ciro - st.gider;
        const tabs = Object.entries(PERN)
          .map(([k, n]) => `<button class="tab ${p === k ? "on" : ""}" data-act="tkP" data-p="${k}">${n}</button>`)
          .join("");
        const mx = Math.max(1, ...st.series.map(x => x[1]));
        const chart = st.series.length
          ? `<div class="cols hcols" role="img" aria-label="Ciro grafiği">${st.series.map(([l, v]) => `<div class="col" title="${l}: ${fmt(v)}"><span class="cv num">${v >= 1000 ? Math.round(v / 1000) + "k" : Math.round(v)}</span><span class="cw"><i style="height:${Math.max(2, (v / mx) * 100)}%"></i></span><span class="cd num">${l}</span></div>`).join("")}</div>`
          : '<div class="hint">Bu dönemde satış yok.</div>';
        const bars = (obj, lbl, val = fmt) => {
          const e = Object.entries(obj).sort((a, b) => b[1] - a[1]),
            m = Math.max(1, ...e.map(x => x[1]));
          return e.length
            ? `<div class="rbars">${e.map(([k, v]) => `<div class="rb"><div class="rbl"><span>${lbl(k)}</span><span class="num">${val(v)}</span></div><div class="rbt"><i style="width:${(v / m) * 100}%;--c:var(--accent)"></i></div></div>`).join("")}</div>`
            : '<div class="hint">Kayıt yok.</div>';
        };
        const top = Object.fromEntries(
          Object.entries(st.byP)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 6),
        );
        const staffRows = st.staff
          .filter(x => x.h || x.orders || x.del || x.ikram)
          .map(
            x =>
              `<tr><td><b>${esc(x.st.n)}</b><br><small class="hint">${ROLES[x.st.role]?.n || ""}</small></td><td class="r num">${x.days || "—"}</td><td class="r num">${x.h ? Math.round(x.h) + " sa" : "—"}</td><td class="r num">${x.orders || "—"}</td><td class="r num">${x.ciro ? fmt(x.ciro) : "—"}</td><td class="r num">${x.del || "—"}</td><td class="r num">${x.ikram || "—"}</td></tr>`,
          )
          .join("");
        return `<div class="rhead"><div class="tabs" style="margin:0">${tabs}</div><span class="hint">${new Date(st.R[0]).toLocaleDateString("tr-TR", { day: "numeric", month: "long" })} – ${new Date(st.R[1] - 1).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" })}</span><button class="btn" data-act="tkXls" style="margin-left:auto">Excel'e aktar</button></div>
        <section class="eq"><div class="eqc"><span class="lbl">Ciro</span><b class="num">${fmt(st.ciro)}</b></div><span class="eqop">−</span><div class="eqc"><span class="lbl">Giderler</span><b class="num">${fmt(st.gider)}</b></div><span class="eqop">=</span>
         <div class="eqc netc ${nk >= 0 ? "up" : "down"}"><span class="lbl">Net kazanç</span><b class="num">${fmt(nk)}</b></div>
         <div class="eqside"><div><span class="lbl">Sipariş</span><b class="num">${st.cl.length}</b></div><div><span class="lbl">Ort. sepet</span><b class="num">${fmt(st.cl.length ? st.cl.reduce((s, o) => s + net(o), 0) / st.cl.length : 0)}</b></div></div></section>
        <div class="rgrid">
         <section class="panel full"><div class="split"><h3>Ciro</h3><span class="hint">${p === "gun" ? "saatlere göre" : p === "yil" ? "aylara göre" : "günlere göre"}</span></div>${chart}</section>
         <section class="panel"><h3>Kanallara göre</h3>${bars(st.byCh, k => CH[k]?.n || k)}<div class="split hint" style="margin-top:8px"><span>İptal / red</span><b class="num">${st.ip.length}</b></div><div class="split hint"><span>Ort. teslimat süresi</span><b class="num">${st.avgDel ? st.avgDel + " dk" : "—"}</b></div></section>
         <section class="panel"><h3>Ödeme yöntemleri</h3>${bars(st.byPay, k => esc(k))}</section>
         <section class="panel"><h3>En çok satanlar</h3>${bars(
           top,
           k => esc(P(k)?.name || "?"),
           v => v + " adet",
         )}</section>
         <section class="panel"><h3>Stok ve menü</h3><div class="paylist">
          <div class="split"><span>Malzeme alımı</span><b class="num">${fmt(st.buy)}</b></div><div class="split"><span>Fire maliyeti</span><b class="num">${fmt(st.fire)}</b></div>
          <div class="split"><span>İkram maliyeti</span><b class="num">${fmt(st.ikram)}</b></div><div class="split"><span>Fiyat değişikliği</span><b class="num">${st.priceCh}</b></div></div></section>
         <section class="panel full"><h3>Personel</h3>${staffRows ? `<div class="wrapx"><table class="mtable sm"><thead><tr><th>Çalışan</th><th class="r">Gün</th><th class="r">Çalıştı</th><th class="r">Aldığı sipariş</th><th class="r">Ciro</th><th class="r">Teslimat</th><th class="r">İkram</th></tr></thead><tbody>${staffRows}</tbody></table></div>` : '<div class="hint">Kayıt yok.</div>'}</section>
        </div>
        <section class="panel" style="margin-top:14px"><div class="split"><h3>Tüm hareketler</h3><span class="hint" id="tkcount"></span></div>
         <div class="row tkfil">${sel("tk-c", [["", "Tüm türler"], ...EVCATS.map(c => [c, c])], S.tkC || "", 'data-act="tkF"')}${sel("tk-u", [["", "Tüm kişiler"], ...[...new Set(ACTLOG.map(a => a.u))].sort((a, b) => a.localeCompare(b, "tr")).map(u => [u, u])], S.tkU || "", 'data-act="tkF"')}<input id="tk-q" class="search" placeholder="Ara (örn. Emre, köfte, M4)" value="${esc(S.tkQ || "")}" data-act="tkQ" aria-label="Hareketlerde ara"></div>
         <div id="tkfeed">${tkFeed()}</div></section>`;
      }

      function tkRows() {
        const R = periodRange(S.tkP || "gun"),
          q = (S.tkQ || "").toLocaleLowerCase("tr-TR").trim();
        return ACTLOG.filter(
          a =>
            inR(a.t, R) &&
            (!S.tkC || (a.cat || actCat(a.what)) === S.tkC) &&
            (!S.tkU || a.u === S.tkU) &&
            (!q || [a.u, a.what, a.det, a.ok].join(" ").toLocaleLowerCase("tr-TR").includes(q)),
        ).sort((a, b) => b.t - a.t);
      }

      function tkFeed() {
        const rows = tkRows(),
          lim = S.tkLim || 150,
          show = rows.slice(0, lim);
        setTimeout(() => {
          const c = $("#tkcount");
          if (c) c.textContent = rows.length + " kayıt";
        }, 0);
        if (!rows.length) return '<div class="empty">Bu dönemde eşleşen hareket yok.</div>';
        let last = "",
          h = "";
        show.forEach(a => {
          const d = iso(new Date(a.t)),
            cat = a.cat || actCat(a.what);
          if (d !== last) {
            h += `<div class="tkday">${d === T0 ? "Bugün" : dLong(d)}</div>`;
            last = d;
          }
          h += `<div class="tkrow"><span class="num tkt">${tStr(a.t)}</span><span class="tkcat c-${EVCATS.indexOf(cat)}">${cat}</span><div style="min-width:0"><b>${esc(a.u)}</b> · ${esc(a.what)}${a.det ? `<div class="hint">${esc(a.det)}</div>` : ""}</div>${a.ok ? `<span class="chip warn" title="Onaylayan">${esc(a.ok)} onayladı</span>` : "<span></span>"}</div>`;
        });
        return (
          h +
          (rows.length > lim
            ? `<button class="btn" data-act="tkMore" style="margin-top:10px">Daha fazla göster (${rows.length - lim})</button>`
            : "")
        );
      }

      // Excel: özet, hareketler, personel, siparişler
      function tkExcel() {
        if (typeof XLSX === "undefined") {
          toast("Excel kütüphanesi yüklenemedi (internet gerekli)");
          return;
        }
        const p = S.tkP || "gun",
          st = periodStats(p),
          wb = XLSX.utils.book_new(),
          dt = t => new Date(t).toLocaleString("tr-TR");
        const add = (name, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), name);
        add("Özet", [
          ["Dönem", PERN[p]],
          ["Ciro (₺)", Math.round(st.ciro)],
          ["Giderler (₺)", Math.round(st.gider)],
          ["Net kazanç (₺)", Math.round(st.ciro - st.gider)],
          ["Sipariş", st.cl.length],
          ["İptal / red", st.ip.length],
          ["Malzeme alımı (₺)", Math.round(st.buy)],
          ["Fire (₺)", Math.round(st.fire)],
          ["İkram (₺)", Math.round(st.ikram)],
          [],
          ["Kanal", "Ciro (₺)"],
          ...Object.entries(st.byCh).map(([k, v]) => [CH[k]?.n || k, Math.round(v)]),
          [],
          ["Ödeme", "Tutar (₺)"],
          ...Object.entries(st.byPay).map(([k, v]) => [k, Math.round(v)]),
        ]);
        add("Hareketler", [
          ["Zaman", "Tür", "Kim", "İşlem", "Ayrıntı", "Onaylayan"],
          ...tkRows().map(a => [dt(a.t), a.cat || actCat(a.what), a.u, a.what, a.det, a.ok]),
        ]);
        add("Personel", [
          ["Çalışan", "Rol", "Gün", "Saat", "Aldığı sipariş", "Ciro (₺)", "Teslimat", "İkram"],
          ...st.staff.map(x => [
            x.st.n,
            ROLES[x.st.role]?.n,
            x.days,
            Math.round(x.h * 10) / 10,
            x.orders,
            Math.round(x.ciro),
            x.del,
            x.ikram,
          ]),
        ]);
        add("Siparişler", [
          ["Kapanış", "Kanal", "No / masa", "Personel", "Kurye", "Ödeme", "Tutar (₺)"],
          ...st.cl
            .sort((a, b) => b.closedAt - a.closedAt)
            .map(o => [
              dt(o.closedAt),
              CH[o.channel].n,
              o.table ? "Masa " + o.table : o.code || "#" + o.id,
              o.by || "",
              o.courier || "",
              o.paid.map(x => x.m).join(" + "),
              Math.round(net(o)),
            ]),
        ]);
        const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
        saveFile(
          `${S.rname}-takip-${PERN[p].replace(/\s+/g, "-")}-${T0}.xlsx`,
          new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }),
        );
        act("Takip raporu indirildi", PERN[p], "", "Ayarlar");
      }
    </script>

    <!-- ============================== js/events/audit.js ============================== -->
    <script>
      // Автозапись изменений в журнал (цены, склад, меню, расходы…). Срабатывает ДО действия, чтобы записать старое и новое значение.

      const AUDIT_CLICK = {
        doIn: b => {
          const k = b.dataset.k;
          return ING[k] && +$("#sq").value > 0 ? ["Stok", "Stok girişi", `${ING[k].n} +${$("#sq").value} ${qLbl(k)}`] : null;
        },
        doWaste: b => {
          const k = b.dataset.k;
          return ING[k] ? ["Stok", "Fire kaydı", `${ING[k].n} ${$("#sq").value} ${qLbl(k)} · ${$("#sr").value}`] : null;
        },
        saveIng: () => ($("#ni-n").value.trim() ? ["Stok", "Malzeme eklendi", $("#ni-n").value.trim()] : null),
        naAdd: () => ($("#na-n").value.trim() ? ["Stok", "Malzeme eklendi", $("#na-n").value.trim()] : null),
        doDelIng: b => [
          "Stok",
          "Malzeme silindi",
          b.dataset.k
            .split(",")
            .map(k => ING[k]?.n)
            .filter(Boolean)
            .join(", "),
        ],
        recvOne: b => {
          const k = b.dataset.k;
          return +$("#bq-" + k)?.value > 0
            ? ["Stok", "Teslim alındı", `${ING[k].n} ${$("#bq-" + k).value} ${qLbl(k)} · ${$("#bp-" + k).value} ${uLbl(k)}`]
            : null;
        },
        recvAll: () => ["Stok", "Satın alma listesi teslim alındı", ""],
        applyPrices: () => ["Menü", "Ürün fiyatları güncellendi", "Malzeme fiyatı değişikliği sonrası"],
        applyRule: () => ["Menü", "Fiyatlar kurala göre güncellendi", `%${SET.fc} food cost`],
        pfSave: () =>
          $("#pf-n").value.trim()
            ? [
                "Menü",
                S.pfEdit ? "Ürün güncellendi" : "Ürün eklendi",
                `${$("#pf-n").value.trim()} · ${fmt(+$("#pf-price").value || 0)}`,
              ]
            : null,
        rdSave: () => ($("#rd-n").value.trim() ? ["Menü", "Hazır ürün eklendi", $("#rd-n").value.trim()] : null),
        prodDel: b => ["Menü", "Ürün arşivlendi", P(b.dataset.p)?.name],
        unarch: b => ["Menü", "Ürün arşivden geri alındı", P(b.dataset.p)?.name],
        stop: b => {
          const p = P(b.dataset.p);
          return ["Menü", p.stop ? "Satışa açıldı" : "Satışa kapatıldı", p.name];
        },
        comboSave: () => ($("#cb-n").value.trim() ? ["Menü", "Menü (kombo) kaydedildi", $("#cb-n").value.trim()] : null),
        modOptAdd: b => {
          const g = MODS.find(x => x.id === b.dataset.g);
          return $("#mo-n-" + g.id).value.trim()
            ? ["Menü", "Seçenek eklendi", `${g.n}: ${$("#mo-n-" + g.id).value.trim()}`]
            : null;
        },
        modDel: b => ["Menü", "Seçenek grubu silindi", MODS.find(x => x.id === b.dataset.g)?.n],
        katAdd: () => ($("#newkat").value.trim() ? ["Menü", "Kategori eklendi", $("#newkat").value.trim()] : null),
        katDel: b => ["Menü", "Kategori silindi", catName(b.dataset.id)],
        addGider: () =>
          +$("#g-amt").value > 0
            ? [
                "Kasa ve gider",
                "Gider eklendi",
                `${$("#g-cat").value} · ${fmt(+$("#g-amt").value)}${$("#g-note").value ? " · " + $("#g-note").value : ""}`,
              ]
            : null,
        delGider: b => {
          const g = GIDER.find(x => x.id === +b.dataset.id);
          return g ? ["Kasa ve gider", "Gider silindi", `${g.cat} · ${fmt(g.amt)}`] : null;
        },
        saveRem: () =>
          $("#r-name").value.trim() ? ["Kasa ve gider", "Hatırlatıcı eklendi", $("#r-name").value.trim()] : null,
        paidRem: b => {
          const r = REM.find(x => x.id === +b.dataset.id);
          return r ? ["Kasa ve gider", "Ödeme yapıldı", `${r.name} · ${fmt(r.amt)}`] : null;
        },
        saveCust: b =>
          $("#nc-name").value.trim()
            ? ["Müşteri", b.dataset.id ? "Müşteri güncellendi" : "Müşteri eklendi", $("#nc-name").value.trim()]
            : null,
        resSt: b => {
          const r = RESV.find(x => x.id === +b.dataset.id);
          return r ? ["Müşteri", b.dataset.s === "iptal" ? "Rezervasyon iptal" : "Rezervasyona gelmedi", r.name] : null;
        },
        resCame: b => ["Müşteri", "Rezervasyon geldi", RESV.find(x => x.id === +b.dataset.id)?.name],
        setTables: () => ["Ayarlar", "Masa sayısı değişti", `${HALLS.Salon.length} → ${$("#tcount").value}`],
        moveTo: (b, o) => ["Sipariş", "Masa taşındı", `${o?.table} → ${b.dataset.t}`],
        tgAccept: () => ["Ayarlar", S.autoAccept ? "Otomatik onay kapatıldı" : "Otomatik onay açıldı", ""],
        devToggle: b => {
          const d = D(b.dataset.d);
          return ["Ayarlar", d.on ? "Cihaz bağlantısı kesildi" : "Cihaz bağlandı", d.n];
        },
        kGo: b => {
          const x = S.orders.find(y => y.id === +b.dataset.id);
          return x ? ["Kurye", "Kurye yola çıktı", `${x.code || "#" + x.id} · ${x.customer?.address || ""}`] : null;
        },
        loyOn: () => ["Müşteri", LOY.on ? "Sadakat programı kapatıldı" : "Sadakat programı açıldı", ""],
        campOn: b => {
          const c = CAMPS.find(x => x.id === +b.dataset.id);
          return c ? ["Müşteri", c.on ? "Kampanya kapatıldı" : "Kampanya açıldı", c.n] : null;
        },
      };

      const AUDIT_CHANGE = {
        price: b => {
          const p = P(b.dataset.p),
            k = b.dataset.k || "price",
            v = Math.round(+b.value || 0),
            ch = { price: "salon", ty: "Trendyol", mg: "Migros", ys: "Yemeksepeti" }[k] || k;
          return p && v !== p[k] ? ["Menü", "Ürün fiyatı değişti", `${p.name} · ${ch}: ${fmt(p[k])} → ${fmt(v)}`] : null;
        },
        ingPrice: b => {
          const k = b.dataset.k,
            v = +b.value || 0;
          return ING[k] && Math.abs(v - uPrice(k)) > 1e-6
            ? ["Stok", "Malzeme fiyatı değişti", `${ING[k].n}: ${fmt(uPrice(k))} → ${fmt(v)} ${uLbl(k)}`]
            : null;
        },
        ingUse: b =>
          ING[b.dataset.k]
            ? ["Stok", "Günlük kullanım değişti", `${ING[b.dataset.k].n}: ${b.value} ${qLbl(b.dataset.k)}/gün`]
            : null,
        set: b => [
          "Menü",
          "Fiyat kuralı değişti",
          `${{ fc: "Food cost %", app: "Uygulama ek %", step: "Yuvarlama ₺" }[b.dataset.k]}: ${SET[b.dataset.k]} → ${b.value}`,
        ],
        loySet: b => ["Müşteri", "Sadakat ayarı değişti", b.dataset.k],
        courier: b => {
          const x = S.orders.find(y => y.id === +b.dataset.id);
          return ["Kurye", b.value ? "Kurye atandı" : "Kurye kaldırıldı", `${x?.code || "#" + x?.id} · ${b.value || ""}`];
        },
        katName: b => ["Menü", "Kategori adı değişti", `${catName(b.dataset.id)} → ${b.value}`],
      };

      function audit(rule, b, o) {
        try {
          const r = rule && rule(b, o);
          if (r && r[2] !== undefined && r[1]) act(r[1], r[2] || "", "", r[0]);
        } catch (e) {
          /* kayıt hatası işlemi durdurmasın */
        }
      }

      document.addEventListener("click", e => {
        const b = e.target.closest("[data-act]");
        if (b)
          audit(
            AUDIT_CLICK[b.dataset.act],
            b,
            S.orders.find(x => x.id === S.activeId),
          );
      });
      document.addEventListener("change", e => {
        const b = e.target;
        if (b.dataset?.act) audit(AUDIT_CHANGE[b.dataset.act], b);
      });
    </script>

    <script>
      // Все клики: по data-act передаёт управление файлам из js/actions.

      // Tüm tıklamalar buradan geçer: data-act değerine göre ilgili işleyici çalışır.
      const ACTIONS = [];
      document.addEventListener("click", e => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        const a = b.dataset.act;
        if (a === "closeScrim" && e.target !== b) return;
        if (
          [
            "cq",
            "cmq",
            "sq",
            "courier",
            "price",
            "set",
            "loySet",
            "wzName",
            "ingEdit",
            "xlsImp",
            "rdCalc",
            "icat",
            "selAll",
            "selIng",
            "ovToggle",
            "ovVal",
            "katName",
            "katTransfer",
            "qrBase",
            "pfCalc",
            "pfCat",
            "rpKey",
            "ingUse",
            "gfile",
            "gfileNew",
            "disc",
            "tf",
            "tfsave",
            "tfpay",
            "ingPrice",
            "buyCalc",
          ].includes(a)
        )
          return;
        const o = S.orders.find(x => x.id === S.activeId);
        const byId = () => S.orders.find(x => x.id === +b.dataset.id);
        if (isOff() && ["send", "payIt", "closeTable", "accept", "confirmTel", "stage", "optAdd", "add"].includes(a))
          S.offQ = (S.offQ || 0) + 1;
        for (const h of ACTIONS) {
          if (h(a, b, o, byId, e) !== false) return;
        }
      });
    </script>

    <script>
      // Мгновенные обновления при вводе (поиск и т. п.).

      document.addEventListener("input", e => {
        const b = e.target,
          a = b.dataset.act;
        if (a === "tkQ") {
          S.tkQ = b.value;
          S.tkLim = 150;
          $("#tkfeed").innerHTML = tkFeed();
        }
        if (a === "pfCalc") pfCalc();
        if (a === "pfIng") {
          const m = Object.keys(ING).find(
            k => ING[k].n.toLocaleLowerCase("tr-TR") === b.value.trim().toLocaleLowerCase("tr-TR"),
          );
          b.dataset.k = m || "";
          pfList(b);
          pfCalc();
        }
        if (b.id === "pf-price") b.dataset.touched = "1";
        if (a === "cq") {
          S.cq = b.value;
          $("#custtable").innerHTML = custTable(custRows(S.cq));
        }
        if (a === "cmq") {
          $("#cmlist").innerHTML = clistHTML(b.value);
        }
        if (a === "sq") {
          S.sq = b.value;
          $("#ingtable").innerHTML = ingTable(S.sq);
        }
        if (a === "tf") {
          const o = S.orders.find(x => x.id === S.activeId);
          if (b.dataset.f === "note") o.note = b.value;
          else o.customer[b.dataset.f] = b.value;
        }
        if (a === "buyCalc") {
          const k = b.dataset.k;
          $("#bt-" + k).textContent = fmt((+$("#bq-" + k).value || 0) * (+$("#bp-" + k).value || 0));
        }
        if (a === "wzq") {
          S.wzq = b.value;
          $("#wzplist").innerHTML = wzList();
        }
        if (a === "kcount") {
          const d = Math.round(+b.value || 0) - +b.dataset.e,
            el = $("#kc-d");
          el.textContent = d ? (d > 0 ? "+" : "") + fmt(d) + (d < 0 ? " eksik" : " fazla") : "Tam";
          el.style.color = d < 0 ? "var(--bad)" : d > 0 ? "var(--warn)" : "var(--ok)";
        }
        if (b.id === "cb-p") b.dataset.touched = "1";
      });
    </script>

    <!-- ============================== js/events/change.js ============================== -->
    <script>
      // Сохранение при изменении полей.

      document.addEventListener("change", e => {
        const b = e.target;
        const a = b.dataset.act;
        if (a === "courier") {
          S.orders.find(x => x.id === +b.dataset.id).courier = b.value;
          toast(b.value ? `Kurye: ${b.value}` : "Kurye kaldırıldı");
          render();
        }
        if (a === "price") {
          const p = P(b.dataset.p),
            k = b.dataset.k || "price",
            PL = Object.fromEntries(PLATS.map(x => [x[0], x[1]]));
          const v = Math.max(0, Math.round(+b.value || 0));
          const old = p[k];
          setPrice(p.id, v, k);
          toast(`${p.name} · ${k === "price" ? "salon (masa, telefon, WhatsApp, QR menü)" : PL[k]}: ${fmt(old)} → ${fmt(v)}`);
          render();
        }
        if (a === "wzName") {
          S.rname = b.value.trim() || S.rname;
          render();
        }
        if (a === "ingEdit") {
          const g = ING[b.dataset.k],
            f = b.dataset.f,
            m = isG(b.dataset.k) ? 1000 : 1;
          if (f === "n") {
            const v = b.value.trim();
            if (v) g.n = v;
          } else if (f === "c") {
            g.c = b.value;
            g.pack = b.value === "Ambalaj";
          } else g[f] = Math.max(0, +b.value || 0) * m;
          toast("Kaydedildi");
        }
        if (a === "xlsImp") {
          const f = b.files && b.files[0];
          if (!f) return;
          if (typeof XLSX === "undefined") {
            toast("Excel okuyucu yüklenemedi, sayfayı yenileyin");
            return;
          }
          f.arrayBuffer()
            .then(buf => {
              const wb = XLSX.read(buf, { type: "array" }),
                find = re => wb.SheetNames.find(n => re.test(n.toLocaleLowerCase("tr-TR"))),
                rows = n => (n ? XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }) : []);
              const r = importRows(rows(find(/malzeme/)), rows(find(/re[cç]ete/)), rows(find(/maliyet/)));
              importModal(r);
            })
            .catch(() => toast("Dosya okunamadı"));
          b.value = "";
        }
        if (a === "icat") {
          S.icat = b.value;
          $("#ingtable").innerHTML = ingTable(S.sq);
        }
        if (a === "selIng") {
          b.checked ? S.sel.add(b.dataset.k) : S.sel.delete(b.dataset.k);
          b.closest("tr").classList.toggle("selrow", b.checked);
          $("#bulkdel").hidden = !S.sel.size;
          $("#selcount").textContent = S.sel.size;
        }
        if (a === "selAll") {
          document.querySelectorAll('[data-act="selIng"]').forEach(x => {
            x.checked = b.checked;
            b.checked ? S.sel.add(x.dataset.k) : S.sel.delete(x.dataset.k);
            x.closest("tr").classList.toggle("selrow", b.checked);
          });
          $("#bulkdel").hidden = !S.sel.size;
          $("#selcount").textContent = S.sel.size;
        }
        if (a === "ovToggle") {
          const o = S.orders.find(x => x.id === S.activeId);
          const f = ok => {
            if (b.checked) {
              o.override = Math.round(Math.max(0, total(o) - campAmt(o)) * (1 - (o.discount || 0) / 100));
              act("Fiyat elle değiştirildi", oTitle(o), ok);
            } else delete o.override;
            setTimeout(() => {
              payModal();
              render();
            }, 0);
          };
          if (!b.checked || can("discount")) f("");
          else {
            b.checked = false;
            need("discount", "Fiyatı elle değiştirme", ok => {
              b.checked = true;
              f(ok);
            });
          }
        }
        if (a === "ovVal") {
          const o = S.orders.find(x => x.id === S.activeId);
          o.override = Math.max(0, Math.round(+b.value || 0));
          toast(`Toplam elle değiştirildi: ${fmt(o.override)}`);
          setTimeout(() => {
            payModal();
            render();
          }, 0);
        }
        if (a === "katName") {
          const c = CATS.find(x => x[0] === b.dataset.id),
            v = b.value.trim();
          if (v) {
            c[1] = v;
            toast("Kategori adı güncellendi");
          }
        }
        if (a === "katTransfer" && b.value) {
          const from = b.dataset.id,
            to = b.value;
          let n = 0;
          AP().forEach(p => {
            if (p.cat === from) {
              p.cat = to;
              n++;
            }
          });
          toast(`${n} ürün taşındı`);
          render();
        }
        if (a === "qrBase") {
          S.qrBase = b.value.trim() || S.qrBase;
          render();
        }
        if (a === "pfCat") {
          $("#pf-newcat").hidden = b.value !== "__new";
          if (b.value === "__new") $("#pf-newcat").focus();
        }
        if (a === "pfCalc") pfCalc();
        if (a === "ingUse") {
          const k = b.dataset.k,
            v = Math.max(0, +b.value || 0);
          ING[k].use = isG(k) ? v * 1000 : v;
          toast(`${ING[k].n}: günlük kullanım ${fq(ING[k].use, ING[k].u)}`);
          render();
        }
        if (a === "gfile" || a === "gfileNew") {
          const f = b.files && b.files[0];
          if (!f) return;
          const file = { name: f.name, url: URL.createObjectURL(f), img: f.type.startsWith("image/") };
          if (a === "gfileNew") {
            S.newFile = file;
            $("#g-fname").textContent = f.name;
          } else {
            GIDER.find(x => x.id === +b.dataset.id).file = file;
            toast("Fiş eklendi");
            render();
          }
        }
        if (a === "loySet") {
          const k = b.dataset.k;
          LOY[k] = k === "apps" ? b.checked : k === "gift" ? b.value : Math.max(k === "every" ? 2 : 0, +b.value || 0);
          toast("Sadakat ayarı kaydedildi");
          render();
        }
        if (a === "set") {
          const v = +b.value;
          if (v > 0) {
            SET[b.dataset.k] = v;
            render();
          }
        }
        if (a === "disc") {
          const o = S.orders.find(x => x.id === S.activeId),
            v = Math.min(100, Math.max(0, +b.value || 0));
          const f = ok => {
            o.discount = v;
            if (v) act("İndirim", `%${v} · ${oTitle(o)}`, ok);
            setTimeout(() => {
              payModal();
              render();
            }, 0);
          };
          if (can("discount") || v === 0) f("");
          else {
            b.value = o.discount;
            need("discount", "İndirim %" + v, f);
          }
        }
        if (a === "tfsave") {
          S.orders.find(x => x.id === S.activeId).saveAddr = b.checked;
        }
        if (a === "tfpay") {
          S.orders.find(x => x.id === S.activeId).pay = b.value;
        }
        if (a === "tf" && b.dataset.f === "phone") {
          const o = S.orders.find(x => x.id === S.activeId),
            c = byPhone(b.value);
          if (c && o.custId !== c.id) {
            o.custId = c.id;
            if (!o.customer.name) o.customer.name = c.name;
            toast(`Kayıtlı müşteri: ${c.name} · ${c.visits} sipariş`);
            render();
          } else if (!c && o.custId) {
            o.custId = null;
            render();
          }
        }
        if (a === "ingPrice") {
          const k = b.dataset.k,
            v = Math.max(0, +b.value || 0),
            old = ING[k].cost,
            nc = isG(k) ? v / 1000 : v;
          if (Math.abs(nc - old) < 1e-9) return;
          ING[k].cost = nc;
          LOG.unshift({ t: now(), k, d: 0, why: `Birim fiyat: ${fmt(isG(k) ? old * 1000 : old)} → ${fmt(v)} ${uLbl(k)}` });
          render();
          costChange([{ k, old }]);
        }
        if (a === "tkF") {
          S.tkC = $("#tk-c").value;
          S.tkU = $("#tk-u").value;
          S.tkLim = 150;
          $("#tkfeed").innerHTML = tkFeed();
        }
        if (a === "sfRole") {
          const f = $("#sf-f");
          if (f) f.disabled = b.value !== "kurye";
        }
        if (a === "spIt") {
          let s = 0;
          document.querySelectorAll('[data-act="spIt"]:checked').forEach(x => (s += +x.dataset.v));
          if ($("#amt"))
            $("#amt").value =
              s ||
              Math.round(
                Math.max(0, net(S.orders.find(x => x.id === S.activeId)) - paidSum(S.orders.find(x => x.id === S.activeId))),
              );
        }
        if (a === "modName") {
          const g = MODS.find(x => x.id === b.dataset.g),
            v = b.value.trim();
          if (v) {
            g.n = v;
            toast("Grup adı kaydedildi");
          }
        }
        if (a === "modOpt") {
          const g = MODS.find(x => x.id === b.dataset.g),
            o = g.opts[+b.dataset.o];
          if (b.dataset.f === "n") {
            const v = b.value.trim();
            if (v) o.n = v;
          } else o.p = Math.max(0, Math.round(+b.value || 0));
          toast("Seçenek kaydedildi");
        }
        if (a === "feeSet") {
          const s = SF(+b.dataset.id);
          s.fee = Math.max(0, Math.round(+b.value || 0));
          toast(`${s.n}: paket başı ${fmt(s.fee)}`);
          render();
        }
        if (a === "proute") {
          PRINTROUTE[b.dataset.c] = b.value;
          toast("Yazıcı yönlendirmesi kaydedildi");
        }
        if (a === "kvText") {
          KVKK.text = b.value;
          toast("Aydınlatma metni kaydedildi");
        }
        if (a === "kvKeep") {
          KVKK.keep = +b.value;
          toast(`Saklama süresi: ${KVKK.keep} yıl`);
        }
        if (a === "cbCalc") cbCalc();
        if (a === "pfImg") {
          const f = b.files && b.files[0];
          if (!f) return;
          imgData(f, 480, u => {
            S.pfImg = u;
            const pv = $("#pf-imgpv");
            if (pv) pv.innerHTML = `<img src="${u}" alt="">`;
          });
        }
        if (a === "backupUp") {
          const f = b.files && b.files[0];
          if (!f) return;
          f.text().then(t => {
            let d;
            try {
              d = JSON.parse(t);
            } catch (e) {
              toast("Dosya okunamadı");
              return;
            }
            if (!d || d.v !== SVER) {
              toast("Bu yedek bu sürümle uyumlu değil");
              return;
            }
            S.bk = d;
            modal(
              `<h2>Yedek yüklensin mi?</h2><p style="margin:0">${new Date(d.at).toLocaleString("tr-TR")} tarihli yedek. Şu anki veriler yedekteki verilerle değiştirilir.</p><button class="btn pri" data-act="bkGo">Onayla, yükle</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
            );
          });
          b.value = "";
        }
        persist();
      });
    </script>

    <script>
      // Клавиши (Enter, Esc) и выпадающие списки.

      document.addEventListener("keydown", e => {
        if (e.key === "Enter" && e.target.id === "rp") {
          $('[data-act="rpGo"]').click();
          return;
        }
        if (e.key === "Enter" && e.target.id === "mgpin") {
          $('[data-act="mgGo"]').click();
          return;
        }
        if (e.key === "Escape" && $("#modal").innerHTML) modal("");
      });

      document.addEventListener("focusin", e => {
        if (e.target.classList?.contains("pfing")) pfList(e.target);
      });

      document.addEventListener("mousedown", e => {
        if (!e.target.closest(".pfpick")) document.querySelectorAll(".pfdd").forEach(d => (d.hidden = true));
      });

      document.addEventListener("keydown", e => {
        if (e.target.classList?.contains("pfing") && e.key === "Enter") {
          e.preventDefault();
          e.target.nextElementSibling.querySelector(".pfopt")?.click();
        }
        if (e.key === "Escape") document.querySelectorAll(".pfdd").forEach(d => (d.hidden = true));
      });
    </script>

    <script>
      // Кнопки: переходы, вкладки, пароль, подтверждение менеджером.

      function navigationActions(a, b, o, byId, e) {
        switch (a) {
          case "nav":
            modal("");
            if (!viewOK(b.dataset.v)) {
              toast("Bu bölüm için yetkiniz yok");
              return;
            }
            if ((b.dataset.v === "report" || b.dataset.v === "takip") && !S.repOK) {
              passModal(b.dataset.v);
              return;
            }
            S.view = b.dataset.v;
            if (b.dataset.st) S.stockTab = b.dataset.st;
            break;
          case "logout":
            act("Çıkış yaptı", "");
            S.repOK = false;
            S.user = null;
            $("#app").hidden = true;
            $("#login").hidden = false;
            return;
          case "bell":
            bellModal();
            return;
          case "ofilt":
            S.ofilt = b.dataset.f;
            break;
          case "otab":
            S.otab = b.dataset.f;
            break;
          case "close":
            modal("");
            break;
          case "closeScrim":
            modal("");
            return;
          case "stab":
            S.stockTab = b.dataset.s;
            break;
          case "rtab":
            S.rtab = b.dataset.r;
            break;
          case "tgAccept":
            S.autoAccept = !S.autoAccept;
            toast(
              S.autoAccept
                ? "Otomatik onay açık: platform siparişleri kendiliğinden onaylanır"
                : "Otomatik onay kapalı: siparişleri elle onaylayın",
            );
            break;
          case "undo": {
            const f = S.undo;
            S.undo = null;
            $("#toast").hidden = true;
            if (f) f();
            break;
          }
          case "tglTables":
            S.showTables = !S.showTables;
            break;
          case "rpGo": {
            if ($("#rp").value === S.repPass) {
              S.repOK = true;
              modal("");
              S.view = S.pwTo || "report";
              break;
            }
            $("#rperr").textContent = "Şifre hatalı.";
            return;
          }
          case "tkP":
            S.tkP = b.dataset.p;
            S.tkLim = 150;
            break;
          case "tkMore":
            S.tkLim = (S.tkLim || 150) + 300;
            $("#tkfeed").innerHTML = tkFeed();
            return;
          case "tkXls":
            tkExcel();
            return;
          case "stTab":
            S.setTab = b.dataset.s;
            break;
          case "mgGo": {
            const m = STAFF.find(s => s.active && s.role === "admin" && s.pin === $("#mgpin").value);
            if (!m) {
              $("#mgerr").textContent = "PIN hatalı veya yönetici değil.";
              return;
            }
            const f = S.pendFn;
            S.pendFn = null;
            modal("");
            if (f) f(m.n);
            render();
            return;
          }
          case "staffTab":
            S.staffTab = b.dataset.s;
            break;
          case "custTab":
            S.custTab = b.dataset.s;
            break;
          case "menuTab":
            S.menuTab = b.dataset.s;
            break;
          case "goQrMenu":
            modal("");
            S.view = "menu";
            S.menuTab = "qr";
            break;
          default:
            return false;
        }
        render();
      }
      ACTIONS.push(navigationActions);
    </script>

    <!-- ============================== js/actions/orders.js ============================== -->
    <script>
      // Кнопки: адисьон, заказы, оплата, ikram, перенос, акции.

      function ordersActions(a, b, o, byId, e) {
        switch (a) {
          case "table": {
            let t = tableOrder(b.dataset.t);
            if (!t) {
              t = mk({ channel: "masa", table: b.dataset.t });
              S.orders.push(t);
            }
            S.activeId = t.id;
            S.view = "pos";
            break;
          }
          case "openTable":
            S.activeId = +b.dataset.id;
            S.view = "pos";
            break;
          case "payFrom":
            S.activeId = +b.dataset.id;
            payModal();
            return;
          case "back":
            if (o && o.channel === "masa" && !o.items.length && !o.custId) S.orders.splice(S.orders.indexOf(o), 1);
            else if (o && o.status === "taslak") S.orders.splice(S.orders.indexOf(o), 1);
            S.view = "home";
            break;
          case "cat":
            S.cat = b.dataset.c;
            break;
          case "add": {
            const p = P(b.dataset.p);
            if (hasOptions(p)) {
              optModal(p.id);
              return;
            }
            addLine(o, { pid: p.id });
            break;
          }
          case "qty": {
            const i = o.items[+b.dataset.i];
            if (i.gift && +b.dataset.d > 0) return;
            if (+b.dataset.d > 0 && !i.sent && RECIPES[i.pid]) {
              const inCart = o.items.filter(x => x.pid === i.pid && !x.sent).reduce((s, x) => s + x.qty, 0);
              if (inCart >= canMake(i.pid)) {
                toast("Bu üründen daha fazla yapmaya malzeme yetmiyor");
                return;
              }
            }
            if (i.sent && +b.dataset.d < 0) {
              lineModal(+b.dataset.i);
              return;
            }
            if (i.ikram && +b.dataset.d > 0) return;
            i.qty += +b.dataset.d;
            if (i.sent && +b.dataset.d > 0) {
              moveStock([{ ...i, qty: 1 }], -1, "Satış: " + (o.table ? "Masa " + o.table : "#" + o.id), o.channel !== "masa");
              i.ready = false;
              i.sentAt = now();
            }
            if (i.qty <= 0) {
              o.items.splice(+b.dataset.i, 1);
              if (i.sent) toast("Ürün iptal edildi, malzeme stoka geri döndü");
            }
            break;
          }
          case "send":
            sendItems(o, "Satış: Masa " + o.table);
            o.stage = "alindi";
            toast(`Masa ${o.table}: sipariş alındı, mutfağa gitti` + autoPrint(o) + S.lastRoute);
            S.view = "home";
            break;
          case "stage": {
            const x = byId();
            if (!setStage(x, b.dataset.s)) return;
            break;
          }
          case "pay":
            payModal();
            return;
          case "payIt": {
            const amt = Math.min(+$("#amt").value || 0, net(o) - paidSum(o));
            if (amt <= 0) return;
            const pm = b.dataset.m;
            if (!can("pay")) {
              need("pay", "Ödeme almak", ok => {
                o.paid.push({ m: pm, a: amt });
                act("Ödeme", `${pm} ${fmt(amt)}`, ok);
                setTimeout(() => {
                  payModal();
                  render();
                }, 0);
              });
              return;
            }
            if (b.dataset.m === "Kart" && D("okc").on) {
              payModal(amt);
              setTimeout(() => {
                o.paid.push({ m: "Kart", a: amt });
                toast("ÖKC: ödeme onaylandı");
                payModal();
              }, 1600);
              return;
            }
            o.paid.push({ m: b.dataset.m, a: amt });
            payModal();
            return;
          }
          case "closeTable": {
            o.status = "kapali";
            if (!o.by) o.by = S.user?.n;
            o.closedAt = now();
            o.stage = "servis";
            o.items.forEach(i => (i.ready = true));
            act(
              "Hesap kapatıldı",
              `Masa ${o.table} · ${fmt(net(o))} · ${o.paid.map(p => p.m + " " + fmt(p.a)).join(", ")}`,
              "",
              "Sipariş",
            );
            modal("");
            const c = o.custId && C(o.custId);
            if (c) visit(c, "Masa " + o.table, net(o), o);
            toast(
              (D("okc").on ? `Mali fiş kesildi · No ${FIS++}. ` : "") +
                (c ? `${c.name}: ${c.visits}. ziyaret kaydedildi` : `Masa ${o.table} kapatıldı`),
            );
            S.view = "home";
            break;
          }
          case "move":
            moveModal();
            return;
          case "moveTo": {
            const old = o.table;
            o.table = b.dataset.t;
            modal("");
            toast(`${old} → ${o.table} taşındı`);
            break;
          }
          case "sim":
            simOrder();
            return;
          case "accept": {
            const x = byId();
            x.stage = "alindi";
            sendItems(x, "Satış: " + CH[x.channel].n + " " + (x.code || "#" + x.id));
            toast("Onaylandı: sipariş alındı, mutfağa gitti" + autoPrint(x) + S.lastRoute);
            break;
          }
          case "reject": {
            const x = byId();
            x.status = "iptal";
            x.closedAt = now();
            toast("Sipariş reddedildi");
            act("Sipariş reddedildi", `${CH[x.channel].n} ${x.code || "#" + x.id}`, "", "Sipariş");
            break;
          }
          case "newPaket": {
            const n = telOrder("");
            S.orders.push(n);
            S.activeId = n.id;
            S.view = "pos";
            break;
          }
          case "useAddr": {
            const c = C(o.custId);
            o.customer.address = c.addresses[+b.dataset.i];
            o.saveAddr = false;
            break;
          }
          case "confirmTel": {
            const cu = o.customer;
            if (!o.items.length) {
              toast("Önce ürün ekleyin");
              return;
            }
            if (!cu.address.trim()) {
              toast("Teslimat adresini yazın");
              $("#tf-addr")?.focus();
              return;
            }
            let c = o.custId ? C(o.custId) : byPhone(cu.phone);
            if (!c && (cu.name.trim() || cu.phone.trim())) {
              c = {
                id: ++CID,
                name: cu.name.trim() || "İsimsiz müşteri",
                phone: cu.phone.trim(),
                addresses: [],
                note: "",
                visits: 0,
                spent: 0,
                last: now(),
                hist: [],
              };
              CUSTOMERS.push(c);
            }
            if (c) {
              o.custId = c.id;
              if (!cu.name.trim()) cu.name = c.name;
              if (o.saveAddr !== false && !c.addresses.some(ad => normA(ad) === normA(cu.address)))
                c.addresses.push(cu.address.trim());
            }
            o.status = "acik";
            o.stage = "alindi";
            o.createdAt = now();
            sendItems(o, "Satış: Telefon #" + o.id);
            S.seen.add(o.id);
            toast("Telefon siparişi alındı, mutfağa gitti" + autoPrint(o) + S.lastRoute);
            S.view = "home";
            S.otab = "aktif";
            break;
          }
          case "cancelTel":
            S.orders.splice(S.orders.indexOf(o), 1);
            S.view = "home";
            break;
          case "receipt":
            receiptModal(byId());
            return;
          case "doPrint": {
            const x = byId();
            printAd(x);
            receiptModal(x);
            toast("Adisyon yazdırıldı (demo)");
            render();
            receiptModal(x);
            return;
          }
          case "addGift": {
            if (o.items.some(i => i.gift) || !P(LOY.gift)) {
              if (!P(LOY.gift)) toast("Hediye ürünü seçilmemiş (Müşteriler → Sadakat)");
              return;
            }
            const g = it(LOY.gift, 1, false, false, 0, o.channel);
            g.price = 0;
            g.gift = true;
            o.items.push(g);
            toast(`${P(LOY.gift)?.name || "—"} hediye olarak eklendi`);
            break;
          }
          case "cancelAsk": {
            const x = byId();
            const show = () =>
              modal(`<h2>Sipariş iptal edilsin mi?</h2><p style="margin:0"><b>${CH[x.channel].n}</b> ${esc(x.code || "#" + x.id)} · ${fmt(net(x))}</p>
         <div class="field"><label class="lbl" for="cr">İptal nedeni</label><select id="cr" class="sel">${["Müşteri iptal etti", "Platform iptal etti", "Ürün kalmadı", "Adres bulunamadı", "Diğer"].map(r => `<option>${r}</option>`).join("")}</select></div>
         <p class="hint" style="margin:0">Mutfağa giden ürünlerin malzemeleri stoka geri döner.</p><button class="btn danger solid" data-act="doCancel" data-id="${x.id}">Onayla, iptal et</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
            if (can("cancel")) show();
            else need("cancel", "Online siparişi iptal", () => setTimeout(show, 0));
            return;
          }
          case "doCancel": {
            const x = byId();
            moveStock(
              x.items.filter(i => i.sent),
              1,
              "İptal: " + (x.code || "#" + x.id),
              true,
            );
            x.status = "iptal";
            x.closedAt = now();
            x.cancelReason = $("#cr").value;
            act("Sipariş iptal", `${x.code || "#" + x.id} · ${x.cancelReason}`);
            modal("");
            toast(`Sipariş iptal edildi · ${x.cancelReason}`);
            break;
          }
          case "addLoyDisc": {
            o.discount = LOY.pct;
            o.loyDisc = true;
            toast(`%${LOY.pct} sadakat indirimi uygulandı`);
            break;
          }
          case "optAdd": {
            const p = P(b.dataset.p),
              gs = modsFor(p),
              parts = p.combo
                ? p.combo.pick.map((g, gi) => document.querySelector(`input[name="pk${gi}"]:checked`)?.value).filter(Boolean)
                : null,
              mods = [];
            gs.forEach(g =>
              document.querySelectorAll(`input[name="md-${g.id}"]:checked`).forEach(x => {
                const op = g.opts[+x.value];
                mods.push({ g: g.id, n: op.n, p: op.p || 0 });
              }),
            );
            const inCart = o.items.filter(i => i.pid === p.id && !i.sent).reduce((s, i) => s + i.qty, 0);
            if (inCart >= canMake(p.id)) {
              toast("Bu üründen daha fazla yapmaya malzeme yetmiyor");
              return;
            }
            document
              .querySelectorAll('input[name="ex"]:checked')
              .forEach(x =>
                mods.push({ g: "ex", n: "Ekstra " + ING[x.value].n, p: +x.dataset.p, add: [[x.value, +x.dataset.q]] }),
              );
            const note = $("#opt-note")?.value.trim() || "";
            addLine(o, { pid: p.id, parts, mods, note });
            modal("");
            toast(`${p.name}${mods.length ? " · " + mods.map(m => m.n).join(", ") : ""} eklendi`);
            break;
          }
          case "lineNote": {
            const i = o.items[+b.dataset.i];
            modal(`<h2>${esc(iName(i))} · not</h2>${fld("ln-n", "Not (mutfak görür)", `<textarea id="ln-n" rows="3" placeholder="Örn. az pişsin, sos ayrı gelsin">${esc(i.note || "")}</textarea>`)}
       <button class="btn pri" data-act="lineNoteDo" data-i="${b.dataset.i}">Kaydet</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
            setTimeout(() => $("#ln-n")?.focus(), 30);
            return;
          }
          case "lineNoteDo": {
            o.items[+b.dataset.i].note = $("#ln-n").value.trim();
            modal("");
            break;
          }
          case "lineAct":
            lineModal(+b.dataset.i);
            return;
          case "lineDo": {
            const ix = +b.dataset.i,
              i = o.items[ix],
              k = b.dataset.k,
              n = Math.min(i.qty, Math.max(1, Math.round(+$("#la-q").value || 1))),
              why = $("#la-w").value,
              where = o.table ? "Masa " + o.table : o.code || "#" + o.id,
              nm = iName(i);
            need(k === "ikram" ? "ikram" : "void", k === "ikram" ? "İkram" : "Mutfağa gitmiş ürünü iptal", ok => {
              const uc = itemRec(i, o.channel !== "masa").reduce((s, [x, q]) => s + (ING[x] ? ING[x].cost * q : 0), 0);
              if (k === "ikram") {
                const cl = { ...i, qty: n, price: 0, ikram: { why, by: S.user.n, orig: i.price } };
                i.qty -= n;
                if (i.qty <= 0) o.items.splice(ix, 1, cl);
                else o.items.splice(ix + 1, 0, cl);
                IKRAM.push({ t: now(), pid: i.pid, qty: n, cost: uc * n, price: i.price * n, why, u: S.user.n, where });
                act("İkram", `${n}× ${nm} · ${where} · ${why}`, ok);
                toast(`${n}× ${nm} ikram edildi`);
              } else {
                if (k === "iade") moveStock([{ ...i, qty: n }], 1, "İptal: " + where, o.channel !== "masa");
                else WASTE.push({ t: now(), pid: i.pid, qty: n, cost: uc * n, why, u: S.user.n });
                i.qty -= n;
                if (i.qty <= 0) o.items.splice(ix, 1);
                act(k === "iade" ? "Ürün iptal (stoka döndü)" : "Ürün iptal (fire)", `${n}× ${nm} · ${where} · ${why}`, ok);
                toast(k === "iade" ? "Ürün iptal edildi, malzeme stoka döndü" : `Fire kaydedildi: ${n}× ${nm}`);
              }
              modal("");
              render();
            });
            return;
          }
          case "mergeModal":
            mergeModal();
            return;
          case "mergeDo": {
            const x = tableOrder(b.dataset.t);
            if (!x) return;
            o.items.push(...x.items);
            o.paid.push(...x.paid);
            if (!o.custId) o.custId = x.custId;
            if (x.note) o.note = [o.note, x.note].filter(Boolean).join(" · ");
            if (!o.stage) o.stage = x.stage;
            if (x.createdAt < o.createdAt) o.createdAt = x.createdAt;
            S.orders.splice(S.orders.indexOf(x), 1);
            act("Masa birleştirme", `${x.table} → ${o.table}`);
            modal("");
            toast(`${x.table} hesabı Masa ${o.table}'e eklendi`);
            break;
          }
          case "itemMoveModal":
            itemMoveModal();
            return;
          case "itemMoveDo": {
            const t = $("#mv-t").value;
            let x = tableOrder(t),
              n = 0;
            if (!x) {
              x = mk({ channel: "masa", table: t });
              S.orders.push(x);
            }
            for (let ix = o.items.length - 1; ix >= 0; ix--) {
              const i = o.items[ix],
                q = Math.min(i.qty, Math.max(0, Math.round(+$("#mv-" + ix)?.value || 0)));
              if (!q) continue;
              x.items.push({ ...i, qty: q });
              i.qty -= q;
              n += q;
              if (i.qty <= 0) o.items.splice(ix, 1);
            }
            if (!n) {
              toast("Taşınacak adet girin");
              return;
            }
            if (!x.stage && x.items.some(i => i.sent)) x.stage = o.stage || "alindi";
            act("Ürün taşıma", `${n} ürün · ${o.table} → ${t}`);
            modal("");
            toast(`${n} ürün ${t} masasına taşındı`);
            break;
          }
          case "campApply": {
            o.camp = +b.dataset.c;
            const c = CAMPS.find(x => x.id === o.camp);
            act("Kampanya", `${c.n} · ${oTitle(o)}`);
            toast(`${c.n} uygulandı: −${fmt(campAmt(o))}`);
            break;
          }
          case "campRemove":
            o.camp = null;
            toast("Kampanya kaldırıldı");
            break;
          case "kuponGo": {
            const v = ($("#kupon").value || "").trim().toLocaleUpperCase("tr-TR"),
              c = CAMPS.find(x => x.on && x.code && x.code.toLocaleUpperCase("tr-TR") === v);
            if (!c) {
              toast("Geçersiz veya kapalı kupon");
              return;
            }
            if (total(o) < (c.min || 0)) {
              toast(`Bu kupon için sepet en az ${fmt(c.min)} olmalı`);
              return;
            }
            o.camp = c.id;
            act("Kupon", `${c.code} · ${oTitle(o)}`);
            toast(`Kupon uygulandı: −${fmt(campAmt(o))}`);
            payModal();
            render();
            return;
          }
          case "splitN": {
            const rem = Math.max(0, net(o) - paidSum(o));
            $("#amt").value = Math.ceil(rem / +b.dataset.n);
            return;
          }
          case "splitItems": {
            const r = total(o) ? net(o) / total(o) : 1;
            $("#splitbox").innerHTML = `<div class="paylist">${o.items
              .filter(i => i.price > 0)
              .map(
                i =>
                  `<label class="check split"><span><input type="checkbox" data-act="spIt" data-v="${Math.round(i.price * i.qty * r)}"> ${i.qty}× ${esc(iName(i))}</span><span class="num">${fmt(i.price * i.qty * r)}</span></label>`,
              )
              .join("")}</div>`;
            return;
          }
          default:
            return false;
        }
        render();
      }
      ACTIONS.push(ordersActions);
    </script>

    <!-- ============================== js/actions/customers.js ============================== -->
    <script>
      // Кнопки: клиенты, брони, акции, рассылка.

      function customersActions(a, b, o, byId, e) {
        switch (a) {
          case "custModal":
            custModal(true);
            return;
          case "newCustOnly":
            S.activeId = null;
            custModal(false);
            return;
          case "editCust":
            custModal(false, C(+b.dataset.id));
            return;
          case "addAddrRow":
            addAddrRow();
            return;
          case "rmAddr":
            b.closest(".addrrow").remove();
            return;
          case "pickCust": {
            o.custId = +b.dataset.id;
            const c = C(o.custId);
            modal("");
            toast(`${c.name} masa ${o.table}'e bağlandı · bugün ${c.visits + 1}. ziyaret`);
            break;
          }
          case "unlinkCust":
            o.custId = null;
            modal("");
            break;
          case "saveCust": {
            const name = $("#nc-name").value.trim();
            if (!name) {
              $("#nc-name").focus();
              toast("Ad soyad girin");
              return;
            }
            const phone = $("#nc-phone").value.trim(),
              addrs = [...document.querySelectorAll("#nc-addrs input")].map(x => x.value.trim()).filter(Boolean),
              note = $("#nc-note").value.trim();
            const ex = b.dataset.id ? C(+b.dataset.id) : null,
              dup = phone && byPhone(phone);
            if (dup && dup !== ex) {
              toast("Bu telefon zaten kayıtlı: " + dup.name);
              return;
            }
            const ext = { kvkk: $("#nc-kvkk").checked, iys: $("#nc-iys").checked };
            if (ex) {
              Object.assign(ex, { name, phone, addresses: addrs, note }, ext);
              modal("");
              toast("Müşteri güncellendi");
              break;
            }
            const c = Object.assign(
              { id: ++CID, name, phone, addresses: addrs, note, visits: 0, spent: 0, last: now(), hist: [] },
              ext,
            );
            CUSTOMERS.push(c);
            if (b.dataset.attach === "1" && o) {
              o.custId = c.id;
              toast(`${name} kaydedildi ve masa ${o.table}'e bağlandı`);
            } else toast(`${name} kaydedildi`);
            modal("");
            break;
          }
          case "linkCust": {
            const x = byId(),
              c = C(+b.dataset.c);
            x.custId = c.id;
            if (x.customer?.address && !c.addresses.some(ad => normA(ad) === normA(x.customer.address)))
              c.addresses.push(x.customer.address);
            toast(`${x.code || "#" + x.id} → ${c.name} (${c.visits + 1}. sipariş)`);
            break;
          }
          case "custFromOrder": {
            const x = byId(),
              cu = x.customer;
            const c = {
              id: ++CID,
              name: cu.name,
              phone: cu.phone || "",
              addresses: cu.address ? [cu.address] : [],
              note: "",
              visits: 0,
              spent: 0,
              last: now(),
              hist: [],
            };
            CUSTOMERS.push(c);
            x.custId = c.id;
            toast(`${c.name} müşteri olarak kaydedildi`);
            break;
          }
          case "loyOn":
            LOY.on = !LOY.on;
            toast(LOY.on ? "Sadakat programı açık" : "Sadakat programı kapalı");
            break;
          case "loyType": {
            LOY.type = b.dataset.t;
            if (b.dataset.p) LOY.pct = +b.dataset.p;
            toast(LOY.type === "disc" ? `Ödül: %${LOY.pct} indirim` : "Ödül: hediye ürün");
            break;
          }
          case "resModal":
            resModal();
            return;
          case "resSave": {
            const n = $("#rs-n").value.trim(),
              d = $("#rs-d").value,
              t = $("#rs-t").value,
              err = x => {
                $("#rs-err").textContent = x;
              };
            if (!n) return err("Adı yazın.");
            if (!d || !t) return err("Tarih ve saat seçin.");
            const tb = $("#rs-m").value;
            if (
              tb &&
              RESV.some(
                r =>
                  r.status === "bekliyor" &&
                  r.table === tb &&
                  r.date === d &&
                  Math.abs(+r.time.slice(0, 2) * 60 + +r.time.slice(3) - (+t.slice(0, 2) * 60 + +t.slice(3))) < 90,
              )
            )
              return err(`${tb} bu saatlerde başka rezervasyonda.`);
            RESV.push({
              id: ++RID,
              name: n,
              phone: $("#rs-p").value.trim(),
              date: d,
              time: t,
              people: Math.max(1, +$("#rs-k").value || 1),
              table: tb,
              note: $("#rs-o").value.trim(),
              status: "bekliyor",
            });
            act("Rezervasyon", `${n} · ${dShort(d)} ${t}`);
            modal("");
            toast(`Rezervasyon kaydedildi: ${dShort(d)} ${t}`);
            break;
          }
          case "resSt": {
            const r = RESV.find(x => x.id === +b.dataset.id);
            r.status = b.dataset.s;
            toast(`${r.name}: ${r.status === "iptal" ? "iptal edildi" : "gelmedi olarak işaretlendi"}`);
            break;
          }
          case "resCame": {
            const r = RESV.find(x => x.id === +b.dataset.id);
            let t = r.table;
            if (!t || (tableOrder(t) && tableOrder(t).items.length))
              t = HALLS.Salon.find(x => !tableOrder(x) || !tableOrder(x).items.length);
            if (!t) {
              toast("Boş masa yok");
              return;
            }
            r.status = "geldi";
            let c = byPhone(r.phone);
            if (!c && r.phone) {
              c = {
                id: ++CID,
                name: r.name,
                phone: r.phone,
                addresses: [],
                note: r.note || "",
                visits: 0,
                spent: 0,
                last: now(),
                hist: [],
                kvkk: false,
                iys: false,
              };
              CUSTOMERS.push(c);
            }
            let x = tableOrder(t);
            if (!x) {
              x = mk({ channel: "masa", table: t });
              S.orders.push(x);
            }
            if (c) x.custId = c.id;
            if (r.note) x.note = r.note;
            S.activeId = x.id;
            S.view = "pos";
            toast(`${r.name} geldi · Masa ${t} açıldı`);
            break;
          }
          case "campModal":
            campModal();
            return;
          case "campSave": {
            const n = $("#cp-n").value.trim(),
              v = +$("#cp-v").value || 0,
              err = x => {
                $("#cp-err").textContent = x;
              };
            if (!n) return err("Kampanya adını yazın.");
            if (v <= 0) return err("İndirim değerini yazın.");
            const tp = $("#cp-t").value;
            if (tp === "pct" && v > 90) return err("Yüzde en fazla 90 olabilir.");
            const code = $("#cp-c").value.trim().toLocaleUpperCase("tr-TR");
            if (code && CAMPS.some(c => c.code === code)) return err("Bu kupon kodu zaten var.");
            CAMPS.push({
              id: ++CMID,
              n,
              type: tp,
              val: v,
              scope: $("#cp-s").value,
              days: [...document.querySelectorAll('input[name="cpd"]:checked')].map(x => +x.value),
              from: $("#cp-f").value,
              to: $("#cp-u").value,
              code,
              min: Math.max(0, +$("#cp-m").value || 0),
              on: true,
            });
            act("Kampanya eklendi", n);
            modal("");
            toast(`${n} kaydedildi`);
            break;
          }
          case "campOn": {
            const c = CAMPS.find(x => x.id === +b.dataset.id);
            c.on = !c.on;
            toast(`${c.n}: ${c.on ? "açık" : "kapalı"}`);
            break;
          }
          case "campDel": {
            const i = CAMPS.findIndex(x => x.id === +b.dataset.id),
              c = CAMPS.splice(i, 1)[0];
            render();
            toast(`${c.n} silindi`, () => {
              CAMPS.splice(i, 0, c);
              toast("Geri getirildi");
            });
            return;
          }
          case "annSend": {
            const t = $("#ann").value.trim();
            if (!t) {
              toast("Mesajı yazın");
              return;
            }
            const n = CUSTOMERS.filter(c => c.iys && c.phone).length;
            S.ann = "";
            act("Kampanya duyurusu", `${$("#ann-ch").value} · ${n} müşteri`);
            toast(`${$("#ann-ch").value} mesajı ${n} müşteriye gönderildi (demo). İzin vermeyenlere gönderilmedi.`);
            break;
          }
          case "custDelAsk": {
            const c = C(+b.dataset.id);
            modal(
              `<h2>Müşteri silinsin mi?</h2><p style="margin:0"><b>${esc(c.name)}</b> için ad, telefon, adres ve notlar silinir (KVKK · unutulma hakkı). Geçmiş siparişler isimsiz olarak raporlarda kalır.</p><button class="btn danger solid" data-act="custDel" data-id="${c.id}">Onayla, sil</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
            );
            return;
          }
          case "custDel": {
            const c = C(+b.dataset.id);
            S.orders.forEach(x => {
              if (x.custId === c.id) {
                x.custId = null;
                if (x.customer) x.customer = { name: "Silinmiş müşteri", address: "", phone: "" };
              }
            });
            CUSTOMERS.splice(CUSTOMERS.indexOf(c), 1);
            act("Müşteri silindi (KVKK)", c.name);
            modal("");
            toast("Müşteri bilgileri silindi");
            break;
          }
          default:
            return false;
        }
        render();
      }
      ACTIONS.push(customersActions);
    </script>
