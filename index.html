<!doctype html>
<html lang="tr">
  <head>
    <!--
  НАЗУРА — программа для ресторана. Весь код в одном файле.
  Как искать: Ctrl+F (Cmd+F) и строка «=== имя файла», например «=== js/data/menu.js».

  СТИЛИ
    css/tokens.css
    css/app.css

  ОБЩИЕ ПОМОЩНИКИ — даты, деньги, иконки, состояние экрана, окна
    js/core/dates.js           Даты и время.
    js/core/format.js          Формат денег, экранирование текста, мини-помощники для HTML (поля, списки).
    js/core/icons.js           Иконки меню и кнопок (SVG).
    js/core/state.js           Состояние экрана S: какой раздел открыт, выбранный стол, фильтры, все заказы.
    js/core/ui.js              Окна (modal), уведомления (toast), звук, скачивание файлов, рисование QR.

  РАСЧЁТЫ — цены, склад, заказы, клиенты, акции, права, журнал, сохранение
    js/logic/menu.js           Блюда: цены по каналам, опции, экстра, комбо, аллергены, копирование.
    js/logic/stock.js          Склад: рецепты, себестоимость, остатки, критический уровень, списание.
    js/logic/orders.js         Заказы: создание, сумма, смена статуса, кухня, демо-заказ с платформы.
    js/logic/customers.js      Клиенты: поиск, привязка по телефону/адресу, лояльность, брони, способы оплаты.
    js/logic/campaigns.js      Акции: когда действуют и сколько скидки.
    js/logic/staff.js          Права и роли, подтверждение менеджером, смены, зарплата, журнал act().
    js/logic/audit.js          Takip: периоды (день/неделя/месяц/год), категории событий, статистика за период.
    js/logic/finance.js        Напоминания об оплате и расчёт кассы.
    js/logic/storage.js        Сохранение данных в браузере и восстановление из резервной копии.

  ДАННЫЕ — меню, ингредиенты, рецепты, клиенты, персонал, настройки (здесь меняют блюда и цены)
    js/data/menu.js            Меню: категории, блюда и цены, комбо, опции, аллергены, правило цены SET.
    js/data/stock.js           Ингредиенты и закупочные цены, рецепты, примерные остатки, поставщики.
    js/data/orders.js          Столы, каналы продаж, статусы заказов.
    js/data/customers.js       Клиенты и настройки программы лояльности.
    js/data/staff.js           Сотрудники, PIN-коды, роли и права.
    js/data/campaigns.js       Акции и купоны.
    js/data/settings.js        Устройства, принтеры, интеграции, KVKK, ссылки на платформы.
    js/data/finance.js         Расходы, напоминания об оплате, касса, примерные данные отчёта за год.
    js/data/reservations.js    Брони столов.
    js/data/demo.js            Демо-заказы и демо-история за 30 дней. В рабочей версии этот файл убирается.

  ЭКРАНЫ — что рисуется в каждом разделе
    js/views/login.js          Экран входа по PIN.
    js/views/render.js         Левое меню и отрисовка открытого раздела (render).
    js/views/home.js           Ana Sayfa: столы и все заказы.
    js/views/pos.js            Адисьон стола/телефонного заказа, оплата, окна опций, ikram, перенос.
    js/views/kitchen.js        Экран кухни.
    js/views/stock.js          Раздел Stok и его окна (приход, fire, поставщики, приёмка).
    js/views/customers.js      Клиенты, брони, акции.
    js/views/menu.js           Menü ve Fiyatlar: цены, опции, комбо, QR-меню, архив, форма блюда.
    js/views/kasa.js           Касса: открытие, движения, закрытие дня.
    js/views/staff.js          Personel: список, смены и зарплата, курьеры, история действий.
    js/views/expenses.js       Расходы, напоминания, колокольчик.
    js/views/report.js         Rapor и Analiz, окно пароля.
    js/views/platforms.js      Ссылки на панели платформ.
    js/views/settings.js       Ayarlar: вкладки настроек.
    js/views/wizard.js         Kurulum: мастер с нуля и импорт из Excel.
    js/views/courier.js        Экран курьера: свободные заказы, «взять», «в пути», «доставил» и способ оплаты.
    js/views/audit.js          Takip: статистика за период и лента всех действий, выгрузка в Excel.

  СОБЫТИЯ — клики, ввод, клавиши, запись в журнал
    js/events/audit.js         Автозапись изменений в журнал (цены, склад, меню, расходы…). Срабатывает ДО действия, чтобы записать старое и новое значение.
    js/events/click.js         Все клики: по data-act передаёт управление файлам из js/actions.
    js/events/input.js         Мгновенные обновления при вводе (поиск и т. п.).
    js/events/change.js        Сохранение при изменении полей.
    js/events/keys.js          Клавиши (Enter, Esc) и выпадающие списки.

  КНОПКИ — что делает каждая кнопка (data-act)
    js/actions/navigation.js   Кнопки: переходы, вкладки, пароль, подтверждение менеджером.
    js/actions/orders.js       Кнопки: адисьон, заказы, оплата, ikram, перенос, акции.
    js/actions/customers.js    Кнопки: клиенты, брони, акции, рассылка.
    js/actions/stock.js        Кнопки: склад, поставщики, приёмка товара.
    js/actions/menu.js         Кнопки: блюда, опции, комбо, копирование, архив.
    js/actions/finance.js      Кнопки: расходы, напоминания, касса.
    js/actions/staff.js        Кнопки: сотрудники, смены, аванс, зарплата, курьеры.
    js/actions/settings.js     Кнопки: настройки, мастер, QR, интеграции, резервная копия.
    js/actions/courier.js      Кнопки курьера.

  ЗАПУСК
    js/main.js                 Запуск: загрузка сохранённых данных, часы, статус интернета.
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nazura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
    />

    <!-- ============================== css/tokens.css ============================== -->
    <style>
      /* Renkler, yazı tipleri, açık ve koyu tema */

      /* Layout: POS shell — fixed nav rail (bottom bar on phones) + working area; adisyon = products | ticket */
      :root {
        --bg: #eef0ec;
        --surface: #ffffff;
        --surface2: #e3e7e1;
        --fg: #18201c;
        --muted: #5f6a64;
        --line: #d3d8d0;
        --accent: #0d6b58;
        --accent-fg: #ffffff;
        --accent-soft: #d6ece5;
        --ok: #2d8a3c;
        --warn: #b8720b;
        --bad: #c23b2d;
        --info: #2e5db5;
        --ch-masa: #5b6660;
        --ch-tel: #2e5db5;
        --ch-ys: #d4224b;
        --ch-getir: #5d39b5;
        --ch-ty: #e2620f;
        --ch-wa: #1e8a4c;
        --ch-mg: #e07a00;
        --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        --r: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #101412;
          --surface: #181d1a;
          --surface2: #222925;
          --fg: #e6ebe7;
          --muted: #97a29b;
          --line: #2d3530;
          --accent: #3dbd9f;
          --accent-fg: #06140f;
          --accent-soft: #16342c;
          --ok: #5cc46b;
          --warn: #e3a33c;
          --bad: #ef6b5c;
          --info: #7ba3f2;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #101412;
        --surface: #181d1a;
        --surface2: #222925;
        --fg: #e6ebe7;
        --muted: #97a29b;
        --line: #2d3530;
        --accent: #3dbd9f;
        --accent-fg: #06140f;
        --accent-soft: #16342c;
        --ok: #5cc46b;
        --warn: #e3a33c;
        --bad: #ef6b5c;
        --info: #7ba3f2;
        color-scheme: dark;
      }
    </style>

    <!-- ============================== css/app.css ============================== -->
    <style>
      /* Uygulama görünümü */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--f-body);
        margin: 0;
      }
      * {
        box-sizing: border-box;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .num {
        font-family: var(--f-mono);
        font-variant-numeric: tabular-nums;
      }
      h1,
      h2,
      h3 {
        font-family: var(--f-display);
        margin: 0;
        text-wrap: balance;
        letter-spacing: -0.01em;
      }
      .lbl {
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 600;
      }

      /* login */
      #login {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .login-card {
        width: min(360px, 100%);
        display: grid;
        gap: 18px;
        text-align: center;
      }
      .brand {
        font-family: var(--f-display);
        font-weight: 800;
        font-size: 30px;
      }
      .brand b {
        color: var(--accent);
      }
      .pin-dots {
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      .pin-dots i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--line);
      }
      .pin-dots i.on {
        background: var(--accent);
        border-color: var(--accent);
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .pad button {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        height: 62px;
        font-size: 22px;
        font-family: var(--f-mono);
      }
      .pad button:active {
        background: var(--surface2);
      }
      .hint {
        color: var(--muted);
        font-size: 13px;
      }
      .err {
        color: var(--bad);
        font-size: 13px;
        min-height: 18px;
      }

      /* shell */
      #app {
        height: 100%;
        display: grid;
        grid-template-columns: 88px 1fr;
      }
      nav.rail {
        background: var(--surface);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        padding: 12px 8px;
        gap: 4px;
      }
      .rail .logo {
        font-family: var(--f-display);
        font-weight: 800;
        text-align: center;
        font-size: 15px;
        padding: 6px 0 14px;
        line-height: 1.1;
      }
      .rail .logo b {
        color: var(--accent);
      }
      .navbtn {
        display: grid;
        justify-items: center;
        gap: 4px;
        padding: 10px 4px;
        border-radius: var(--r);
        font-size: 12px;
        color: var(--muted);
        position: relative;
      }
      .navbtn svg {
        width: 22px;
        height: 22px;
      }
      .navbtn.on {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .navbtn .badge {
        position: absolute;
        top: 4px;
        right: 12px;
        background: var(--bad);
        color: #fff;
        border-radius: 9px;
        font-size: 11px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        display: grid;
        place-items: center;
        font-weight: 600;
      }
      .rail .spacer {
        flex: 1;
      }
      main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      header.top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        flex-wrap: wrap;
      }
      header.top h1 {
        font-size: 22px;
        margin-right: auto;
      }
      .demo-tag {
        font-size: 12px;
        border: 1px dashed var(--warn);
        color: var(--warn);
        border-radius: 20px;
        padding: 2px 10px;
      }
      .who {
        font-size: 13px;
        color: var(--muted);
      }
      .content {
        flex: 1;
        overflow: auto;
        padding: 20px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: var(--r);
        background: var(--surface2);
        font-weight: 600;
        font-size: 14px;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--line);
      }
      .btn.pri {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.ghost {
        background: transparent;
        border-color: var(--line);
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn svg {
        width: 18px;
        height: 18px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .tab {
        padding: 8px 16px;
        border-radius: 20px;
        border: 1px solid var(--line);
        font-weight: 500;
        background: var(--surface);
      }
      .tab.on {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }

      /* tables */
      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
        margin-left: auto;
      }
      .legend span::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
        background: var(--c);
      }
      .floor {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        text-align: left;
        min-height: 118px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
        border-top: 5px solid var(--c, var(--line));
      }
      .tile:hover {
        border-color: var(--accent);
      }
      .tile .tn {
        font-family: var(--f-display);
        font-weight: 800;
        font-size: 24px;
      }
      .tile .st {
        font-size: 12.5px;
        color: var(--muted);
      }
      .tile .amt {
        margin-top: auto;
        font-size: 17px;
      }
      .tile .chip {
        position: absolute;
        top: 10px;
        right: 10px;
      }
      .chip {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        background: var(--surface2);
        color: var(--muted);
      }
      .chip.warn {
        background: color-mix(in srgb, var(--warn) 18%, transparent);
        color: var(--warn);
      }
      .chip.bad {
        background: color-mix(in srgb, var(--bad) 16%, transparent);
        color: var(--bad);
      }
      .chip.ok {
        background: color-mix(in srgb, var(--ok) 16%, transparent);
        color: var(--ok);
      }
      .ch {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        color: #fff;
        background: var(--c);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      /* adisyon */
      .pos {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 16px;
        height: 100%;
      }
      .cats {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
        margin-bottom: 12px;
      }
      .prods {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }
      .prod {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
        text-align: left;
        min-height: 84px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .prod:hover {
        border-color: var(--accent);
      }
      .prod .pn {
        font-weight: 600;
        line-height: 1.25;
      }
      .prod .pp {
        margin-top: auto;
        color: var(--muted);
      }
      .prod[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .prod[disabled] .pp::after {
        content: " · Tükendi";
        color: var(--bad);
        font-family: var(--f-body);
        font-weight: 600;
      }
      .ticket {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        max-height: 100%;
      }
      .ticket .th {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .ticket .th h2 {
        font-size: 22px;
        margin-right: auto;
      }
      .lines {
        flex: 1;
        overflow: auto;
        padding: 6px 0;
        min-height: 120px;
      }
      .line {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
        align-items: center;
        padding: 8px 16px;
      }
      .line .ln {
        min-width: 0;
      }
      .line .ln small {
        display: block;
        font-size: 12px;
        color: var(--muted);
      }
      .line.new .ln small {
        color: var(--warn);
        font-weight: 600;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 2px;
        background: var(--surface2);
        border-radius: 8px;
      }
      .qty button {
        width: 30px;
        height: 30px;
        font-size: 18px;
        font-weight: 600;
      }
      .qty span {
        min-width: 22px;
        text-align: center;
      }
      .empty {
        padding: 28px 16px;
        text-align: center;
        color: var(--muted);
      }
      .tfoot {
        border-top: 1px solid var(--line);
        padding: 14px 16px;
        display: grid;
        gap: 12px;
      }
      .total {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .total b {
        font-size: 26px;
        font-family: var(--f-mono);
      }
      .tfoot .acts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .tfoot .acts .wide {
        grid-column: 1/-1;
      }

      /* orders feed */
      .feed {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
        align-items: start;
      }
      .ocard {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        display: grid;
        gap: 10px;
        padding: 14px;
        border-left: 5px solid var(--c);
      }
      .ocard.fresh {
        animation: pulse 1.2s ease 2;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 35%, transparent);
        }
      }
      .ocard .oh {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .ocard .oid {
        font-family: var(--f-mono);
        font-size: 13px;
        color: var(--muted);
        margin-right: auto;
      }
      .ocard ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 3px;
        font-size: 14px;
      }
      .ocard li {

        justify-content: space-between;
        gap: 8px;

      .cust {

      .cust b {
        color: var(--fg);
        font-weight: 600;
      }
      .steps {
        display: flex;
        gap: 4px;
      }
      .steps i {
        flex: 1;
        height: 5px;
        border-radius: 3px;
        background: var(--surface2);
      }
      .steps i.on {
        background: var(--accent);

      select.sel {

        border-radius: var(--r);
        border: 1px solid var(--line);

      /* kitchen */
      .kds {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
        align-items: start;

      .kcard {

        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;

      .kcard .kh {

        align-items: center;
        gap: 8px;
        background: var(--c);
        color: #fff;
      }
      .kcard .kh h3 {
        font-size: 20px;
        margin-right: auto;
      }
      .kcard ul {
        list-style: none;
        margin: 0;
        padding: 10px 14px;
        display: grid;
        gap: 6px;
        font-size: 16px;
      }
      .kcard li b {
        font-family: var(--f-mono);
        margin-right: 8px;
      }
      .kcard .kf {
        padding: 0 14px 14px;

      .kcard .kf .btn {

      /* menu */
      .mtable {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;

      .mtable th {

        font-weight: 600;
        background: var(--surface2);
      }
      .mtable input.price {
        width: 96px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        text-align: right;
      }
      .switch {
        width: 44px;
        height: 26px;
        border-radius: 13px;
        background: var(--surface2);
        position: relative;
        border: 1px solid var(--line);
      }
      .switch::after {
        content: "";

        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;

        transition: 0.15s;
      }
      .switch.on {
        background: var(--ok);
        border-color: var(--ok);

      .switch.on::after {

        background: #fff;

      /* report */
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .kpi {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        display: grid;
        gap: 4px;

        font-size: 26px;
        font-family: var(--f-mono);
        font-weight: 500;
      }
      .panels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 14px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        display: grid;
        gap: 12px;
        align-content: start;

      .bar .tr i {

        height: 100%;

        border-radius: 6px;

      /* modal + toast */
      .scrim {

      .mtable td.r,

      .mtable .acts {
        display: flex;
        gap: 6px;

      }
      .mtable .btn {

      }
      .recipe {

        gap: 4px;

      .homebar {

      .home {

        gap: 20px;
        align-items: start;
      }
      .home .floor {
        grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));

      h2.sec {

      .tabs.sm .tab {

        border: 1px solid var(--line);

      }
      .seg {

        grid-template-columns: repeat(var(--n), 1fr);

    <!-- ============================== js/core/dates.js ============================== -->
    <script>
      // Даты и время.

      const now = () => Date.now(),
        min = m => now() - m * 60000,
        DAY = 60 * 24;

      const pad2 = n => String(n).padStart(2, "0");

      const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

      const today = () => iso(new Date());

      const parseISO = s => {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      };

      const addDays = (s, n) => {
        const d = parseISO(s);
        d.setDate(d.getDate() + n);
        return iso(d);
      };

      const addMonths = (s, n) => {
        const d = parseISO(s);
        const day = d.getDate();
        d.setDate(1);
        d.setMonth(d.getMonth() + n);
        d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
        return iso(d);
      };

      const daysUntil = s => Math.round((parseISO(s) - parseISO(today())) / 864e5);

      const dLong = s => parseISO(s).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });

      const dShort = s => parseISO(s).toLocaleDateString("tr-TR", { day: "numeric", month: "short" });

      const monthKey = s => s.slice(0, 7);

      const hm = () => {
        const d = new Date();
        return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      };

      const ago = t => {
        const m = Math.max(0, Math.round((now() - t) / 60000));
        return m < 1
          ? "şimdi"
          : m < 60
            ? m + " dk"
            : m < DAY
              ? Math.floor(m / 60) + " sa"
              : Math.floor(m / DAY) + " gün önce";
      };

      const tStr = t => new Date(t).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    </script>

    <script>
      // Окна (modal), уведомления (toast), звук, скачивание файлов, рисование QR.

      function toast(t, undo) {
        const el = $("#toast");
        S.undo = undo || null;
        el.innerHTML = esc(t) + (undo ? ' <button class="undo" data-act="undo">Geri al</button>' : "");
        el.hidden = false;
        clearTimeout(toast.t);
        toast.t = setTimeout(
          () => {
            el.hidden = true;
            S.undo = null;
          },
          undo ? 9000 : 3400,
        );
      }

      let actx;
      function beep() {
        try {
          actx = actx || new (window.AudioContext || window.webkitAudioContext)();
          const t = actx.currentTime;
          [0, 0.18].forEach(d => {
            const o = actx.createOscillator(),
              g = actx.createGain();
            o.type = "triangle";
            o.frequency.value = d ? 1175 : 880;
            o.connect(g);
            g.connect(actx.destination);
            g.gain.setValueAtTime(0.0001, t + d);
            g.gain.exponentialRampToValueAtTime(0.3, t + d + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.16);
            o.start(t + d);
            o.stop(t + d + 0.2);
          });
        } catch (e) {}
      }

      function modal(html, wide) {
        $("#modal").innerHTML = html
          ? `<div class="scrim" data-act="closeScrim"><div class="modal${wide ? " wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`
          : "";
      }

      const qrSvg = (txt, px) => {
        if (typeof qrcode !== "function") return `<div class="qrfail">QR</div>`;
        const q = qrcode(0, "M");
        q.addData(txt);
        q.make();
        const n = q.getModuleCount(),
          c = Math.max(1, Math.floor(px / (n + 8)));
        return q.createSvgTag({ cellSize: c, margin: c * 4, scalable: true });
      };

      const isOff = () => !!S.forceOff || !navigator.onLine;

      async function saveFile(name, data, mime) {
        let dl = null;
        try {
          dl = window.claude?.use ? await window.claude.use("downloads") : null;
        } catch (e) {}
        if (dl) {
          try {
            await dl.save({ filename: name, data });
            toast("Dosya kaydedildi");
          } catch (e) {
            if (e?.code !== "declined") toast("İndirme şu an kullanılamıyor");
          }
          return;
        }
        const a2 = document.createElement("a");
        a2.href = URL.createObjectURL(
          data instanceof Blob ? data : new Blob([data], { type: mime || "application/octet-stream" }),
        );
        a2.download = name;
        document.body.appendChild(a2);
        a2.click();
        a2.remove();
      }

      function imgData(file, max, cb) {
        const r = new FileReader();
        r.onload = () => {
          const im = new Image();
          im.onload = () => {
            const sc = Math.min(1, max / Math.max(im.width, im.height)),
              c = document.createElement("canvas");
            c.width = Math.round(im.width * sc);
            c.height = Math.round(im.height * sc);
            c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
            cb(c.toDataURL("image/jpeg", 0.78));
          };
          im.src = r.result;
        };
        r.readAsDataURL(file);
      }
    </script>

    <script>
      // Блюда: цены по каналам, опции, экстра, комбо, аллергены, копирование.

      const P = id => PRODUCTS.find(p => p.id === id);

      const AP = () => PRODUCTS.filter(p => !p.archived);

      const PLATS = [
        ["ty", "Trendyol Yemek", "trendyol"],
        ["mg", "Migros Yemek", "migros"],
        ["ys", "Yemeksepeti", "yemeksepeti"],
      ];

      const priceFor = (p, ch) => (APPCH.includes(ch) ? p[PK[ch]] : p.price);

      const APPK = ["app", "ty", "mg", "ys"];

      const appDiff = p => {
        const g = sugApp(sugPrice(p.id));
        return APPK.some(k => p[k] !== g);

      const ceilTo = v => Math.ceil(Math.round(v * 100) / 100 / SET.step) * SET.step;

      const sugPrice = pid => ceilTo(costOf(pid) / (SET.fc / 100));

      const sugApp = price => ceilTo(price * (1 + SET.app / 100));

      const modsFor = p => {
        if (!p) return [];
        const c = p.combo ? P(p.combo.fixed[0])?.cat : p.cat;
        return MODS.filter(g => g.cats.includes(c) && g.opts.length);
      };

      const modOpt = m => MODS.find(g => g.id === m.g)?.opts.find(o => o.n === m.n);

      const iMods = i => (i.mods || []).map(m => m.n).join(", ");

      const iName = i => {
        const p = P(i.pid);
        return (
          (p ? p.name : "Silinmiş ürün") +

      const lineKey = i => i.pid + "|" + (i.parts || []).join(",") + "|" + iMods(i) + "|" + (i.note || "");

      const comboTxt = p =>

      const comboSep = p =>
        p.combo.fixed.reduce((s, x) => s + (P(x)?.price || 0), 0) +

          return s + (o ? o.price : 0);
        }, 0);

      const palg = p => {
        const ids = p.combo ? p.combo.fixed : [p.id];
        const s = new Set();
        ids.forEach(id => (RECIPES[id] || []).forEach(([k]) => (ING[k]?.alg || []).forEach(a => s.add(a))));
        return ALGS.filter(a => s.has(a));
      };

      const pdesc = p =>
        p.desc ||
        (p.combo
          ? p.combo.fixed.map(x => P(x)?.name).join(" + ") + p.combo.pick.map(g => " + " + g.n).join("")
          : (RECIPES[p.id] || [])
              .filter(([k]) => ING[k] && !ING[k].pack)
              .slice(0, 6)
              .map(([k]) => ING[k].n)
              .join(", "));

      const pimg = p =>
        p.img ? `<img src="${p.img}" alt="">` : `<span class="ph-ph" aria-hidden="true">${CEMO[p.cat] || "🍽"}</span>`;

      function purgeProducts(ids) {
        let n = 0;
        ids.forEach(id => {
          const p = P(id);
          if (!p) return;
          const used =
            S.orders.some(o => o.items.some(i => i.pid === id || (i.parts || []).includes(id))) ||
            PRODUCTS.some(x => x.combo && x.combo.fixed.includes(id) && x.id !== id);
          if (used) {
            p.archived = true;
            p.deleted = true;
          } else {
            PRODUCTS.splice(PRODUCTS.indexOf(p), 1);
            delete RECIPES[id];

      // Ürünün reçetesindeki malzemelerden "Ekstra" seçenekleri.
      // Fiyat: o malzemenin porsiyon maliyeti ÷ hedef food cost, kurala göre yukarı yuvarlanır.
      function extrasFor(p) {
        if (!p) return [];
        const ids = p.combo ? p.combo.fixed : [p.id],
          seen = new Set(),
          out = [];
        ids.forEach(id =>
          (RECIPES[id] || []).forEach(([k, q]) => {
            const g = ING[k];

            seen.add(k);
            out.push({ k, q, n: "Ekstra " + g.n, p: ceilTo((g.cost * q) / (SET.fc / 100)) });
          }),
        );
        return out;
      }
      const hasOptions = p => !!(p && (p.combo || modsFor(p).length || extrasFor(p).length));

    <script>
      // Склад: рецепты, себестоимость, остатки, критический уровень, списание.

      const fq = (v, u) =>
        u === "g"
          ? v >= 1000
            ? (v / 1000).toLocaleString("tr-TR", { maximumFractionDigits: 2 }) + " kg"
            : Math.round(v) + " g"
          : Math.round(v * 100) / 100 + " " + u;

      const isG = k => ING[k].u === "g";

      const uPrice = k => (isG(k) ? ING[k].cost * 1000 : ING[k].cost);

      const uLbl = k => (isG(k) ? "₺/kg" : "₺/adet");

      const qLbl = k => (isG(k) ? "kg" : "adet");

      const rec = (pid, pack) => (RECIPES[pid] || []).filter(([k]) => pack || !ING[k].pack);

      function canMake(pid) {
        const p = P(pid);
        if (p && p.combo) return Math.min(...p.combo.fixed.map(canMake));
        const r = rec(pid, false);
        if (!r.length) return Infinity;
        return Math.max(0, Math.min(...r.map(([k, q]) => Math.floor(ING[k].s / q))));
      }

      function neck(pid) {
        let b = null,
          m = Infinity;
        rec(pid, false).forEach(([k, q]) => {
          const n = Math.floor(ING[k].s / q);
          if (n < m) {
            m = n;
            b = k;
          }
        });
        return b;
      }

      function costOf(pid, pack = true) {
        const p = P(pid);
        if (p && p.combo)
          return (
            p.combo.fixed.reduce((s, x) => s + (costOf(x, pack) || 0), 0) +
            p.combo.pick.reduce((s, g) => {
              const o = AP().find(x => x.cat === g.cat && !x.combo);
              return s + (o ? costOf(o.id, false) || 0 : 0);
            }, 0)
          );
        const r = RECIPES[pid];
        return r ? rec(pid, pack).reduce((s, [k, q]) => s + ING[k].cost * q, 0) : null;
      }

      const daysLeft = k => (ING[k] && ING[k].use ? ING[k].s / ING[k].use : Infinity);

      function lvl(k) {
        const g = ING[k],
          d = daysLeft(k);
        if (!g.use && !g.crit && !g.s) return "ok";
        return g.s <= 0 || d < 1 ? "acil" : d < 3 || g.s <= g.crit ? "yakin" : "ok";
      }

      const LVL = { acil: 0, yakin: 1, ok: 2 };

      const critList = () =>
        Object.keys(ING)
          .filter(k => lvl(k) !== "ok")
          .sort((a, b) => LVL[lvl(a)] - LVL[lvl(b)] || daysLeft(a) - daysLeft(b));

      const urgent = () => critList().filter(k => lvl(k) === "acil");

      const lasts = k => {
        const d = daysLeft(k);
        if (d === Infinity) return "—";
        if (ING[k].s <= 0) return "bitti";
        return d < 1 ? "~" + Math.max(1, Math.floor(d * 24)) + " saat" : "~" + Math.floor(d) + " gün";
      };

      const buyQty = k => {
        const g = ING[k];
        const q = Math.max(0, g.use * 3 + g.crit - g.s);
        return g.u === "g" ? Math.ceil(q / 100) * 100 : Math.ceil(q);
      };

      function moveStock(items, sign, reason, pack = true) {
        items.forEach(i =>
          itemRec(i, pack).forEach(([k, q]) => {
            ING[k].s = Math.max(0, ING[k].s + sign * q * i.qty);
          }),
        );
        const agg = {};
        items.forEach(i => itemRec(i, pack).forEach(([k, q]) => (agg[k] = (agg[k] || 0) + sign * q * i.qty)));
        Object.entries(agg).forEach(([k, d]) => LOG.unshift({ t: now(), k, d, why: reason }));
      }

      // bir satırın 1 adedi için stoktan düşecek malzemeler (menü parçaları + seçenekler)
      function itemRec(i, pack) {
        const p = P(i.pid);
        let r = p && p.combo ? [...p.combo.fixed, ...(i.parts || [])].flatMap(x => rec(x, pack)) : rec(i.pid, pack);
        (i.mods || []).forEach(m => {
          const o = modOpt(m) || (m.add ? m : null);
          if (!o) return;
          if (o.rm) r = r.filter(([k]) => !o.rm.includes(k));
          if (o.add) r = r.concat(o.add.filter(([k]) => ING[k]));
        });
        return r;
      }

      const supOf = k => SUPPLIERS.find(s => s.ings.includes(k));

      const poTotal = po => po.lines.reduce((s, [k, q, pr]) => s + (ING[k] ? q * (pr ?? uPrice(k)) : 0), 0);

      function receive(k) {
        const qIn = Math.max(0, +$("#bq-" + k)?.value || 0),
          pIn = Math.max(0, +$("#bp-" + k)?.value || 0);
        if (!qIn) return null;
        const qty = isG(k) ? qIn * 1000 : qIn,
          old = ING[k].cost,
          newCost = isG(k) ? pIn / 1000 : pIn;
        ING[k].s += qty;
        LOG.unshift({ t: now(), k, d: qty, why: "Tedarikçi teslimatı" });
        GIDER.push({
          id: ++GID,
          cat: "Malzeme",
          amt: Math.round(qIn * pIn),
          date: today(),
          note: `${ING[k].n} · ${qIn} ${qLbl(k)}`,
        });
        if (Math.abs(newCost - old) > 1e-9) {
          ING[k].cost = newCost;
          return { k, old };
        }
        return false;
      }
    </script>

    <script>
      // Заказы: создание, сумма, смена статуса, кухня, демо-заказ с платформы.

      function mk(o) {
        return Object.assign(
          {
            id: NEXT++,
            items: [],
            status: "acik",
            stage: null,
            createdAt: now(),
            paid: [],
            discount: 0,
            courier: "",
            customer: null,
            custId: null,
            note: "",
            by: S.user?.n || "",
          },
          o,
        );
      }

      function it(pid, qty, sent = true, ready = false, ago = 0, ch = "masa") {
        const p = P(pid),
          x = { pid, qty, sent, ready, sentAt: min(ago), price: priceFor(p, ch) };
        if (p && p.combo) x.parts = p.combo.pick.map(g => AP().find(y => y.cat === g.cat && !y.combo)?.id).filter(Boolean);
        return x;
      }

      const code = ch => (CH[ch].pre ? CH[ch].pre + "-" + (100000 + Math.floor(Math.random() * 899999)) : "");

      const online = o => o.channel !== "masa";

      function total(o) {
        return o.items.reduce((s, i) => s + (i.price ?? P(i.pid).price) * i.qty, 0);
      }

      function net(o) {
        return o.override != null ? o.override : Math.max(0, total(o) - campAmt(o)) * (1 - (o.discount || 0) / 100);
      }

      function paidSum(o) {
        return o.paid.reduce((s, p) => s + p.a, 0);
      }

      const tableOrder = t => S.orders.find(o => o.channel === "masa" && o.table === t && o.status === "acik");

      function printAd(o, auto) {
        o.prints = (o.prints || 0) + 1;
        return auto ? " · adisyon yazdırıldı" : "";
      }

      const autoPrint = o => (S.autoPrint ? printAd(o, true) : "");

      function sendItems(o, reason) {
        const ns = o.items.filter(i => !i.sent);
        ns.forEach(i => {
          i.sent = true;
          i.ready = false;
          i.sentAt = now();
        });
        moveStock(ns, -1, reason, o.channel !== "masa");
        if (ns.length)
          act("Mutfağa gönderildi", `${oTitle(o)} · ${ns.map(i => i.qty + "× " + iName(i)).join(", ")}`, "", "Sipariş");
        const rt = {};
        ns.forEach(i => {
          const d = PRINTROUTE[P(i.pid)?.cat] || "kp";
          if (d !== "none" && D(d)?.on) rt[d] = (rt[d] || 0) + i.qty;
        });
        S.lastRoute = Object.keys(rt).length
          ? " · " +
            Object.entries(rt)
              .map(([d, n]) => `${D(d).n}: ${n}`)
              .join(", ")
          : "";
      }

      const oTitle = o =>
        o.channel === "masa" ? "Masa " + o.table : o.custId ? C(o.custId).name : o.customer?.name || "Müşteri";

      function setStage(o, st) {
        const on = online(o),
          order = (on ? ON : OFF).map(s => s[0]),
          from = order.indexOf(o.stage),
          to = order.indexOf(st);
        if (on && st === "kuryede" && !o.courier) {
          toast("Önce kurye seçin");
          return false;
        }
        if (o.channel === "masa" && !o.items.some(i => i.sent)) {
          toast("Önce ürünleri mutfağa gönderin");
          return false;
        }
        o.stage = st;
        act("Sipariş durumu", `${oTitle(o)} (${o.code || "#" + o.id}) → ${STL[st]}`, "", "Sipariş");
        if (["hazir", "servis", "kuryede", "teslim"].includes(st))
          o.items.forEach(i => {
            if (i.sent) i.ready = true;
          });
        else if (to < from)
          o.items.forEach(i => {
            if (i.sent) i.ready = false;
          });
        if (st === "kuryede") o.pickedAt = now();
        if (st === "teslim") {
          o.status = "kapali";
          o.closedAt = now();
          const pm =
            o.collect ||
            (o.pay === "Online" ? "Online" : String(o.pay).toLocaleLowerCase("tr-TR").includes("kart") ? "Kart" : "Nakit");
          o.paid = [{ m: pm, a: net(o) }];
          const c = o.custId && C(o.custId);
          if (c) visit(c, CH[o.channel].n, net(o), o);
          toast(c ? `Teslim edildi · ${c.name}: ${c.visits}. sipariş` : "Teslim edildi");
          return true;
        }
        toast(`${oTitle(o)}: ${STL[st]}`);
        return true;
      }

      function kitchenQueue() {
        return S.orders
          .filter(o => o.status === "acik" && o.stage !== "yeni" && o.items.some(i => i.sent && !i.ready))
          .map(o => ({
            o,
            items: o.items.filter(i => i.sent && !i.ready),
            since: Math.min(...o.items.filter(i => i.sent && !i.ready).map(i => i.sentAt)),
          }))
          .sort((a, b) => a.since - b.since);
      }

      const closedToday = () =>
        S.orders.filter(o => o.status === "kapali" && iso(new Date(o.closedAt || o.createdAt)) === T0);

      function addLine(o, spec) {
        const p = P(spec.pid);
        const ni = it(spec.pid, 1, false, false, 0, o.channel);
        if (spec.parts) ni.parts = spec.parts;
        if (spec.note) ni.note = spec.note;
        if (spec.mods && spec.mods.length) {
          ni.mods = spec.mods;
          ni.price += spec.mods.reduce((s, m) => s + (m.p || 0), 0);
        }
        const ex = o.items.find(i => !i.sent && !i.gift && !i.ikram && lineKey(i) === lineKey(ni));
        ex ? ex.qty++ : o.items.push(ni);
        return p;
      }

      function simOrder() {
        const chs = ["yemeksepeti", "getir", "trendyol", "migros", "whatsapp"],
          ch = chs[Math.floor(Math.random() * chs.length)];
        const avail = AP().filter(p => !p.stop && canMake(p.id) > 2);
        const items = [];
        const n = 1 + Math.floor(Math.random() * 3);
        for (let i = 0; i < n; i++) {
          const p = avail[Math.floor(Math.random() * avail.length)];
          const ex = items.find(x => x.pid === p.id);
          ex ? ex.qty++ : items.push(it(p.id, 1 + Math.floor(Math.random() * 2), false, false, 0, ch));
        }
        const known = Math.random() < 0.4 ? CUSTOMERS[1 + Math.floor(Math.random() * 3)] : null;
        const short = c => {
          const [a, b] = c.name.split(" ");
          return a + (b ? " " + b[0] + "." : "");
        };
        const cust = known
          ? { name: short(known), address: known.addresses[0], phone: ch === "whatsapp" ? known.phone : "" }
          : {
              name: NAMES[Math.floor(Math.random() * NAMES.length)],
              address: STREETS[Math.floor(Math.random() * STREETS.length)],
              phone: ch === "whatsapp" ? "0541 " + (100 + Math.floor(Math.random() * 899)) + " 22 11" : "",
            };
        const no = mk({
          channel: ch,
          stage: "yeni",
          code: code(ch),
          customer: cust,
          pay: ch === "whatsapp" ? "Kapıda kart" : "Online",
          items,
        });
        S.orders.push(no);
        act("Yeni sipariş geldi", `${CH[ch].n} ${no.code} · ${fmt(total(no))}`, "", "Sipariş", CH[ch].n);
        if (S.autoAccept) {
          no.stage = "alindi";
          sendItems(no, "Satış: " + CH[ch].n + " " + no.code);
          beep();
          toast(`Yeni sipariş: ${CH[ch].n} · otomatik onaylandı` + autoPrint(no));
        } else {
          beep();
          toast("Yeni sipariş: " + CH[ch].n);
        }
        S.otab = "aktif";
        S.view = "home";
        render();
      }

      function telOrder(ph) {
        const c = byPhone(ph);
        return mk({
          channel: "telefon",
          status: "taslak",
          stage: null,
          call: ph || "",
          custId: c ? c.id : null,
          customer: { name: c ? c.name : "", address: "", phone: ph || "" },
          pay: "Kapıda nakit",
          saveAddr: true,
        });
      }
    </script>

    <script>
      // Клиенты: поиск, привязка по телефону/адресу, лояльность, брони, способы оплаты.

      const C = id => CUSTOMERS.find(c => c.id === id);

      const digits = s =>
        String(s || "")
          .replace(/\D/g, "")
          .replace(/^90/, "")
          .replace(/^0/, "");

      const normA = s =>
        String(s || "")
          .toLocaleLowerCase("tr-TR")
          .replace(/[^a-zçğıöşü0-9]/g, "");

      const byPhone = ph => {
        const d = digits(ph);
        return d.length >= 10 ? CUSTOMERS.find(c => digits(c.phone) === d) : null;
      };

      function matchCustomer(o) {
        if (o.custId || !o.customer) return null;
        return (
          byPhone(o.customer.phone) ||
          CUSTOMERS.find(c => c.addresses.some(a => normA(a) && normA(a) === normA(o.customer.address))) ||
          null
        );
      }

      const loyStamps = c => (c && c.lastStamp && now() - c.lastStamp > LOY.days * DAY * 60000 ? 0 : c?.stamps || 0);

      const loyNext = c => (loyStamps(c) % LOY.every) + 1; // bu sipariş döngüde kaçıncı

      const loyGiftDue = c => LOY.on && c && loyNext(c) === LOY.every;

      const loyCounts = o => LOY.on && (OWNCH.includes(o.channel) || LOY.apps);

      const loyLeft = c => LOY.every - (loyStamps(c) % LOY.every);

      function visit(c, where, t, o) {
        c.visits++;
        c.spent += t;
        c.last = now();
        c.hist.unshift({ at: now(), w: where, t, m: o?.paid?.map(p => p.m).join(" + ") || "" });
        if (o && loyCounts(o) && total(o) >= LOY.min) {
          c.stamps = (loyStamps(c) + 1) % LOY.every;
          c.lastStamp = now();
        }
        if (o)
          o.items
            .filter(i => i.gift)
            .forEach(i =>
              GIFTS.push({ at: now(), pid: i.pid, cost: costOf(i.pid, o.channel !== "masa") * i.qty, cust: c.name }),
            );
        if (o && o.loyDisc) GIFTS.push({ at: now(), disc: true, cost: (total(o) * (o.discount || 0)) / 100, cust: c.name });
      }

      function custRows(q) {
        q = (q || "").toLocaleLowerCase("tr-TR").replace(/\s/g, "");
        const d = q.replace(/\D/g, "").replace(/^0/, "");
        return CUSTOMERS.filter(
          c =>
            !q ||
            c.name.toLocaleLowerCase("tr-TR").replace(/\s/g, "").includes(q) ||
            (d.length >= 3 && digits(c.phone).includes(d)) ||
            c.addresses.some(a => normA(a).includes(normA(q))),
        ).sort((a, b) => b.last - a.last);
      }

      const resToday = () => RESV.filter(r => r.date === T0 && r.status === "bekliyor");

      const resFor = t =>
        resToday()
          .filter(r => r.table === t)
          .sort((a, b) => a.time.localeCompare(b.time))[0];

      // Müşterinin hangi yöntemle ödediği (nakit, kart, havale, online) — sayılarıyla.
      function payMix(c) {
        const n = {};
        (c.hist || []).forEach(h => h.m && h.m.split(" + ").forEach(m => (n[m] = (n[m] || 0) + 1)));
        const e = Object.entries(n).sort((a, b) => b[1] - a[1]);
        return e.length ? e.map(([m, k]) => `${m} ${k}`).join(" · ") : "—";
      }
    </script>

    <script>
      // Takip: периоды (день/неделя/месяц/год), категории событий, статистика за период.

      const EVCATS = ["Sipariş", "Kurye", "Personel", "Kasa ve gider", "Stok", "Menü", "Müşteri", "Ayarlar"];

      // Eski kayıtlarda kategori yoksa işlem adından tahmin edilir.
      function actCat(what) {
        const w = String(what || "").toLocaleLowerCase("tr-TR");
        if (/kurye|teslim edildi|yola çıktı/.test(w)) return "Kurye";
        if (/vardiya|personel|avans|maaş|giriş yaptı|çıkış yaptı|izinli/.test(w)) return "Personel";
        if (/kasa|gider|hatırlatıcı|ödeme yapıldı/.test(w)) return "Kasa ve gider";
        if (/stok|malzeme|mal kabul|tedarikçi|fire kaydı/.test(w)) return "Stok";
        if (/ikram|iptal|mutfağa|hesap|sipariş|ödeme|masa|indirim/.test(w)) return "Sipariş";
        if (/ürün|menü|fiyat|kategori|seçenek|satışa/.test(w)) return "Menü";
        if (/müşteri|rezervasyon|kampanya|kupon|sadakat/.test(w)) return "Müşteri";
        return "Ayarlar";
      }

      // Seçilen dönemin başlangıç ve bitiş zamanı (ms).
      function periodRange(p) {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        const end = d.getTime() + 864e5;
        if (p === "hafta") d.setDate(d.getDate() - 6);
        else if (p === "ay") d.setDate(1);
        else if (p === "yil") d.setMonth(0, 1);
        return [d.getTime(), end];
      }
      const PERN = { gun: "Bugün", hafta: "Son 7 gün", ay: "Bu ay", yil: "Bu yıl" };
      const inR = (t, [a, b]) => t >= a && t < b;

      // Dönem içindeki her şeyin özeti
      function periodStats(p) {
        const R = periodRange(p),
          cl = S.orders.filter(o => o.status === "kapali" && inR(o.closedAt || o.createdAt, R)),
          ip = S.orders.filter(o => o.status === "iptal" && inR(o.closedAt || o.createdAt, R));
        let ciro = cl.reduce((s, o) => s + net(o), 0);
        const gl = GIDER.filter(g => inR(parseISO(g.date).getTime(), R));
        let gider = gl.reduce((s, g) => s + g.amt, 0);
        // yıl görünümünde geçmiş aylar için örnek rapor verisi
        if (p === "yil")
          YEARP.forEach(x => {
            ciro += x.ciro;
            gider += x.gider;
          });
        const byCh = {},
          byPay = {},
          byP = {};
        cl.forEach(o => {
          byCh[o.channel] = (byCh[o.channel] || 0) + net(o);
          o.paid.forEach(x => (byPay[x.m] = (byPay[x.m] || 0) + x.a));
          o.items.forEach(i => (byP[i.pid] = (byP[i.pid] || 0) + i.qty));
        });
        const pk = cl.filter(o => o.channel !== "masa"),
          avgDel = pk.length ? Math.round(pk.reduce((s, o) => s + (o.closedAt - o.createdAt), 0) / pk.length / 60000) : 0;
        // personel
        const staff = STAFF.map(st => {
          const h =
            SHIFTS.filter(x => x.sid === st.id && inR(x.in, R)).reduce((s, x) => s + ((x.out || now()) - x.in), 0) / 36e5;
          return {
            st,
            h,
            days: new Set(SHIFTS.filter(x => x.sid === st.id && inR(x.in, R)).map(x => iso(new Date(x.in)))).size,
            orders: cl.filter(o => o.by === st.n).length,
            ciro: cl.filter(o => o.by === st.n).reduce((s, o) => s + net(o), 0),
            del: cl.filter(o => o.courier === st.n).length,
            ikram: IKRAM.filter(x => x.u === st.n && inR(x.t, R)).length,
          };
        });
        // stok ve menü
        const buy = gl.filter(g => g.cat === "Malzeme").reduce((s, g) => s + g.amt, 0),
          fire =
            WASTE.filter(w => inR(w.t, R)).reduce((s, w) => s + w.cost, 0) +
            LOG.filter(l => l.why && l.why.startsWith("Fire") && ING[l.k] && inR(l.t, R)).reduce(
              (s, l) => s + Math.abs(l.d) * ING[l.k].cost,
              0,
            ),
          ikram = IKRAM.filter(x => inR(x.t, R)).reduce((s, x) => s + x.cost, 0),
          priceCh = ACTLOG.filter(a => inR(a.t, R) && /fiyat/i.test(a.what)).length;
        // grafik: bugün saat, hafta/ay gün, yıl ay
        const series = [];
        if (p === "gun") {
          for (let h = 0; h < 24; h++) {
            const v = cl.filter(o => new Date(o.closedAt).getHours() === h).reduce((s, o) => s + net(o), 0);
            if (v) series.push([pad2(h), v]);
          }
        } else if (p === "yil") {
          YEARP.forEach(x => series.push([AYLAR[x.m].slice(0, 3), x.ciro]));
          series.push([
            AYLAR[new Date().getMonth()].slice(0, 3),
            S.orders
              .filter(o => o.status === "kapali" && monthKey(iso(new Date(o.closedAt))) === monthKey(T0))
              .reduce((s, o) => s + net(o), 0),
          ]);
        } else {
          for (let t = R[0]; t < R[1]; t += 864e5) {
            const k = iso(new Date(t));
            series.push([
              String(new Date(t).getDate()),
              cl.filter(o => iso(new Date(o.closedAt)) === k).reduce((s, o) => s + net(o), 0),
            ]);
          }
        }
        return { R, cl, ip, ciro, gider, byCh, byPay, byP, avgDel, staff, buy, fire, ikram, priceCh, series, pk };
      }
    </script>

    <script>

        const since = KASA.openAt || 0,
          cl = S.orders.filter(o => o.status === "kapali" && (o.closedAt || 0) >= since);

        cl.forEach(o => o.paid.forEach(p => (by[p.m] = (by[p.m] || 0) + p.a)));
        const mv = KASA.moves.filter(m => m.t >= since),

          outs = mv.filter(m => m.type === "out").reduce((s, m) => s + m.amt, 0);
        return {
          by,
          ins,
          outs,
          mv,
          exp: KASA.opening + (by.Nakit || 0) + ins - outs,
          cnt: cl.length,
          tot: Object.values(by).reduce((a, b) => a + b, 0),

          S: {

            qrBase: S.qrBase,

            autoAccept: S.autoAccept,
            orders: S.orders,
          },
          cnt: { NEXT, CID, GID, FIS, SID, CMID, RID, SPID, POID },
        };
      }

      function restore(d) {
        if (!d || d.v !== SVER) return false;
        const A = {
            PRODUCTS,
            CATS,
            CUSTOMERS,
            GIDER,
            REM,
            LOG,
            GIFTS,
            STAFF,
            SHIFTS,
            ACTLOG,
            WASTE,
            IKRAM,
            MODS,
            CAMPS,
            SUPPLIERS,
            PURCH,
            RESV,
            DEVICES,
            DEV,
            PLATFORMS,
          },
          O = { ING, RECIPES, HALLS, LOY, SET, KASA, INTEG, PRINTROUTE, KVKK };
        Object.entries(A).forEach(([k, a]) => {
          if (Array.isArray(d[k])) a.splice(0, a.length, ...d[k]);
        });
        Object.entries(O).forEach(([k, o]) => {
          if (d[k] && typeof d[k] === "object") {
            Object.keys(o).forEach(x => delete o[x]);
            Object.assign(o, d[k]);
          }
        });
        if (d.S) {
          ["rname", "qrBase", "repPass", "autoAccept"].forEach(k => {
            if (d.S[k] != null && !(k === "qrBase" && /menu\.nazura\.com\.tr/.test(d.S[k]))) S[k] = d.S[k];
          });
          if (Array.isArray(d.S.qrList)) S.qrList = d.S.qrList;
          if (Array.isArray(d.S.orders)) S.orders.splice(0, S.orders.length, ...d.S.orders);
        }
        const c = d.cnt || {};
        NEXT = c.NEXT || NEXT;
        CID = c.CID || CID;
        GID = c.GID || GID;
        FIS = c.FIS || FIS;
        SID = c.SID || SID;
        CMID = c.CMID || CMID;
        RID = c.RID || RID;
        SPID = c.SPID || SPID;
        POID = c.POID || POID;
        // eski sürümlerden kalan sabit "Ekstra" grupları artık reçeteden geliyor
        for (let i = MODS.length - 1; i >= 0; i--) if (MODS[i].id === "ekb" || MODS[i].id === "ekm") MODS.splice(i, 1);
        if (!STAFF.some(s => s.role === "satin"))
          STAFF.push({
            id: ++SID,
            n: "Kemal",
            role: "satin",
            pin: "5555",
            phone: "",
            wage: 180,
            wageType: "saatlik",
            active: true,
            adv: [],
            paid: {},
            mh: 0,
          });
        S.orders.forEach(o => S.seen.add(o.id));
        return true;
      }

      function persist() {
        if (!S.autosave) return;
        clearTimeout(persist.t);
        persist.t = setTimeout(() => {
          try {
            localStorage.setItem(SKEY, JSON.stringify(snapshot()));
            S.lastSave = now();
          } catch (e) {
            if (!persist.w) {
              persist.w = 1;
              console.warn("Kayıt yapılamadı", e);
            }
          }
        }, 400);
      }
    </script>

    <script>
      // Экран входа по PIN.

      let pin = "";

      $("#pad").innerHTML = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "✓"]
        .map(k => `<button data-k="${k}" aria-label="${k}">${k}</button>`)
        .join("");

      function drawDots() {
        [...$("#dots").children].forEach((d, i) => d.classList.toggle("on", i < pin.length));
      }

      $("#pad").addEventListener("click", e => {
        const k = e.target.dataset.k;
        if (!k) return;
        $("#pinerr").textContent = "";
        if (k === "⌫") pin = pin.slice(0, -1);
        else if (k === "✓") tryLogin();
        else if (pin.length < 4) {
          pin += k;
          if (pin.length === 4) setTimeout(tryLogin, 120);
        }
        drawDots();
      });

      function tryLogin() {
        const u = STAFF.find(s => s.active && s.pin === pin);
        if (u) {
          S.user = u;
          S.repOK = false;
          $("#login").hidden = true;
          $("#app").hidden = false;
          if (!viewOK(S.view)) S.view = RL().views === "all" ? "home" : RL().views[0];
          act("Giriş yaptı", ROLES[u.role].n);
          render();
          const r = dueRems()[0];
          if (r && u.role === "admin")
            setTimeout(() => toast(`Yaklaşan ödeme: ${r.name} · ${dueTxt(r)} · ${fmt(r.amt)}`), 500);
        } else {
          $("#pinerr").textContent = "PIN hatalı. Demo için 1234 kullanın.";
        }
        pin = "";
        drawDots();
      }

      // giriş ekranı saati
      function lgClock() {
        const d = new Date(),
          t = $("#lg-time"),
          dd = $("#lg-date");
        if (t) t.textContent = d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
        if (dd) dd.textContent = d.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
      }
    </script>
