         <div class="field"><label class="lbl" for="loy-days">Siparişler geçerli (gün)</label><input id="loy-days" class="num" type="number" min="7" value="${LOY.days}" data-act="loySet" data-k="days"></div></div>
        <label class="check"><input type="checkbox" id="loy-apps" data-act="loySet" data-k="apps" ${LOY.apps ? "checked" : ""}> Yemeksepeti, Getir, Trendyol, Migros siparişleri de sayılsın</label></section>
       <div class="row" style="margin-bottom:14px"><input class="search" id="custsearch" data-act="cq" placeholder="Ad, telefon veya adres ile ara" value="${esc(S.cq)}" aria-label="Müşteri ara"><button class="btn pri" data-act="newCustOnly" style="margin-left:auto">${IC.plus} Yeni müşteri</button></div>
       <p class="hint" style="margin:0 0 12px">Yemeksepeti, Getir ve Trendyol müşterinin telefonunu göstermez. Bu siparişler müşteriye adres ile eşleştirilir: ana sayfadaki sipariş kartında “Bağla” veya “Müşteri olarak kaydet”.</p>
       <div class="wrapx" id="custtable">${custTable(custRows(S.cq))}</div>`;
      }

      function loyDots(c) {
        const st = loyStamps(c) % LOY.every;
        return `<div class="ldots" title="${st}/${LOY.every}">${Array.from({ length: LOY.every }, (_, i) => `<i class="${i < st ? "on" : ""} ${i === LOY.every - 1 ? "g" : ""}"></i>`).join("")}</div><small class="hint">${loyGiftDue(c) ? "Sıradaki sipariş hediyeli" : `${loyLeft(c) - 1} sipariş sonra hediye`}</small>`;
      }

      function custTable(rows) {
        return rows.length
          ? `<table class="mtable"><thead><tr><th>Müşteri</th><th>Telefon</th><th>Adresler</th><th class="r">Sipariş</th><th>Sadakat</th><th class="r">Toplam</th><th>Son</th><th>Ödeme</th><th>İzin</th><th></th></tr></thead><tbody>${rows
              .map(
                c => `<tr>
       <td><b>${esc(c.name)}</b>${c.note ? `<br><span class="hint">${esc(c.note)}</span>` : ""}</td><td class="num">${esc(c.phone) || '<span class="hint">—</span>'}</td>
       <td class="hint" style="max-width:260px">${c.addresses.length ? c.addresses.map(esc).join("<br>") : "—"}</td><td class="r big">${c.visits}</td><td>${loyDots(c)}</td><td class="r num">${fmt(c.spent)}</td>
       <td class="hint">${ago(c.last)}<br>${esc(c.hist[0]?.w)}</td><td class="hint">${esc(payMix(c))}</td><td>${c.kvkk ? '<span class="chip ok">KVKK</span>' : '<span class="chip warn">Onay yok</span>'}${c.iys ? ' <span class="chip">SMS</span>' : ""}</td><td><button class="btn" data-act="editCust" data-id="${c.id}">Düzenle</button></td></tr>`,
              )
              .join("")}</tbody></table>`
          : `<div class="empty">Eşleşen müşteri yok.</div>`;
      }

      function clistHTML(q) {
        const rows = custRows(q).slice(0, 8);
        return rows.length
          ? rows
              .map(
                c =>
                  `<button class="citem" data-act="pickCust" data-id="${c.id}"><span><b>${esc(c.name)}</b><small>${esc(c.phone) || "telefon yok"}${c.note ? " · " + esc(c.note) : ""}</small></span><span class="chip">${c.visits} ziyaret</span></button>`,
              )
              .join("")
          : `<div class="hint">Bulunamadı. Aşağıdan yeni müşteri ekleyin.</div>`;
      }

      let ADDR = 0;

      function addAddrRow(v = "") {
        const box = $("#nc-addrs");
        if (!box) return;
        const i = ++ADDR;
        box.insertAdjacentHTML(
          "beforeend",
          `<div class="addrrow"><input id="nc-a${i}" value="${esc(v)}" placeholder="Mahalle, sokak, no, daire" aria-label="Adres"><button class="btn ghost" data-act="rmAddr" aria-label="Adresi sil">Sil</button></div>`,
        );
      }

      function custModal(attach = true, c = null) {
        const o = S.orders.find(x => x.id === S.activeId);
        modal(`<h2>${c ? "Müşteriyi düzenle" : attach ? "Masaya müşteri bağla" : "Yeni müşteri"}</h2>
       ${
         attach && !c
           ? `<input class="search" style="width:100%" id="cmsearch" data-act="cmq" placeholder="Ad veya telefon ile ara" aria-label="Müşteri ara">
       <div class="clist" id="cmlist">${clistHTML("")}</div><div class="lbl">veya yeni müşteri</div>`
           : ""
       }
       <div class="field"><label class="lbl" for="nc-name">Ad soyad</label><input id="nc-name" value="${esc(c?.name)}" placeholder="Örn. Samira K."></div>
       <div class="field"><label class="lbl" for="nc-phone">Telefon (isteğe bağlı)</label><input id="nc-phone" class="num" value="${esc(c?.phone)}" placeholder="05xx xxx xx xx"></div>
       <div class="field"><span class="lbl">Adresler</span><div id="nc-addrs" class="addrlist"></div>
        <button class="btn ghost" data-act="addAddrRow" style="justify-self:start">${IC.plus} Adres ekle</button></div>
       <div class="field"><label class="lbl" for="nc-note">Not</label><textarea id="nc-note" placeholder="Örn. Pencere kenarını seviyor">${esc(c?.note)}</textarea></div>
       <label class="check"><input type="checkbox" id="nc-kvkk" ${c?.kvkk ? "checked" : ""}> KVKK aydınlatma metni okundu, bilgilerin saklanmasına onay verdi</label>
       <details class="kvd"><summary>Aydınlatma metnini göster</summary><p class="hint">${esc(KVKK.text)}</p></details>
       <label class="check"><input type="checkbox" id="nc-iys" ${c?.iys ? "checked" : ""}> Kampanya SMS / WhatsApp almak istiyor (İYS izni)</label>
       <button class="btn pri" data-act="saveCust" data-attach="${attach && !c ? 1 : 0}" data-id="${c ? c.id : ""}">${c ? "Kaydet" : attach ? "Kaydet ve masaya bağla" : "Kaydet"}</button>
       ${attach && !c && o && o.custId ? `<button class="btn danger" data-act="unlinkCust">Bağlantıyı kaldır</button>` : ""}${c ? `<button class="btn danger" data-act="custDelAsk" data-id="${c.id}">Müşteriyi sil (KVKK)</button>` : ""}
       <button class="btn ghost" data-act="close">Vazgeç</button>`);
        (c && c.addresses.length ? c.addresses : [""]).forEach(a => addAddrRow(a));
        setTimeout(() => ($("#cmsearch") || $("#nc-name"))?.focus(), 30);
      }

      function resBody() {
        const fut = RESV.filter(r => r.date >= T0).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
        const gr = {};
        fut.forEach(r => (gr[r.date] = gr[r.date] || []).push(r));
        const st = { bekliyor: ["", "Bekliyor"], geldi: ["ok", "Geldi"], gelmedi: ["bad", "Gelmedi"], iptal: ["", "İptal"] };
        return `<div class="row" style="margin-bottom:12px"><p class="hint" style="margin:0;flex:1">Rezerve masa, ana sayfadaki masa listesinde saatiyle görünür. Misafir gelince “Geldi” deyin: masa açılır ve müşteri bağlanır.</p><button class="btn pri" data-act="resModal">${IC.plus} Yeni rezervasyon</button></div>
       ${
         Object.keys(gr).length
           ? Object.entries(gr)
               .map(
                 ([d, rs]) =>
                   `<h3 class="wzh" style="margin:14px 0 8px">${d === T0 ? "Bugün" : d === addDays(T0, 1) ? "Yarın" : dLong(d)} <span class="hint">${rs.filter(r => r.status === "bekliyor").length} bekleyen</span></h3><div class="resgrid">${rs
                     .map(
                       r => `<div class="resrow ${r.status !== "bekliyor" ? "dim" : ""}"><span class="rt">${r.time}</span><div style="min-width:0"><b>${esc(r.name)}</b> · ${r.people} kişi${r.table ? ` · <b>${r.table}</b>` : " · masa seçilmedi"} <span class="chip ${st[r.status][0]}">${st[r.status][1]}</span><div class="hint">${esc(r.phone)}${r.note ? " · " + esc(r.note) : ""}</div></div>
        <div class="acts">${r.status === "bekliyor" ? `${d === T0 ? `<button class="btn pri" data-act="resCame" data-id="${r.id}">Geldi</button><button class="btn ghost" data-act="resSt" data-s="gelmedi" data-id="${r.id}">Gelmedi</button>` : ""}<button class="btn ghost" data-act="resSt" data-s="iptal" data-id="${r.id}">İptal</button>` : ""}</div></div>`,
                     )
                     .join("")}</div>`,
               )
               .join("")
           : '<div class="empty">Yaklaşan rezervasyon yok.</div>'
       }`;
      }

      function resModal() {
        const tbl = [["", "Masa sonra seçilsin"], ...HALLS.Salon.map(t => [t, t])];
        modal(`<h2>Yeni rezervasyon</h2><div class="tf2">${fld("rs-n", "Ad soyad", inp("rs-n", "", 'placeholder="Örn. Ayşe Demir"'))}${fld("rs-p", "Telefon", inp("rs-p", "", 'class="num" placeholder="05xx xxx xx xx"'))}</div>
       <div class="tf2">${fld("rs-d", "Tarih", `<input id="rs-d" type="date" value="${T0}">`)}${fld("rs-t", "Saat", `<input id="rs-t" type="time" value="20:00">`)}</div>
       <div class="tf2">${fld("rs-k", "Kişi sayısı", `<input id="rs-k" class="num" type="number" min="1" value="2">`)}${fld("rs-m", "Masa", sel("rs-m", tbl, ""))}</div>
       ${fld("rs-o", "Not", inp("rs-o", "", 'placeholder="Örn. doğum günü, bebek sandalyesi"'))}
       <div class="err" id="rs-err"></div><button class="btn pri" data-act="resSave">Kaydet</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
        setTimeout(() => $("#rs-n")?.focus(), 30);
      }

      function campBody() {
        const iys = CUSTOMERS.filter(c => c.iys && c.phone).length,
          noiys = CUSTOMERS.length - iys;
        return `<div class="row" style="margin-bottom:12px"><p class="hint" style="margin:0;flex:1">Saat ve gün kampanyaları uygun siparişte adisyonda önerilir, tek dokunuşla uygulanır. Kodlu kampanya ödeme ekranında “Kupon kodu” ile girilir.</p><button class="btn pri" data-act="campModal">${IC.plus} Yeni kampanya</button></div>
       <div class="camps">${
         CAMPS.map(
           c => `<article class="dev"><div class="split"><h3>${esc(c.n)}</h3><button class="switch ${c.on ? "on" : ""}" role="switch" aria-checked="${c.on}" data-act="campOn" data-id="${c.id}" aria-label="${esc(c.n)}"></button></div>
        <div>${esc(campDesc(c))}</div><div class="row">${campNow(c) && !c.code ? '<span class="chip ok">Şu an geçerli</span>' : c.code ? '<span class="chip">Kuponla</span>' : '<span class="chip">Şu an geçerli değil</span>'}<button class="btn ghost iconbtn" data-act="campDel" data-id="${c.id}" style="margin-left:auto" aria-label="Sil">${IC.trash}</button></div></article>`,
         ).join("") || '<div class="empty">Kampanya yok.</div>'
       }</div>
       <section class="panel" style="margin-top:16px"><h3>Müşterilere duyuru (SMS / WhatsApp)</h3>
        <p class="hint" style="margin:0">Mesaj sadece kampanya iznini veren <b>${iys}</b> müşteriye gider. İzin vermeyen ${noiys} müşteriye gönderilmez (İYS kuralı).</p>
        <textarea id="ann" rows="3" placeholder="Örn. Salı Burger Günü! Bugün tüm burgerlerde %20 indirim. Nazura">${esc(S.ann || "")}</textarea>
        <div class="row">${sel("ann-ch", ["SMS", "WhatsApp"], "WhatsApp")}<button class="btn pri" data-act="annSend">Gönder (demo)</button></div></section>`;
      }

      function campModal() {
        const dd = [1, 2, 3, 4, 5, 6, 0];
        modal(
          `<h2>Yeni kampanya</h2>${fld("cp-n", "Kampanya adı", inp("cp-n", "", 'placeholder="Örn. Öğle menüsü"'))}
       <div class="tf2">${fld(
         "cp-t",
         "İndirim türü",
         sel(
           "cp-t",
           [
             ["pct", "Yüzde (%)"],
             ["amt", "Tutar (₺)"],
           ],
           "pct",
         ),
       )}${fld("cp-v", "Değer", `<input id="cp-v" class="num" type="number" min="1" value="10">`)}</div>
       <div class="tf2">${fld("cp-s", "Hangi ürünler", sel("cp-s", [["all", "Tüm menü"], ...CATS.map(([id, n]) => [id, n])], "all"))}${fld("cp-m", "En az sepet (₺)", `<input id="cp-m" class="num" type="number" min="0" value="0">`)}</div>
       <div class="field"><span class="lbl">Günler (boş = her gün)</span><div class="optl">${dd.map(d => `<label class="opt"><input type="checkbox" name="cpd" value="${d}"><span>${DAYN[d]}</span></label>`).join("")}</div></div>
       <div class="tf2">${fld("cp-f", "Başlangıç saati", `<input id="cp-f" type="time">`)}${fld("cp-u", "Bitiş saati", `<input id="cp-u" type="time">`)}</div>
       ${fld("cp-c", "Kupon kodu (isteğe bağlı)", inp("cp-c", "", 'placeholder="Örn. OGLE10" style="text-transform:uppercase"'))}
       <div class="err" id="cp-err"></div><button class="btn pri" data-act="campSave">Kaydet</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
          true,
        );
      }

      function vCust() {
        const t = S.custTab || "list",
          rt = resToday().length;
        const tabs = [
          ["list", "Müşteriler"],
          ["res", "Rezervasyon"],
          ["camp", "Kampanyalar"],
        ]
          .map(
            ([k, n]) =>
              `<button class="tab ${t === k ? "on" : ""}" data-act="custTab" data-s="${k}">${n}${k === "res" && rt ? ` <span class="num">(${rt})</span>` : ""}</button>`,
          )
          .join("");
        return `<div class="tabs">${tabs}</div>${t === "ver" ? verBody() : t === "res" ? resBody() : t === "camp" ? campBody() : custListBody()}`;
      }
    </script>

    <!-- ============================== js/views/menu.js ============================== -->
    <script>
      // Menü ve Fiyatlar: цены, опции, комбо, QR-меню, архив, форма блюда.

      function menuPrices() {
        const diff = AP().filter(p => !p.combo && (sugPrice(p.id) !== p.price || appDiff(p))).length;
        const cell = (p, k, co, lbl) =>
          `<td class="r"><input class="price num" id="p${k}-${p.id}" data-act="price" data-k="${k}" data-p="${p.id}" type="number" min="0" value="${p[k]}" aria-label="${esc(p.name)} ${lbl} fiyatı"><br><small class="kar">kâr ${fmt(p[k] - co)} · %${Math.round((1 - co / p[k]) * 100)}</small></td>`;
        return (
          `<section class="panel" style="margin-bottom:6px"><div class="split"><h3>Fiyat kuralı</h3><span class="hint">Tablodaki “Ayar” ile aynı</span></div>
        <div class="gform"><div class="field"><label class="lbl" for="set-fc">Hedef food cost (%)</label><input id="set-fc" class="num" type="number" min="5" max="90" value="${SET.fc}" data-act="set" data-k="fc"></div>
        <div class="field"><label class="lbl" for="set-app">Uygulama ek oranı (%)</label><input id="set-app" class="num" type="number" min="0" max="100" value="${SET.app}" data-act="set" data-k="app"></div>
        <div class="field"><label class="lbl" for="set-step">Yuvarlama (₺)</label><input id="set-step" class="num" type="number" min="1" value="${SET.step}" data-act="set" data-k="step"></div>
        <button class="btn ${diff ? "pri" : ""}" data-act="applyRule" style="align-self:end" ${diff ? "" : "disabled"}>${diff ? `${diff} ürünü kurala göre güncelle` : "Tüm fiyatlar kurala uygun"}</button></div>
        <div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="prodModal">${IC.plus} Ürün ekle</button></div>
        <p class="hint" style="margin:0">Salon fiyatı = maliyet ÷ hedef food cost, yukarı yuvarlanır. Uygulama fiyatı = salon fiyatı + ek oran. Her uygulamanın fiyatını ayrıca elle değiştirebilirsiniz. Kâr, platform komisyonu düşülmeden hesaplanır.</p></section>` +
          CATS.map(
            ([
              id,
              n,
            ]) => `<h3 style="font-size:18px;margin:18px 0 10px">${n}</h3><div class="wrapx"><table class="mtable menu"><thead><tr><th>Ürün</th><th class="r">Maliyet</th><th class="r">Salon (₺)</th>${PLATS.map(([k, l]) => `<th class="r">${l} (₺)</th>`).join("")}<th class="r">Yapılabilir</th><th>Satışta</th></tr></thead><tbody>
        ${AP()
          .filter(p => p.cat === id)
          .map(p => {
            const cm = canMake(p.id),
              co = costOf(p.id);
            return `<tr><td>${esc(p.name)}${p.stop ? ' <span class="chip bad">Kapalı</span>' : ""}</td>
        <td class="r num hint">${fmt2(co)}</td>${cell(p, "price", co, "salon")}${PLATS.map(([k, l]) => cell(p, k, co, l)).join("")}
        <td class="r num ${cm === 0 ? "" : "hint"}" style="${cm === 0 ? "color:var(--bad)" : ""}">${cm + " porsiyon"}</td>
        <td><div class="row" style="flex-wrap:nowrap"><button class="switch ${p.stop ? "" : "on"}" role="switch" aria-checked="${!p.stop}" aria-label="${esc(p.name)} satışta" data-act="stop" data-p="${p.id}"></button><button class="btn ghost sm" data-act="prodCopy" data-p="${p.id}" title="Kopyasını oluştur">Kopyala</button></div></td></tr>`;
          })
          .join("")}
        </tbody></table></div>`,
          ).join("")
        );
      }

      function readyModal() {
        modal(`<h2>Hazır ürün ekle</h2><p class="hint" style="margin:0">İçecek gibi hazır alınıp satılan ürünler için. Aynı anda hem malzeme (stok) hem menü ürünü oluşturulur.</p>
       <div class="field"><label class="lbl" for="rd-n">Ürün adı</label><input id="rd-n" placeholder="Örn. Coca-Cola 330 ml"></div>
       <div class="field"><label class="lbl" for="rd-cat">Kategori</label><select id="rd-cat" class="sel"><option value="">Kategori seçin</option>${CATS.map(([id, n]) => `<option value="${id}" ${/içecek/.test(n.toLocaleLowerCase("tr-TR")) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
       <div class="tf2"><div class="field"><label class="lbl" for="rd-buy">Alış fiyatı (₺/adet)</label><input id="rd-buy" class="num" type="number" min="0" data-act="rdCalc"></div>
       <div class="field"><label class="lbl" for="rd-price">Satış fiyatı (₺)</label><input id="rd-price" class="num" type="number" min="0"></div></div>
       <div class="field"><label class="lbl" for="rd-s">Mevcut stok (adet)</label><input id="rd-s" class="num" type="number" min="0" value="0"></div>
       <div class="err" id="rd-err"></div><button class="btn pri" data-act="rdSave">Ekle</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
        setTimeout(() => $("#rd-n")?.focus(), 30);
      }

      function prodModal(pid) {
        S.pfEdit = pid || null;
        S.pfImg = null;
        const ep = pid && P(pid);
        modal(
          `<h2>${ep ? "Ürünü düzenle" : "Yeni ürün"}</h2>
       <div class="field"><label class="lbl" for="pf-n">Ürün adı *</label><input id="pf-n" placeholder="Örn. Jalapeno Burger" value="${esc(ep?.name)}"></div>
       <div class="field"><label class="lbl" for="pf-cat">Kategori *</label><select id="pf-cat" class="sel" data-act="pfCat"><option value="">Kategori seçin</option>${CATS.map(([id, n]) => `<option value="${id}" ${ep && ep.cat === id ? "selected" : ""}>${esc(n)}</option>`).join("")}<option value="__new">+ Yeni kategori…</option></select>
        <input id="pf-newcat" placeholder="Yeni kategori adı" hidden></div>
       <div class="field"><span class="lbl">Reçete (1 porsiyon)</span><div id="pf-rows" class="pfrows"></div><button class="btn ghost" data-act="pfRow" style="justify-self:start">${IC.plus} Malzeme ekle</button></div>
       <div class="pfsum"><span>Maliyet: <b class="num" id="pf-cost">₺0</b></span><span>Önerilen salon fiyatı: <b class="num" id="pf-sug">—</b></span></div>
       <div class="tf2"><div class="field"><label class="lbl" for="pf-price">Salon fiyatı (₺) *</label><input id="pf-price" class="num" type="number" min="0" value="${ep ? ep.price : ""}" ${ep ? 'data-touched="1"' : ""}></div>
       <div class="field"><label class="lbl" for="pf-app">Uygulama fiyatı (₺)</label><input id="pf-app" class="num" type="number" min="0" placeholder="Boş bırakırsanız kurala göre" value="${ep ? ep.app : ""}"></div></div>
       <div class="field"><label class="lbl" for="pf-desc">QR menü açıklaması (isteğe bağlı)</label><textarea id="pf-desc" rows="2" placeholder="Boş bırakırsanız malzemelerden yazılır">${esc(ep?.desc || "")}</textarea></div>
       <div class="field"><span class="lbl">Fotoğraf (QR menü)</span><div class="pfimg"><span id="pf-imgpv">${ep && ep.img ? `<img src="${ep.img}" alt="">` : ""}</span><label class="filebtn" for="pf-img">${IC.clip}<span>Fotoğraf seç</span></label><input id="pf-img" type="file" accept="image/*" data-act="pfImg" hidden></div></div>
       <div class="hint" id="pf-alg"></div>
       <div class="err" id="pf-err"></div>
       <button class="btn pri" data-act="pfSave">${ep ? "Kaydet" : "Ürünü ekle"}</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
          true,
        );
        if (ep && RECIPES[pid] && RECIPES[pid].length) {
          RECIPES[pid].forEach(([k, q]) => {
            pfAddRow();
            const r = [...document.querySelectorAll("#pf-rows .pfrow")].pop();
            const pi = r.querySelector(".pfing");
            pi.value = ING[k]?.n || "";
            pi.dataset.k = k;
            r.querySelector(".pfq").value = q;
          });
        } else pfAddRow();
        pfCalc();
      }

      function pfAddRow() {
        const box = $("#pf-rows");
        if (!box) return;
        box.insertAdjacentHTML(
          "beforeend",
          `<div class="pfrow"><div class="pfpick"><input class="pfing" data-act="pfIng" data-k="" placeholder="Malzeme ara (örn. köfte)" autocomplete="off" aria-label="Malzeme ara"><div class="pfdd" hidden></div></div><span class="inunit"><input class="price num pfq" type="number" min="0" step="1" data-act="pfCalc" placeholder="0" aria-label="Miktar"><small class="pfu">—</small></span><button class="btn ghost iconbtn" data-act="pfDel" aria-label="Satırı sil">${IC.trash}</button></div>`,
        );
      }

      // malzeme arama listesi
      function pfList(inp) {
        const q = inp.value.toLocaleLowerCase("tr-TR").trim(),
          dd = inp.nextElementSibling,
          used = [...document.querySelectorAll(".pfing")].filter(x => x !== inp).map(x => x.dataset.k);
        const ks = Object.keys(ING)
          .filter(k => !q || ING[k].n.toLocaleLowerCase("tr-TR").includes(q))
          .sort((a, b) => {
            const A = ING[a].n.toLocaleLowerCase("tr-TR").startsWith(q),
              B = ING[b].n.toLocaleLowerCase("tr-TR").startsWith(q);
            return B - A || ING[a].n.localeCompare(ING[b].n, "tr");
          })
          .slice(0, 40);
        dd.innerHTML = ks.length
          ? ks
              .map(
                k =>
                  `<button type="button" class="pfopt ${used.includes(k) ? "used" : ""}" data-act="pfPick" data-k="${k}"><span>${esc(ING[k].n)}</span><small>${esc(ING[k].c)} · ${fmt(uPrice(k))}${uLbl(k).replace("₺", "")}${used.includes(k) ? " · reçetede var" : ""}</small></button>`,
              )
              .join("")
          : `<div class="hint" style="padding:8px 10px">“${esc(inp.value)}” bulunamadı. Önce Stok'a malzeme olarak ekleyin.</div>`;
        dd.hidden = false;
      }

      function pfRead() {
        return [...document.querySelectorAll("#pf-rows .pfrow")]
          .map(r => [r.querySelector(".pfing").dataset.k, +r.querySelector(".pfq").value || 0])
          .filter(([k, q]) => k && q > 0);
      }

      function pfCalc() {
        document.querySelectorAll("#pf-rows .pfrow").forEach(r => {
          const k = r.querySelector(".pfing").dataset.k;
          r.querySelector(".pfu").textContent = k ? (isG(k) ? "g" : "adet") : "—";
        });
        const c = pfRead().reduce((s, [k, q]) => s + ING[k].cost * q, 0);
        $("#pf-cost").textContent = fmt2(c);
        $("#pf-sug").textContent = c ? fmt(ceilTo(c / (SET.fc / 100))) : "—";
        const pr = $("#pf-price");
        if (c && !pr.dataset.touched) pr.value = ceilTo(c / (SET.fc / 100));
        const al = new Set();
        pfRead().forEach(([k]) => (ING[k]?.alg || []).forEach(a => al.add(a)));
        const pa = $("#pf-alg");
        if (pa) pa.textContent = al.size ? "Alerjenler (reçeteden otomatik): " + ALGS.filter(a => al.has(a)).join(", ") : "";
      }

      const effTxt = o =>
        o.add && o.add.length
          ? "Ekler: " + o.add.map(([k, q]) => (ING[k] ? fq(q, ING[k].u) + " " + ING[k].n : "?")).join(", ")
          : o.rm && o.rm.length
            ? "Çıkarır: " +
              o.rm
                .map(k => ING[k]?.n)
                .filter(Boolean)
                .join(", ")
            : "—";

      function modsBody() {
        const ks = Object.keys(ING).sort((a, b) => ING[a].n.localeCompare(ING[b].n, "tr"));
        return (
          `<p class="hint" style="margin:0 0 12px">Seçenekli ürün adisyona eklenirken seçenekler sorulur (soğansız, pişirme). “Ekstra” seçenekleri her ürünün kendi reçetesinden otomatik gelir; fiyatı malzeme maliyetine göre hesaplanır. Ek fiyat ürüne eklenir, mutfak ekranında ve adisyonda yazar; “Ekler / Çıkarır” stoktan doğru malzemeyi düşer.</p>` +
          MODS.map(
            g => `<section class="panel modg"><div class="row"><input class="wzin mgname" value="${esc(g.n)}" data-act="modName" data-g="${g.id}" aria-label="Grup adı"><div class="seg2" role="group"><button class="${g.multi ? "" : "on"}" data-act="modMulti" data-g="${g.id}" data-v="0">Tek seçim</button><button class="${g.multi ? "on" : ""}" data-act="modMulti" data-g="${g.id}" data-v="1">Çoklu seçim</button></div><button class="btn ghost iconbtn" data-act="modDel" data-g="${g.id}" style="margin-left:auto" aria-label="Grubu sil">${IC.trash}</button></div>
        <div class="row"><span class="lbl">Kategoriler</span>${CATS.filter(c => c[0] !== "menuler")
          .map(
            ([id, n]) =>
              `<button class="chipbtn ${g.cats.includes(id) ? "on" : ""}" data-act="modCat" data-g="${g.id}" data-c="${id}">${esc(n)}</button>`,
          )
          .join("")}</div>
        <div class="wrapx"><table class="mtable sm"><thead><tr><th>Seçenek</th><th class="r">Ek fiyat</th><th>Stok etkisi</th><th></th></tr></thead><tbody>${g.opts.map((o, oi) => `<tr><td><input class="wzin" value="${esc(o.n)}" data-act="modOpt" data-g="${g.id}" data-o="${oi}" data-f="n" aria-label="Seçenek adı"></td><td class="r"><span class="inunit"><input class="price num" type="number" min="0" value="${o.p || 0}" data-act="modOpt" data-g="${g.id}" data-o="${oi}" data-f="p" aria-label="Ek fiyat"><small>₺</small></span></td><td class="hint">${esc(effTxt(o))}</td><td><button class="btn ghost iconbtn" data-act="modOptDel" data-g="${g.id}" data-o="${oi}" aria-label="Sil">${IC.trash}</button></td></tr>`).join("")}</tbody></table></div>
        <div class="wzadd modadd"><input id="mo-n-${g.id}" placeholder="Yeni seçenek (örn. Jalapeno)" aria-label="Yeni seçenek"><input id="mo-p-${g.id}" class="num" type="number" min="0" placeholder="₺" aria-label="Ek fiyat">${sel(
          "mo-e-" + g.id,
          [
            ["", "Stok etkisi yok"],
            ["add", "Malzeme ekler"],
            ["rm", "Malzeme çıkarır"],
          ],
          "",
          'aria-label="Stok etkisi"',
        )}${sel(
          "mo-k-" + g.id,
          ks.map(k => [k, ING[k].n]),
          "",
          'aria-label="Malzeme"',
        )}<input id="mo-q-${g.id}" class="num" type="number" min="0" placeholder="Miktar" aria-label="Miktar (g veya adet)"><button class="btn pri" data-act="modOptAdd" data-g="${g.id}">${IC.plus} Ekle</button></div></section>`,
          ).join("") +
          `<section class="panel"><h3>Yeni seçenek grubu</h3><div class="row"><input id="mg-new" class="search" placeholder="Örn. Sos seçimi" aria-label="Grup adı"><button class="btn pri" data-act="modAdd">${IC.plus} Grup ekle</button></div></section>`
        );
      }

      function comboBody() {
        const cs = AP().filter(p => p.combo);
        return `<div class="row" style="margin-bottom:12px"><p class="hint" style="margin:0;flex:1">Menü (kombo): birkaç ürün tek fiyata. Seçmeli kısım (örn. içecek) siparişte sorulur; stok her parçadan ayrı düşer, mutfak parçaları ayrı görür.</p><button class="btn pri" data-act="comboModal">${IC.plus} Menü ekle</button></div>
       ${
         cs.length
           ? `<div class="wrapx"><table class="mtable"><thead><tr><th>Menü</th><th>İçindekiler</th><th class="r">Ayrı ayrı</th><th class="r">Menü fiyatı</th><th class="r">Maliyet</th><th class="r">Kâr</th><th></th></tr></thead><tbody>${cs
               .map(p => {
                 const sep = comboSep(p),
                   co = costOf(p.id);
                 return `<tr><td><b>${esc(p.name)}</b>${p.stop ? ' <span class="chip bad">Kapalı</span>' : ""}</td><td>${comboTxt(p)}</td><td class="r num hint">${fmt(sep)}</td><td class="r num"><b>${fmt(p.price)}</b><br><small class="kar">müşteri ${fmt(sep - p.price)} kazanır</small></td><td class="r num">${fmt2(co)}</td><td class="r num">${fmt(p.price - co)} <small class="hint">%${p.price ? Math.round((1 - co / p.price) * 100) : 0}</small></td><td><div class="acts"><button class="btn ghost" data-act="prodCopy" data-p="${p.id}">Kopyala</button><button class="btn ghost" data-act="comboModal" data-p="${p.id}">Düzenle</button><button class="btn ghost iconbtn" data-act="prodDelAsk" data-p="${p.id}" aria-label="Sil">${IC.trash}</button></div></td></tr>`;
               })
               .join("")}</tbody></table></div>`
           : '<div class="empty">Henüz menü yok.</div>'
       }`;
      }

      function comboModal(pid) {
        const ep = pid ? P(pid) : null,
          ps = AP()
            .filter(p => !p.combo)
            .sort((a, b) => a.name.localeCompare(b.name, "tr")),
          po = [["", "—"], ...ps.map(p => [p.id, p.name + " · " + fmt(p.price)])];
        modal(
          `<h2>${ep ? "Menüyü düzenle" : "Yeni menü (kombo)"}</h2>${fld("cb-n", "Menü adı", inp("cb-n", ep?.name, 'placeholder="Örn. Nazura Menü"'))}
       <div class="field"><span class="lbl">Sabit ürünler</span>${[0, 1, 2].map(i => sel("cb-f" + i, po, ep?.combo.fixed[i] || "", 'data-act="cbCalc"')).join("")}</div>
       <div class="tf2">${fld("cb-pc", "Seçmeli kısım", sel("cb-pc", [["", "Yok"], ...CATS.filter(c => c[0] !== "menuler").map(([id, n]) => [id, n + " kategorisinden"])], ep ? ep.combo.pick[0]?.cat || "" : "icecek", 'data-act="cbCalc"'))}${fld("cb-pn", "Seçim adı", inp("cb-pn", ep?.combo.pick[0]?.n || "İçecek"))}</div>
       <div class="pfsum"><span>Ayrı ayrı: <b class="num" id="cb-sep">—</b></span><span>Öneri (%10 indirim): <b class="num" id="cb-sug">—</b></span></div>
       <div class="tf2">${fld("cb-p", "Menü fiyatı (₺)", `<input id="cb-p" class="num" type="number" min="0" value="${ep ? ep.price : ""}">`)}${fld("cb-a", "Uygulama fiyatı (₺)", `<input id="cb-a" class="num" type="number" min="0" value="${ep ? ep.app : ""}" placeholder="Boş: kurala göre">`)}</div>
       <div class="err" id="cb-err"></div><button class="btn pri" data-act="comboSave" data-p="${pid || ""}">Kaydet</button><button class="btn ghost" data-act="close">Vazgeç</button>`,
          true,
        );
        cbCalc();
      }

      function cbCalc() {
        const f = [0, 1, 2].map(i => $("#cb-f" + i)?.value).filter(Boolean),
          pc = $("#cb-pc")?.value;
        const o = pc ? AP().find(x => x.cat === pc && !x.combo) : null;
        const sep = f.reduce((s, x) => s + (P(x)?.price || 0), 0) + (o ? o.price : 0);
        if (!$("#cb-sep")) return;
        $("#cb-sep").textContent = sep ? fmt(sep) : "—";
        $("#cb-sug").textContent = sep ? fmt(ceilTo(sep * 0.9)) : "—";
        const pr = $("#cb-p");
        if (sep && !pr.dataset.touched) pr.value = ceilTo(sep * 0.9);
      }

      function qrPhone() {
        const cs = CATS.filter(([id]) => AP().some(p => p.cat === id));
        return `<div class="phone" aria-label="QR menü önizleme"><div class="ph-top"><b>${esc(S.rname)}</b><span>Menü</span></div><div class="ph-cats">${cs.map(([, n]) => `<span>${esc(n)}</span>`).join("")}</div>
        <div class="ph-body">${cs
          .map(
            ([id, n]) =>
              `<h4>${esc(n)}</h4>${AP()
                .filter(p => p.cat === id)
                .map(p => {
                  const al = palg(p);
                  return `<div class="ph-item ${p.stop ? "off" : ""}">${pimg(p)}<div class="ph-tx"><b>${esc(p.name)}</b><small>${esc(pdesc(p))}</small>${al.length ? `<span class="algs">${al.map(a => `<i>${a}</i>`).join("")}</span>` : ""}</div><span class="num">${p.stop ? "Tükendi" : fmt(p.price)}</span></div>`;
                })
                .join("")}`,
          )
          .join("")}</div></div>`;
      }

      function qrMenuBody() {
        return `<div class="qrmenu-wrap">${qrPhone()}
       <section class="panel"><h3>Misafirin gördüğü menü</h3><p class="hint" style="margin:0">QR kod okutulunca bu sayfa açılır. Salon fiyatı gösterilir. Satışı kapatılan ürün “Tükendi” olur. Alerjenler reçetedeki malzemelerden otomatik çıkar. Fotoğraf ve açıklamayı aşağıdan ekleyin.</p>
        <div class="wrapx"><table class="mtable sm"><thead><tr><th></th><th>Ürün</th><th>Açıklama</th><th>Alerjen</th><th></th></tr></thead><tbody>${AP()
          .map(
            p =>
              `<tr><td class="thumb">${pimg(p)}</td><td><b>${esc(p.name)}</b><br><small class="hint">${esc(catName(p.cat))}</small></td><td class="hint">${p.desc ? esc(p.desc) : "<i>otomatik: " + esc(pdesc(p)) + "</i>"}</td><td class="hint">${palg(p).join(", ") || "—"}</td><td><button class="btn ghost" data-act="${p.combo ? "comboModal" : "prodEdit"}" data-p="${p.id}">Fotoğraf / açıklama</button></td></tr>`,
          )
          .join("")}</tbody></table></div></section></div>`;
      }

      function archBody() {
        const ar = PRODUCTS.filter(p => p.archived && !p.deleted);
        return `<p class="hint" style="margin:0 0 12px">Arşivdeki ürünler menüde, adisyonda ve QR menüde görünmez; geçmiş siparişlerde ve raporlarda kalır. İstediğiniz zaman geri alabilirsiniz.</p>
       ${ar.length ? `<div class="wrapx"><table class="mtable"><thead><tr><th>Ürün</th><th>Kategori</th><th class="r">Salon fiyatı</th><th></th></tr></thead><tbody>${ar.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${esc(CATS.some(c => c[0] === p.cat) ? catName(p.cat) : (p.catName || "—") + " (silinmiş)")}</td><td class="r num">${fmt(p.price)}</td><td><div class="acts"><button class="btn pri" data-act="unarch" data-p="${p.id}">Geri al</button><button class="btn ghost danger" data-act="pDelFullAsk" data-p="${p.id}">Tamamen sil</button></div></td></tr>`).join("")}</tbody></table></div>` : '<div class="empty">Arşiv boş.</div>'}`;
      }

      function vMenu() {
        const t = S.menuTab || "fiyat",
          na = PRODUCTS.filter(p => p.archived && !p.deleted).length;
        const tabs = [
          ["fiyat", "Fiyatlar"],
          ["mods", "Seçenekler"],
          ["combo", "Menüler (kombo)"],
          ["qr", "QR menü"],
          ["arsiv", "Arşiv"],
        ]
          .map(
            ([k, n]) =>
              `<button class="tab ${t === k ? "on" : ""}" data-act="menuTab" data-s="${k}">${n}${k === "arsiv" && na ? ` <span class="num">(${na})</span>` : ""}</button>`,
          )
          .join("");
        return `<div class="tabs">${tabs}</div>${t === "mods" ? modsBody() : t === "combo" ? comboBody() : t === "qr" ? qrMenuBody() : t === "arsiv" ? archBody() : menuPrices()}`;
      }
    </script>

    <!-- ============================== js/views/kasa.js ============================== -->
    <script>
      // Касса: открытие, движения, закрытие дня.

      function zModal() {
        const closed = closedToday();
        const byPay = {};
        closed.forEach(o => o.paid.forEach(p => (byPay[p.m] = (byPay[p.m] || 0) + p.a)));
        const rev = closed.reduce((s, o) => s + net(o), 0);
        modal(`<h2>Gün sonu raporu</h2><div class="hint">${dLong(T0)}</div>
       <div class="paylist">${Object.entries(byPay)
         .map(([k, v]) => `<div class="split"><span>${k}</span><span class="num">${fmt(v)}</span></div>`)
         .join("")}</div>
       <div class="split" style="border-top:1px solid var(--line);padding-top:10px"><b>Toplam</b><b class="num">${fmt(rev)}</b></div>
       <div class="hint">${closed.length} sipariş · iptal ${S.orders.filter(o => o.status === "iptal").length}${D("okc").on ? " · ÖKC'den Z raporu alınacak" : ""}</div><button class="btn ghost" data-act="close">Kapat</button>`);
      }

      function kasaHist() {
        return KASA.hist.length
          ? `<section class="panel" style="margin-top:14px"><h3>Önceki günler</h3><div class="wrapx"><table class="mtable sm"><thead><tr><th>Tarih</th><th class="r">Açılış</th><th class="r">Nakit</th><th class="r">Kart</th><th class="r">Online</th><th class="r">Kasada olmalı</th><th class="r">Sayılan</th><th class="r">Fark</th><th>Kapatan</th></tr></thead><tbody>${KASA.hist.map(h => `<tr><td>${dShort(h.date)}</td><td class="r num">${fmt(h.opening)}</td><td class="r num">${fmt(h.cash)}</td><td class="r num">${fmt(h.card)}</td><td class="r num">${fmt(h.online)}</td><td class="r num">${fmt(h.exp)}</td><td class="r num">${fmt(h.counted)}</td><td class="r num" style="color:${h.diff < 0 ? "var(--bad)" : h.diff > 0 ? "var(--warn)" : "var(--ok)"};font-weight:600">${h.diff ? (h.diff > 0 ? "+" : "") + fmt(h.diff) : "Tam"}</td><td>${esc(h.u)}</td></tr>`).join("")}</tbody></table></div></section>`
          : "";
      }

      function vKasa() {
        if (!KASA.open)
          return `<section class="panel"><h3>Kasa kapalı</h3><p class="hint" style="margin:0">Güne başlarken kasadaki nakit parayı sayın ve yazın.${KASA.hist[0] ? ` Son kapanışta sayılan: <b>${fmt(KASA.hist[0].counted)}</b>.` : ""}</p>
        <div class="row"><input id="k-open" class="num search" style="width:170px" type="number" min="0" value="${KASA.hist[0]?.counted ?? 1500}" aria-label="Açılış nakdi"><button class="btn pri" data-act="kasaOpen">Kasayı aç</button></div></section>${kasaHist()}`;
        const k = kasaCalc(),
          pm = ["Nakit", "Kart", "Havale", "Online"];
        return `<section class="panel"><div class="split"><h3>Kasa açık</h3><span class="hint">${tStr(KASA.openAt)} · ${esc(KASA.by)} açtı</span></div>
        <div class="wzsum"><div><span class="lbl">Açılış</span><b class="num">${fmt(KASA.opening)}</b></div><div><span class="lbl">Nakit satış</span><b class="num">+${fmt(k.by.Nakit || 0)}</b></div><div><span class="lbl">Kasaya giriş</span><b class="num">+${fmt(k.ins)}</b></div><div><span class="lbl">Kasadan çıkış</span><b class="num">−${fmt(k.outs)}</b></div><div class="kexp"><span class="lbl">Kasada olmalı</span><b class="num">${fmt(k.exp)}</b></div></div>
        <div class="row"><button class="btn" data-act="kasaMove" data-t="out">− Para çıkışı</button><button class="btn" data-act="kasaMove" data-t="in">+ Para girişi</button><button class="btn" data-act="z">Gün sonu (Z) raporu</button><button class="btn pri" data-act="kasaClose" style="margin-left:auto">Gün sonu: kasayı say ve kapat</button></div></section>
       <div class="panels" style="margin-top:14px"><section class="panel"><h3>Ödemeler (kasa açıldığından beri)</h3>${pm.map(m => `<div class="split"><span>${m}</span><span class="num">${fmt(k.by[m] || 0)}</span></div>`).join("")}
        <div class="split" style="border-top:1px solid var(--line);padding-top:8px"><b>Toplam ciro · ${k.cnt} sipariş</b><b class="num">${fmt(k.tot)}</b></div><p class="hint" style="margin:0">Kasaya sadece nakit girer. Kart ÖKC/POS'tan bankaya, online ödeme platformdan hesaba gelir.</p></section>
        <section class="panel"><h3>Kasa hareketleri</h3>${
          k.mv.length
            ? `<div class="wrapx"><table class="mtable sm"><thead><tr><th>Saat</th><th>Açıklama</th><th>Kim</th><th class="r">Tutar</th></tr></thead><tbody>${k.mv
                .slice()
                .sort((a, b) => b.t - a.t)
                .map(
                  m =>
                    `<tr><td class="num">${tStr(m.t)}</td><td>${esc(m.why)}${m.note ? `<br><small class="hint">${esc(m.note)}</small>` : ""}</td><td>${esc(m.u)}</td><td class="r num" style="color:${m.type === "out" ? "var(--bad)" : "var(--ok)"}">${m.type === "out" ? "−" : "+"}${fmt(m.amt)}</td></tr>`,
                )
                .join("")}</tbody></table></div>`
            : '<div class="hint">Henüz hareket yok.</div>'
        }</section></div>${kasaHist()}`;
      }

      function kasaMoveModal(t) {
        const out = t === "out";
        modal(`<h2>${out ? "Kasadan para çıkışı" : "Kasaya para girişi"}</h2>
       <div class="tf2">${fld("km-a", "Tutar (₺)", `<input id="km-a" class="num" type="number" min="0">`)}${fld("km-w", "Neden", sel("km-w", out ? ["Malzeme / ekmek alımı", "Kurye benzin", "Personel avansı", "Bahşiş dağıtımı", "Bankaya yatırıldı", "Diğer"] : ["Bozuk para eklendi", "Bankadan çekildi", "Diğer"], ""))}</div>
       ${fld("km-n", "Not", `<input id="km-n" placeholder="Örn. Has Fırın, 40 ekmek">`)}
       ${out ? `<label class="check"><input type="checkbox" id="km-g" checked> Giderlere de ekle</label>${fld("km-c", "Gider kategorisi", sel("km-c", GCATS, "Malzeme"))}` : ""}
       <button class="btn pri" data-act="kasaMoveDo" data-t="${t}">Kaydet</button><button class="btn ghost" data-act="close">Vazgeç</button>`);
        setTimeout(() => $("#km-a")?.focus(), 30);
      }

      function kasaCloseModal() {
        const k = kasaCalc();

        } else if (t === "vardiya") {

                )

            : '<div class="empty">Henüz işlem yok.</div>';
        return `<div class="tabs">${tabs}</div>${b}`;
      }

    <script>
      // Расходы, напоминания, колокольчик.

      function vGider() {
        const mkey = monthKey(T0),
          list = GIDER.filter(g => monthKey(g.date) === mkey).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
        const tot = list.reduce((s, g) => s + g.amt, 0),
          byC = {};
        list.forEach(g => (byC[g.cat] = (byC[g.cat] || 0) + g.amt));

        <div class="gform"><div class="field"><label class="lbl" for="g-amt">Tutar (₺)</label><input id="g-amt" class="num" type="number" min="0" placeholder="0"></div>
        <div class="field"><label class="lbl" for="g-cat">Kategori</label><select id="g-cat" class="sel">${GCATS.map(c => `<option>${c}</option>`).join("")}</select></div>

        <section class="panel"><div class="split"><h3>${parseISO(T0).toLocaleDateString("tr-TR", { month: "long", year: "numeric" })} giderleri</h3><b class="num" style="font-size:20px">${fmt(tot)}</b></div>

           .sort((a, b) => b[1] - a[1])

           )

       <div class="wrapx"><table class="mtable"><thead><tr><th>Tarih</th><th>Kategori</th><th>Not</th><th>Fiş</th><th class="r">Tutar</th><th></th></tr></thead><tbody>${list.map(g => `<tr><td class="num">${dShort(g.date)}</td><td><span class="chip">${g.cat}</span></td><td class="hint">${esc(g.note)}</td><td>${g.file ? `<button class="fisbtn" data-act="viewFis" data-id="${g.id}" title="${esc(g.file.name)}">${g.file.img ? `<img src="${g.file.url}" alt="Fiş">` : IC.clip}<span>Fişi gör</span></button>` : `<label class="filebtn sm" for="gf-${g.id}">${IC.clip}<span>Ekle</span></label><input id="gf-${g.id}" type="file" accept="image/*,application/pdf" data-act="gfile" data-id="${g.id}" hidden>`}</td><td class="r num">${fmt(g.amt)}</td><td class="r"><button class="btn ghost" data-act="delGider" data-id="${g.id}">Sil</button></td></tr>`).join("")}</tbody></table></div>`;

        modal(`<h2>Ödeme hatırlatıcısı</h2>

       ${u.length ? `<div class="rem hot"><div style="min-width:0"><span class="lbl">Stok</span><b style="display:block">${u.length} malzeme acil sipariş bekliyor</b><div class="hint">${u.map(k => `${ING[k].n} (${lasts(k)})`).join(" · ")}</div></div><div></div><div class="acts"><button class="btn pri" data-act="nav" data-v="stock" data-st="satin">Satın alma listesi</button></div></div>` : ""}

    <script>
      // Rapor и Analiz, окно пароля.

      function vReport() {
        const closed = closedToday();
        const todayCiro = closed.reduce((s, o) => s + net(o), 0);
        const gl = S.rtab === "gun" ? GIDER.filter(g => g.date === T0) : GIDER.filter(g => monthKey(g.date) === monthKey(T0));
        const gTot = gl.reduce((s, g) => s + g.amt, 0),
          byG = {};
        gl.forEach(g => (byG[g.cat] = (byG[g.cat] || 0) + g.amt));
        const days = [];
        for (let d = 1; d <= parseISO(T0).getDate(); d++) {
          const k = M0 + pad2(d);
          days.push({
            date: k,
            ciro: S.orders
              .filter(o => o.status === "kapali" && iso(new Date(o.closedAt)) === k)
              .reduce((s, o) => s + net(o), 0),
          });
        }
        const monthCiro = days.reduce((s, d) => s + d.ciro, 0);
        const MG = {};
        GIDER.filter(g => monthKey(g.date) === monthKey(T0)).forEach(g => (MG[g.cat] = (MG[g.cat] || 0) + g.amt));
        const months = [
          ...YEARP,
          {
            m: parseISO(T0).getMonth(),
            ciro: monthCiro,
            byCat: MG,
            gider: Object.values(MG).reduce((a, b) => a + b, 0),
            cur: true,
          },
        ];
        if (S.rtab === "yil") {
          Object.keys(byG).forEach(k => delete byG[k]);
          months.forEach(x => Object.entries(x.byCat).forEach(([k, v]) => (byG[k] = (byG[k] || 0) + v)));
        }
        const ciro = S.rtab === "gun" ? todayCiro : S.rtab === "ay" ? monthCiro : months.reduce((s, x) => s + x.ciro, 0);
        const gTot2 = S.rtab === "yil" ? months.reduce((s, x) => s + x.gider, 0) : gTot;
        const nk = ciro - gTot2,
          cnt = closed.length,
          margin = ciro ? Math.round((nk / ciro) * 1000) / 10 : 0;
        const period =
          S.rtab === "gun" || S.rtab === "analiz"
            ? dLong(T0)
            : S.rtab === "ay"
              ? parseISO(T0).toLocaleDateString("tr-TR", { month: "long", year: "numeric" })
              : "Ocak – " + AYLAR[parseISO(T0).getMonth()] + " " + parseISO(T0).getFullYear();
        const pct = (v, t) => (t ? Math.round((v / t) * 100) : 0);
        const bars = (obj, col, fn, vf = fmt) => {
          const e = Object.entries(obj).sort((a, b) => b[1] - a[1]),
            mx = Math.max(1, ...e.map(x => x[1])),
            tot = e.reduce((s, x) => s + x[1], 0);
          return e.length
            ? `<div class="rbars">${e.map(([k, v]) => `<div class="rb"><div class="rbl"><span>${fn(k)}</span><span class="num">${vf(v)} <small>%${pct(v, tot)}</small></span></div><div class="rbt"><i style="width:${(v / mx) * 100}%;--c:${col(k)}"></i></div></div>`).join("")}</div>`
            : '<div class="hint">Bu dönemde kayıt yok.</div>';
        };
        const head = `<div class="rhead"><div class="tabs" style="margin:0">${[
          ["gun", "Bugün"],
          ["ay", "Bu ay"],
          ["yil", "Bu yıl"],
          ["analiz", "Analiz"],
        ]
          .map(([k, n]) => `<button class="tab ${S.rtab === k ? "on" : ""}" data-act="rtab" data-r="${k}">${n}</button>`)
          .join("")}</div>
        <span class="hint">${period}${S.rtab === "gun" ? " · örnek veri" : S.rtab === "ay" ? " · geçmiş günler örnek veri" : S.rtab === "yil" ? " · geçmiş aylar örnek veri" : " · ayrıntılı analiz"}</span>${S.rtab === "gun" ? `<button class="btn pri" data-act="z" style="margin-left:auto">Gün sonu (Z) raporu</button>` : ""}</div>`;
        if (S.rtab === "analiz") return head + analizBody();
        const eq = `<section class="eq">
        <div class="eqc"><span class="lbl">Ciro</span><b class="num">${fmt(ciro)}</b></div><span class="eqop">−</span>
        <div class="eqc"><span class="lbl">Giderler</span><b class="num">${fmt(gTot2)}</b></div><span class="eqop">=</span>
        <div class="eqc netc ${nk >= 0 ? "up" : "down"}"><span class="lbl">Net kazanç</span><b class="num">${fmt(nk)}</b><span class="hint">kâr oranı %${margin.toLocaleString("tr-TR")}</span></div>
        <div class="eqside">${
          S.rtab === "yil"
            ? `<div><span class="lbl">Aylık ort. net</span><b class="num">${fmt(nk / months.length)}</b></div><div><span class="lbl">En iyi ay</span><b class="num">${AYLAR[[...months].sort((a, b) => b.ciro - b.gider - (a.ciro - a.gider))[0].m]}</b></div>`
            : S.rtab === "gun"
              ? `<div><span class="lbl">Sipariş</span><b class="num">${cnt}</b></div><div><span class="lbl">Ort. sepet</span><b class="num">${fmt(cnt ? ciro / cnt : 0)}</b></div>`
              : `<div><span class="lbl">Günlük ort.</span><b class="num">${fmt(ciro / days.length)}</b></div><div><span class="lbl">En iyi gün</span><b class="num">${parseISO([...days].sort((a, b) => b.ciro - a.ciro)[0].date).toLocaleDateString("tr-TR", { day: "numeric", month: "long" })}</b></div>`
        }</div>
        <p class="hint eqnote">Giderlere malzeme alımları dahildir.${
          S.rtab === "gun"
            ? (() => {
                const g = GIFTS.filter(x => iso(new Date(x.at)) === T0);
                return ` · Bugün verilen sadakat ödülü: <b>${g.length} adet</b>, maliyeti <b>${fmt(g.reduce((s, x) => s + x.cost, 0))}</b>`;
              })()
            : ""
        }</p></section>`;
        const gPanel = `<section class="panel"><div class="split"><h3>Giderler (kategori)</h3><b class="num">${fmt(gTot2)}</b></div>${bars(
          byG,
          () => "var(--bad)",
          k => k,
        )}</section>`;
        if (S.rtab === "yil") {
          const mx = Math.max(1, ...months.map(x => Math.max(x.ciro, x.gider)));
          const chart = `<div class="mchart" role="img" aria-label="Aylık ciro ve gider grafiği">${months
            .map(x => {
              const n = x.ciro - x.gider;
              return `<div class="mc ${x.cur ? "cur" : ""}" title="${AYLAR[x.m]}: ciro ${fmt(x.ciro)}, gider ${fmt(x.gider)}, net ${fmt(n)}">
         <span class="mn num ${n < 0 ? "neg" : ""}">${n < 0 ? "−" : ""}${Math.abs(Math.round(n / 1000))}k</span>
         <span class="mw"><i class="ci" style="height:${(x.ciro / mx) * 100}%"></i><i class="gi" style="height:${(x.gider / mx) * 100}%"></i></span>
         <span class="ml">${AYLAR[x.m].slice(0, 3)}</span></div>`;
            })
            .join("")}</div>
         <div class="mleg"><span style="--c:var(--accent)">Ciro</span><span style="--c:var(--bad)">Gider</span><span class="hint">Sütun üstündeki sayı: net kazanç (bin ₺)</span></div>`;
          const tbl = `<div class="wrapx"><table class="mtable sm"><thead><tr><th>Ay</th><th class="r">Ciro</th><th class="r">Gider</th><th class="r">Net</th><th class="r">Oran</th></tr></thead><tbody>${months
            .map(x => {
              const n = x.ciro - x.gider;
              return `<tr${x.cur ? ' class="currow"' : ""}><td>${AYLAR[x.m]}${x.cur ? ' <span class="chip">bu ay</span>' : ""}</td><td class="r num">${fmt(x.ciro)}</td><td class="r num">${fmt(x.gider)}</td><td class="r num" style="color:${n < 0 ? "var(--bad)" : "var(--ok)"};font-weight:600">${fmt(n)}</td><td class="r num hint">%${x.ciro ? Math.round((n / x.ciro) * 1000) / 10 : 0}</td></tr>`;
            })
            .join("")}
         <tr class="totrow"><td><b>Toplam</b></td><td class="r num"><b>${fmt(ciro)}</b></td><td class="r num"><b>${fmt(gTot2)}</b></td><td class="r num"><b>${fmt(nk)}</b></td><td class="r num">%${margin.toLocaleString("tr-TR")}</td></tr></tbody></table></div>`;
          return `${head}${eq}<div class="rgrid"><section class="panel full"><div class="split"><h3>Aylık ciro ve gider</h3><span class="hint">Ocak, Nisan, Temmuz: 3 aylık kira</span></div>${chart}</section>
         <section class="panel"><h3>Aylara göre</h3>${tbl}</section>${gPanel}</div>`;
        }
        if (S.rtab === "ay") {
          const mx = Math.max(1, ...days.map(d => d.ciro)),
            avg = ciro / days.length;
          const chart = `<div class="cols" role="img" aria-label="Günlük ciro grafiği">${days.map(d => `<div class="col ${d.date === T0 ? "today" : ""}" title="${dShort(d.date)}: ${fmt(d.ciro)}"><span class="cv num">${Math.round(d.ciro / 1000)}k</span><span class="cw"><i style="height:${Math.max(2, (d.ciro / mx) * 100)}%"></i></span><span class="cd num">${parseISO(d.date).getDate()}</span></div>`).join("")}<span class="avg" style="bottom:calc(${avg / mx} * 180px + 20px)"><span>ort. ${fmt(avg)}</span></span></div>`;
          return `${head}${eq}<div class="rgrid"><section class="panel wide"><div class="split"><h3>Günlük ciro</h3><span class="hint">bugün koyu renkte</span></div>${chart}</section>${gPanel}</div>`;
        }
        const byCh = {};
        closed.forEach(o => (byCh[o.channel] = (byCh[o.channel] || 0) + net(o)));
        const byPay = {};
        closed.forEach(o => o.paid.forEach(p => (byPay[p.m] = (byPay[p.m] || 0) + p.a)));
        const byP = {};
        closed.forEach(o => o.items.forEach(i => (byP[i.pid] = (byP[i.pid] || 0) + i.qty)));
        const top = Object.fromEntries(
          Object.entries(byP)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 6),
        );
        return `${head}${eq}<div class="rgrid">
        <section class="panel"><h3>Kanallara göre</h3>${bars(
          byCh,
          k => CH[k].c,
          k => CH[k].n,
        )}</section>
        <section class="panel"><h3>Ödeme tipine göre</h3>${bars(
          byPay,
          () => "var(--accent)",
          k => k,
        )}</section>
        ${gPanel}
        <section class="panel"><h3>En çok satanlar</h3>${bars(
          top,
          () => "var(--accent)",
          k => esc(P(k).name),
          v => v + " adet",
        )}</section></div>`;
      }

      function passModal(to = "report") {
        S.pwTo = to;
        modal(`<h2>${to === "takip" ? "Takip" : "Rapor"} şifresi</h2><p class="hint" style="margin:0">Bu bölümü görmek için şifreyi girin.</p>
       <div class="field"><label class="lbl" for="rp">Şifre</label><input id="rp" class="num" type="password" inputmode="numeric" autocomplete="off" data-act="rpKey"></div><div class="err" id="rperr"></div>
       <button class="btn pri" data-act="rpGo">Giriş</button><div class="hint">Demo şifre: <span class="num">2580</span></div><button class="btn ghost" data-act="close">Vazgeç</button>`);
        setTimeout(() => $("#rp")?.focus(), 30);
      }

      function analizBody() {
        const cl = closedToday();
        const byH = {};
        cl.forEach(o => {
          const h = new Date(o.createdAt).getHours();
          byH[h] = byH[h] || { n: 0, c: 0 };
          byH[h].n++;
          byH[h].c += net(o);
        });
        const hs = Object.keys(byH)
            .map(Number)
            .sort((a, b) => a - b),
          hmx = Math.max(1, ...hs.map(h => byH[h].c)),
          peak = hs.slice().sort((a, b) => byH[b].c - byH[a].c)[0];
        const hourly = hs.length
          ? `<div class="cols hcols" role="img" aria-label="Saatlere göre ciro">${hs.map(h => `<div class="col ${h === peak ? "today" : ""}" title="${pad2(h)}:00 · ${byH[h].n} sipariş · ${fmt(byH[h].c)}"><span class="cv num">${byH[h].n}</span><span class="cw"><i style="height:${Math.max(3, (byH[h].c / hmx) * 100)}%"></i></span><span class="cd num">${pad2(h)}</span></div>`).join("")}</div><p class="hint" style="margin:0">Sütun: ciro · üstteki sayı: sipariş adedi · en yoğun saat <b>${pad2(peak)}:00</b></p>`
          : '<div class="hint">Bugün kapanan sipariş yok.</div>';
        const pr = {};
        cl.forEach(o =>
          o.items.forEach(i => {
            if (!P(i.pid)) return;
            const r = (pr[i.pid] = pr[i.pid] || { q: 0, c: 0, k: 0 });
            r.q += i.qty;
            r.c += i.price * i.qty;
            r.k += (costOf(i.pid, o.channel !== "masa") || 0) * i.qty;
          }),
        );
        const prs = Object.entries(pr)
          .map(([id, r]) => ({ id, ...r, kar: r.c - r.k }))
          .sort((a, b) => b.kar - a.kar);
        const ptab = prs.length
          ? `<div class="wrapx"><table class="mtable sm"><thead><tr><th>Ürün</th><th class="r">Adet</th><th class="r">Ciro</th><th class="r">Maliyet</th><th class="r">Kâr</th><th class="r">Kâr %</th></tr></thead><tbody>${prs.map((r, i) => `<tr class="${i >= prs.length - 3 && prs.length > 5 ? "rowbad" : ""}"><td>${esc(P(r.id).name)}</td><td class="r num">${r.q}</td><td class="r num">${fmt(r.c)}</td><td class="r num hint">${fmt(r.k)}</td><td class="r num"><b>${fmt(r.kar)}</b></td><td class="r num">%${r.c ? Math.round((r.kar / r.c) * 100) : 0}</td></tr>`).join("")}</tbody></table></div><p class="hint" style="margin:0">Kırmızı satırlar bugün en az kâr bırakan ürünler.</p>`
          : '<div class="hint">Veri yok.</div>';
        const dayW = WASTE.filter(w => iso(new Date(w.t)) === T0),
          dayI = IKRAM.filter(w => iso(new Date(w.t)) === T0),
          dayL = LOG.filter(l => l.why && l.why.startsWith("Fire") && iso(new Date(l.t)) === T0 && ING[l.k]);
        const wc = dayW.reduce((s, w) => s + w.cost, 0) + dayL.reduce((s, l) => s + Math.abs(l.d) * ING[l.k].cost, 0),
          ic = dayI.reduce((s, w) => s + w.cost, 0);
        const fire = `<div class="wzsum"><div><span class="lbl">Fire maliyeti</span><b class="num">${fmt(wc)}</b></div><div><span class="lbl">İkram maliyeti</span><b class="num">${fmt(ic)}</b></div><div><span class="lbl">İkram menü değeri</span><b class="num">${fmt(dayI.reduce((s, w) => s + w.price, 0))}</b></div></div>
        <div class="paylist">${
          [
            ...dayW.map(w => ({ t: w.t, x: `Fire · ${w.qty}× ${P(w.pid)?.name || "?"}`, y: w.why + " · " + w.u, c: w.cost })),
            ...dayL.map(l => ({
              t: l.t,
              x: `Fire · ${ING[l.k].n} ${fq(Math.abs(l.d), ING[l.k].u)}`,
              y: l.why.replace(/^Fire:?\s*/, ""),
              c: Math.abs(l.d) * ING[l.k].cost,
            })),
            ...dayI.map(w => ({
              t: w.t,
              x: `İkram · ${w.qty}× ${P(w.pid)?.name || "?"}`,
              y: w.why + " · " + w.where + " · " + w.u,
              c: w.cost,
            })),
          ]
            .sort((a, b) => b.t - a.t)
            .map(
              r =>
                `<div class="split"><span>${esc(r.x)}<br><small class="hint">${tStr(r.t)} · ${esc(r.y)}</small></span><span class="num">${fmt(r.c)}</span></div>`,
            )
            .join("") || '<div class="hint">Bugün fire veya ikram yok.</div>'
        }</div>`;
        const bp = {};
        cl.forEach(o => {
          const k = o.by || "—";
          bp[k] = bp[k] || { n: 0, c: 0 };
          bp[k].n++;
          bp[k].c += net(o);
        });
        const pers = `<div class="wrapx"><table class="mtable sm"><thead><tr><th>Personel</th><th class="r">Sipariş</th><th class="r">Ciro</th><th class="r">Ort. sepet</th><th class="r">İkram</th></tr></thead><tbody>${Object.entries(
          bp,
        )
          .sort((a, b) => b[1].c - a[1].c)
          .map(
            ([k, v]) =>
              `<tr><td>${esc(k)}</td><td class="r num">${v.n}</td><td class="r num">${fmt(v.c)}</td><td class="r num">${fmt(v.c / v.n)}</td><td class="r num">${dayI.filter(w => w.u === k).length || "—"}</td></tr>`,
          )
          .join("")}</tbody></table></div>`;
        const pk = cl.filter(o => o.channel !== "masa"),
          dur = o => (o.closedAt - o.createdAt) / 60000,
          avg = a => (a.length ? Math.round(a.reduce((s, o) => s + dur(o), 0) / a.length) : 0);
        const grp = f => {
          const g = {};
          pk.forEach(o => {
            const k = f(o);
            (g[k] = g[k] || []).push(o);
          });
          return g;
        };
        const del = `<div class="wzsum"><div><span class="lbl">Ort. teslimat</span><b class="num">${avg(pk)} dk</b></div><div><span class="lbl">45 dk üstü</span><b class="num">${pk.filter(o => dur(o) > 45).length}</b></div><div><span class="lbl">Paket sipariş</span><b class="num">${pk.length}</b></div></div>
        <div class="paylist">${Object.entries(grp(o => o.courier || "Kurye yok"))
          .map(
            ([k, a]) =>
              `<div class="split"><span>${esc(k)} <small class="hint">${a.length} paket</small></span><span class="num">${avg(a)} dk</span></div>`,
          )
          .join("")}</div>
        <div class="paylist">${Object.entries(grp(o => CH[o.channel].n))
          .map(([k, a]) => `<div class="split"><span>${esc(k)}</span><span class="num">${avg(a)} dk</span></div>`)
          .join("")}</div>`;
        const ip = S.orders.filter(o => o.status === "iptal" && iso(new Date(o.closedAt || o.createdAt)) === T0),
          rs = {};
        ip.forEach(o => (rs[o.cancelReason || "Reddedildi"] = (rs[o.cancelReason || "Reddedildi"] || 0) + 1));
        return `<div class="rgrid"><section class="panel full"><div class="split"><h3>Saatlere göre yoğunluk</h3><span class="hint">bugün</span></div>${hourly}</section>
        <section class="panel full"><h3>Ürün kârlılığı</h3>${ptab}</section>
        <section class="panel"><h3>Fire ve ikram</h3>${fire}</section>
        <section class="panel"><h3>Teslimat süresi</h3>${del}</section>
        <section class="panel"><h3>Personel satışları</h3>${pers}</section>
        <section class="panel"><h3>İptaller</h3>${
          ip.length
            ? Object.entries(rs)
                .map(([k, v]) => `<div class="split"><span>${esc(k)}</span><b class="num">${v}</b></div>`)
                .join("")
            : '<div class="hint">Bugün iptal yok.</div>'
        }</section></div>`;
      }
    </script>

        <article class="plat add"><h3>Başka platform ekle</h3><div class="field"><label class="lbl" for="pl-n">Ad</label><input id="pl-n" placeholder="Örn. Fuudy"></div>

    <script>
      // Ayarlar: вкладки настроек.

      function vDev() {
        return `<p class="hint" style="margin:0 0 14px">Bu ekran gerçek bağlantıyı taklit eder. Canlı sistemde ÖKC, ödeme ve mali fiş için cihaz üreticisinin entegrasyonu üzerinden bağlanır; yazıcılar ağ veya USB ile.</p><div class="devs">${DEV.map(
          d => `<div class="dev">
       <div class="split"><h3>${d.n}</h3><span class="dot" style="--c:${d.on ? "var(--ok)" : "var(--bad)"}">${d.on ? "Bağlı" : "Bağlı değil"}</span></div>
       <div class="hint">${d.m}</div><div>${d.d}</div>
       <div class="row"><button class="btn" data-act="devTest" data-d="${d.id}" ${d.on ? "" : "disabled"}>Test et</button><button class="btn ghost" data-act="devToggle" data-d="${d.id}">${d.on ? "Bağlantıyı kes" : "Bağlan"}</button></div></div>`,
        ).join("")}</div>
       <div class="panels" style="margin-top:16px">
       <section class="panel"><h3>Yazıcı yönlendirme</h3><p class="hint" style="margin:0">Mutfağa gönderilen ürün, kategorisine göre hangi yazıcıdan çıksın. Örneğin içecekler bara, yemekler mutfağa.</p>
        ${CATS.map(
          ([id, n]) =>
            `<div class="split"><span>${esc(n)}</span>${sel(
              "pr-" + id,
              [
                ["kp", "Mutfak yazıcısı"],
                ["bp", "Bar yazıcısı"],
                ["none", "Yazdırma"],
              ],
              PRINTROUTE[id] || "kp",
              'data-act="proute" data-c="' + id + '" style="flex:0 0 190px" aria-label="' + esc(n) + ' yazıcısı"',
            )}</div>`,
        ).join("")}
        <div class="row"><button class="btn" data-act="printTest">Test fişi yazdır</button><span class="hint">80 mm termal kağıt</span></div></section>
       <section class="panel"><div class="split"><h3>Bağlı cihazlar</h3><button class="btn" data-act="pairModal">${IC.plus} Cihaz ekle</button></div>
        ${DEVICES.map(d => `<div class="split devrow"><span><b>${esc(d.n)}</b>${d.me ? ' <span class="chip">bu cihaz</span>' : ""}<br><small class="hint">${esc(d.t)}</small></span><span class="dot" style="--c:${d.on ? "var(--ok)" : "var(--muted)"}">${d.on ? "Çevrimiçi" : "Çevrimdışı"}</span></div>`).join("")}
        <p class="hint" style="margin:0">Kasa, garson telefonları ve mutfak tableti aynı anda çalışır; bir cihazda alınan sipariş diğerlerinde anında görünür.</p></section>
       <section class="panel"><h3>İnternet kesilirse</h3><p class="hint" style="margin:0">Program çalışmaya devam eder: masa siparişleri, mutfak ve ödeme bu cihazda kaydedilir, internet gelince otomatik gönderilir. Kart ödemesi ÖKC üzerinden çalışır. Platform siparişleri internet gelince düşer.</p>
        <label class="tg"><button class="switch ${S.forceOff ? "on" : ""}" role="switch" aria-checked="${!!S.forceOff}" data-act="tgOffline" aria-label="Çevrimdışı modu dene"></button><span>Çevrimdışı modu dene (demo)</span></label></section></div>`;
      }

      function masaUI() {
        const n = HALLS.Salon.length;
        return `<section class="panel"><h3>Masa sayısı</h3><p class="hint" style="margin:0">Salondaki masa sayısını girin. Masalar M1, M2 … olarak adlandırılır. Açık hesabı olan masa silinemez.</p>
        <div class="row"><input id="tcount" class="num search" style="width:120px" type="number" min="1" max="60" value="${n}" aria-label="Masa sayısı"><button class="btn pri" data-act="setTables">Kaydet</button></div>
        <div class="tchips">${HALLS.Salon.map(t => {
          const o = tableOrder(t);
          return `<span class="chip ${o && o.items.length ? "ok" : ""}">${t}${o && o.items.length ? " · dolu" : ""}</span>`;
        }).join("")}</div></section>`;
      }

      function katUI() {
        return `<section class="panel"><h3>Menü kategorileri</h3><p class="hint" style="margin:0">Sıra; adisyon, QR menü ve menü sayfasındaki sırayı belirler. İçinde ürün olan kategori için üç seçenek var: ürünleri başka kategoriye taşıyın, kategoriyle birlikte arşive gönderin (geri alınabilir) veya tamamen silin.</p>
        <div class="katlist">${CATS.map(([id, n], i) => {
          const cnt = AP().filter(p => p.cat === id).length;
          return `<div class="katrow"><input value="${esc(n)}" data-act="katName" data-id="${id}" aria-label="Kategori adı"><span class="hint">${cnt} ürün</span>
         <button class="btn ghost iconbtn" data-act="katMove" data-id="${id}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="Yukarı">▲</button><button class="btn ghost iconbtn" data-act="katMove" data-id="${id}" data-d="1" ${i === CATS.length - 1 ? "disabled" : ""} aria-label="Aşağı">▼</button>
         ${
           cnt
             ? `<select class="sel" data-act="katTransfer" data-id="${id}" aria-label="Ürünleri taşı"><option value="">Ürünleri taşı…</option>${CATS.filter(
                 c => c[0] !== id,
               )
                 .map(c => `<option value="${c[0]}">${esc(c[1])}</option>`)
                 .join(
                   "",

    <script>

          !!S.rname,

        if (st === 1)
          b = `<section class="panel"><h3>1. Restoran bilgisi</h3><p class="hint" style="margin:0">Bu ad menüde, adisyonda ve QR kartlarında görünür.</p>
        <div class="field" style="max-width:420px"><label class="lbl" for="wz-name">Restoran adı</label><input id="wz-name" value="${esc(S.rname)}" data-act="wzName"></div></section>
        <section class="panel"><h3>Excel'den toplu yükleme</h3><p class="hint" style="margin:0">Malzemeler ve reçeteler zaten bir Excel tablosundaysa tek seferde yükleyin. Dosyada “Malzemeler” (Malzeme · Birim · Alış Fiyatı) ve “Reçeteler” (Ürün · Malzeme · Miktar) sayfaları olmalı; varsa “Maliyet” sayfasındaki satış fiyatları da alınır. Yüklemeden önce özet gösterilir.</p>
        <label class="filebtn" for="xls" style="justify-self:start">${IC.clip}<span>Excel dosyası seç (.xlsx)</span></label><input id="xls" type="file" accept=".xlsx,.xls" data-act="xlsImp" hidden></section>
        <section class="panel danger-zone"><h3>Sıfırdan başla</h3><p class="hint" style="margin:0">Demo verilerini (menü, malzemeler, reçeteler, masalar, siparişler, müşteriler) siler ve programı boş açar. Demo verilerine dönmek için: Ayarlar → Veri ve yedek → Demoya dön.</p>
        <button class="btn danger" data-act="resetAsk" style="justify-self:start">Tüm verileri sil ve sıfırdan başla</button></section>`;
        else if (st === 2) b = masaUI();
        else if (st === 3) b = katUI();
        else if (st === 4) {
          const ks = Object.keys(ING).sort(
            (a, c) => ICATS.indexOf(ING[a].c) - ICATS.indexOf(ING[c].c) || ING[a].n.localeCompare(ING[c].n, "tr"),
          );
          b = `<section class="panel"><h3>4. Malzemeler ve içecekler</h3><p class="hint" style="margin:0">Fiyatları alış birimine göre yazın: gram/ml ile kullanılanlar için kg/lt fiyatı, adetle kullanılanlar için adet fiyatı. İçecek gibi hazır ürünleri bir sonraki adımda “Hazır ürün ekle” ile tek seferde ekleyebilirsiniz.</p>
        <div class="wzadd"><input id="na-n" placeholder="Malzeme adı" aria-label="Malzeme adı"><select id="na-c" class="sel" aria-label="Kategori">${ICATS.map(c => `<option>${c}</option>`).join("")}</select>
         <select id="na-u" class="sel" aria-label="Birim"><option value="g">g / ml</option><option value="adet">adet</option></select>
         <input id="na-p" class="num" type="number" min="0" placeholder="Alış fiyatı ₺" aria-label="Alış fiyatı"><input id="na-s" class="num" type="number" min="0" placeholder="Stok" aria-label="Stok">
         <button class="btn pri" data-act="naAdd">${IC.plus} Ekle</button></div>
        ${
          ks.length
            ? `<div class="wrapx"><table class="mtable sm"><thead><tr><th>Malzeme</th><th>Kategori</th><th>Birim</th><th class="r">Alış fiyatı</th><th class="r">Stok</th><th class="r">Kritik</th><th class="r">Günlük kullanım</th><th></th></tr></thead><tbody>${ks
                .map(k => {
                  const g = ING[k],
                    m = isG(k) ? 1000 : 1;
                  return `<tr>
         <td><input class="wzin" value="${esc(g.n)}" data-act="ingEdit" data-k="${k}" data-f="n" aria-label="Ad"></td>
         <td><select class="sel wzin" data-act="ingEdit" data-k="${k}" data-f="c" aria-label="Kategori">${ICATS.map(c => `<option ${g.c === c ? "selected" : ""}>${c}</option>`).join("")}</select></td><td class="hint">${isG(k) ? "g / ml" : "adet"}</td>
         <td class="r"><span class="inunit"><input class="price num" data-act="ingPrice" data-k="${k}" type="number" min="0" value="${+uPrice(k).toFixed(2)}" aria-label="Fiyat"><small>${uLbl(k)}</small></span></td>
         <td class="r"><span class="inunit"><input class="price num" data-act="ingEdit" data-k="${k}" data-f="s" type="number" min="0" value="${+(g.s / m).toFixed(2)}" aria-label="Stok"><small>${qLbl(k)}</small></span></td>
         <td class="r"><span class="inunit"><input class="price num" data-act="ingEdit" data-k="${k}" data-f="crit" type="number" min="0" value="${+(g.crit / m).toFixed(2)}" aria-label="Kritik"><small>${qLbl(k)}</small></span></td>
         <td class="r"><span class="inunit"><input class="price num" data-act="ingUse" data-k="${k}" type="number" min="0" value="${+(g.use / m).toFixed(2)}" aria-label="Günlük"><small>${qLbl(k)}</small></span></td>
         <td><button class="btn ghost iconbtn" data-act="delIng" data-k="${k}" aria-label="Sil">${IC.trash}</button></td></tr>`;
                })
                .join("")}</tbody></table></div>`
            : '<div class="empty">Henüz malzeme yok. Yukarıdan ekleyin.</div>'
        }</section>`;
        } else if (st === 5) {
          b = `<section class="panel"><div class="split"><h3>5. Ürünler ve reçeteler</h3><div class="row"><button class="btn" data-act="readyModal">${IC.plus} Hazır ürün ekle (içecek vb.)</button><button class="btn pri" data-act="prodModal">${IC.plus} Ürün ekle</button></div></div>
        <p class="hint" style="margin:0">Her ürünün bir kategorisi olmalı. Reçete girilirse maliyet ve önerilen fiyat otomatik hesaplanır, satışta stok düşer.</p>
        <input class="search" id="wzq" data-act="wzq" placeholder="Ürün ara (örn. burger)" value="${esc(S.wzq || "")}" aria-label="Ürün ara" style="max-width:420px">
        <div id="wzplist">${wzList()}</div></section>`;
        } else {
          const off = AP().filter(p => !p.combo && (sugPrice(p.id) !== p.price || appDiff(p))).length;
