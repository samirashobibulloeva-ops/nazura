<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nazura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: POS shell — fixed nav rail (bottom bar on phones) + working area; adisyon = products | ticket */
:root{
  --bg:#eef0ec; --surface:#ffffff; --surface2:#e3e7e1; --fg:#18201c; --muted:#5f6a64; --line:#d3d8d0;
  --accent:#0d6b58; --accent-fg:#ffffff; --accent-soft:#d6ece5;
  --ok:#2d8a3c; --warn:#b8720b; --bad:#c23b2d; --info:#2e5db5;
  --ch-masa:#5b6660; --ch-tel:#2e5db5; --ch-ys:#d4224b; --ch-getir:#5d39b5; --ch-ty:#e2620f; --ch-wa:#1e8a4c;--ch-mg:#e07a00;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --surface:#181d1a; --surface2:#222925; --fg:#e6ebe7; --muted:#97a29b; --line:#2d3530;
  --accent:#3dbd9f; --accent-fg:#06140f; --accent-soft:#16342c;
  --ok:#5cc46b; --warn:#e3a33c; --bad:#ef6b5c; --info:#7ba3f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181d1a; --surface2:#222925; --fg:#e6ebe7; --muted:#97a29b; --line:#2d3530;
  --accent:#3dbd9f; --accent-fg:#06140f; --accent-soft:#16342c;
  --ok:#5cc46b; --warn:#e3a33c; --bad:#ef6b5c; --info:#7ba3f2; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);margin:0}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* login */
#login{height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(360px,100%);display:grid;gap:18px;text-align:center}
.brand{font-family:var(--f-display);font-weight:800;font-size:30px}
.brand b{color:var(--accent)}
.pin-dots{display:flex;justify-content:center;gap:12px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);height:62px;font-size:22px;font-family:var(--f-mono)}
.pad button:active{background:var(--surface2)}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* shell */
#app{height:100%;display:grid;grid-template-columns:88px 1fr}
nav.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:12px 8px;gap:4px}
.rail .logo{font-family:var(--f-display);font-weight:800;text-align:center;font-size:15px;padding:6px 0 14px;line-height:1.1}
.rail .logo b{color:var(--accent)}
.navbtn{display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:var(--r);font-size:12px;color:var(--muted);position:relative}
.navbtn svg{width:22px;height:22px}
.navbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn .badge{position:absolute;top:4px;right:12px;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-weight:600}
.rail .spacer{flex:1}
main{min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
header.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
header.top h1{font-size:22px;margin-right:auto}
.demo-tag{font-size:12px;border:1px dashed var(--warn);color:var(--warn);border-radius:20px;padding:2px 10px}
.who{font-size:13px;color:var(--muted)}
.content{flex:1;overflow:auto;padding:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r);background:var(--surface2);font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap}
.btn:hover{border-color:var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--line);font-weight:500;background:var(--surface)}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* tables */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-left:auto}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;min-height:118px;display:flex;flex-direction:column;gap:6px;position:relative;border-top:5px solid var(--c,var(--line))}
.tile:hover{border-color:var(--accent)}
.tile .tn{font-family:var(--f-display);font-weight:800;font-size:24px}
.tile .st{font-size:12.5px;color:var(--muted)}
.tile .amt{margin-top:auto;font-size:17px}
.tile .chip{position:absolute;top:10px;right:10px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--muted)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.ch{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff;background:var(--c);letter-spacing:.02em;white-space:nowrap}

/* adisyon */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;height:100%}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;min-height:84px;display:flex;flex-direction:column;gap:6px}
.prod:hover{border-color:var(--accent)}
.prod .pn{font-weight:600;line-height:1.25}
.prod .pp{margin-top:auto;color:var(--muted)}
.prod[disabled]{opacity:.5;cursor:not-allowed}
.prod[disabled] .pp::after{content:" · Tükendi";color:var(--bad);font-family:var(--f-body);font-weight:600}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;max-height:100%}
.ticket .th{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ticket .th h2{font-size:22px;margin-right:auto}
.lines{flex:1;overflow:auto;padding:6px 0;min-height:120px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 16px}
.line .ln{min-width:0}
.line .ln small{display:block;font-size:12px;color:var(--muted)}
.line.new .ln small{color:var(--warn);font-weight:600}
.qty{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:8px}
.qty button{width:30px;height:30px;font-size:18px;font-weight:600}
.qty span{min-width:22px;text-align:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.tfoot{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:12px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:26px;font-family:var(--f-mono)}
.tfoot .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tfoot .acts .wide{grid-column:1/-1}

/* orders feed */
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;gap:10px;padding:14px;border-left:5px solid var(--c)}
.ocard.fresh{animation:pulse 1.2s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 35%,transparent)}}
.ocard .oh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ocard .oid{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-right:auto}
.ocard ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px}
.ocard li{display:flex;justify-content:space-between;gap:8px}
.cust{font-size:13.5px;color:var(--muted)}
.cust b{color:var(--fg);font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.steps i.on{background:var(--accent)}
select.sel{padding:9px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);flex:1;min-width:0}

/* kitchen */
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;align-items:start}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kcard .kh{padding:12px 14px;display:flex;align-items:center;gap:8px;background:var(--c);color:#fff}
.kcard .kh h3{font-size:20px;margin-right:auto}
.kcard ul{list-style:none;margin:0;padding:10px 14px;display:grid;gap:6px;font-size:16px}
.kcard li b{font-family:var(--f-mono);margin-right:8px}
.kcard .kf{padding:0 14px 14px}
.kcard .kf .btn{width:100%}

/* menu */
.mtable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mtable th,.mtable td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left}
.mtable th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--surface2)}
.mtable input.price{width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.switch{width:44px;height:26px;border-radius:13px;background:var(--surface2);position:relative;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
.switch.on{background:var(--ok);border-color:var(--ok)}
.switch.on::after{left:20px;background:#fff}
.wrapx{overflow-x:auto}

/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.kpi b{font-size:26px;font-family:var(--f-mono);font-weight:500}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start}
.panel h3{font-size:17px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--c,var(--accent));border-radius:6px}
.bar .v{text-align:right}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:14px;width:min(460px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px;padding:20px;border:1px solid var(--line)}
.modal h2{font-size:22px}
.field{display:grid;gap:4px}
.field input{padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg)}
.split{display:flex;justify-content:space-between;gap:10px}
.paylist{display:grid;gap:4px;font-size:14px}
.freegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.call{border:2px solid var(--info)}
.call .ring{display:flex;align-items:center;gap:12px}
.call .ring .ic{width:46px;height:46px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;animation:ring 1s infinite}
@keyframes ring{50%{transform:rotate(-12deg)}}
.hist{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px;display:grid;gap:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:24px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}
/* stock, customers, devices */
.prod .left{font-size:12px;font-weight:600;color:var(--ok)}
.prod .left.low{color:var(--warn)}
.prod .left.out{color:var(--bad)}
.warnbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.warnbar b{color:var(--warn)}
.lvl{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;min-width:90px}
.lvl i{display:block;height:100%;background:var(--c,var(--ok))}
.mtable td.r,.mtable th.r{text-align:right}
.mtable .acts{display:flex;gap:6px;justify-content:flex-end}
.mtable .btn{padding:6px 10px;font-size:13px}
.recipe{display:flex;flex-wrap:wrap;gap:4px}
.recipe span{font-size:12.5px;background:var(--surface2);border-radius:6px;padding:2px 7px}
.recipe span.neck{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);font-weight:600}
.big{font-family:var(--f-mono);font-size:20px}
.custchip{display:flex;align-items:center;gap:8px;width:100%;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:13.5px}
.custchip b{color:var(--accent)}
.custchip .btn{margin-left:auto;padding:4px 10px;font-size:12.5px}
.clist{display:grid;gap:6px;max-height:260px;overflow:auto}
.citem{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.citem:hover{border-color:var(--accent)}
.citem small{display:block;color:var(--muted);font-size:12.5px}
.field textarea{padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);min-height:64px;resize:vertical}
.tile .cn{font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start}
.dev h3{font-size:17px}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.okc-wait{display:grid;place-items:center;gap:10px;padding:18px;border:2px dashed var(--info);border-radius:12px;text-align:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--info);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.search{padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);width:min(320px,100%)}
.urgent{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:2px solid var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:grid;gap:8px}
.urgent .uh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.urgent .uh b{color:var(--bad);letter-spacing:.04em;margin-right:auto}
.urgent .ulist{display:flex;flex-wrap:wrap;gap:6px}
.urgent .ulist span{background:var(--bad);color:#fff;border-radius:8px;padding:5px 10px;font-size:14px}
.urgent .ulist b{color:#fff}
.mtable tr.rowbad td{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.mtable tr.rowbad td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
/* v3: ana sayfa panosu, durumlar, telefon siparişi, giderler */
.rail .logo{font-size:17px;letter-spacing:.01em}
.homebar{margin-bottom:16px;justify-content:flex-end}
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:20px;align-items:start}
.home .floor{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
h2.sec{font-size:19px;margin-right:auto}
.tabs.sm .tab{padding:5px 12px;font-size:13px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.olist{display:grid;gap:10px;max-height:calc(100vh - 260px);overflow:auto;padding-right:2px}
.oc{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;display:grid;gap:7px;background:var(--bg)}
.oc.fresh{animation:pulse 1.2s ease 2}
.oc .oh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc .oid{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.oitems{font-size:14px}
.onote{font-size:13px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--fg);border-radius:6px;padding:4px 8px}
.match{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:6px 8px}
.match .btn{padding:4px 10px;font-size:12.5px;margin-left:auto}
.match.ok{background:var(--accent-soft);color:var(--fg)}
.match.ok b{color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;background:var(--surface2);border-radius:9px;padding:3px}
.seg button{padding:7px 2px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);line-height:1.15}
.seg button.done{color:var(--accent)}
.seg button.cur{background:var(--accent);color:var(--accent-fg)}
.seg button:hover:not(.cur){background:var(--surface)}
.oc .row .btn{padding:6px 12px;font-size:13px}
.bell{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.bell svg{width:20px;height:20px}
.bell .badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-weight:600}
.callbar{display:flex;align-items:center;gap:8px;width:100%;background:color-mix(in srgb,var(--info) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--info) 40%,transparent);border-radius:8px;padding:8px 10px;font-size:13.5px}
.callbar svg{width:18px;height:18px;color:var(--info);flex:none}
.tf2{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.field input,.field select{padding:9px 11px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);min-width:0}
.addrchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipbtn{font-size:12.5px;border:1px solid var(--line);border-radius:14px;padding:4px 10px;background:var(--surface2);text-align:left}
.chipbtn:hover{border-color:var(--accent)}

 Object.entries(ING).forEach(([k,g])=>{const r=v=>g.u==="g"?Math.max(100,Math.round(v/100)*100):Math.max(1,Math.round(v));

const APPK=["app","ty","mg","ys"];

function lvl(k){const g=ING[k],d=daysLeft(k);return g.s<=0||d<1?"acil":(d<3||g.s<=g.crit)?"yakin":"ok"}
const LVL={acil:0,yakin:1,ok:2};

}

const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parseISO(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)};

 }
 return `<article class="oc ${S.seen.has(o.id)?"":"fresh"}" style="--c:${c.c}">
  <div class="oh"><span class="ch" style="--c:${c.c}">${c.n}</span><span class="oid">${o.code||"#"+o.id}</span><span class="hint" data-since="${o.createdAt}">${ago(o.createdAt)}</span><b class="num" style="margin-left:auto">${fmt(net(o))}</b></div>
  <div>${who}</div>${sub}${items}${note}${match}${ctrl}</article>`;

function setStage(o,st){
 const on=online(o),order=(on?ON:OFF).map(s=>s[0]),from=order.indexOf(o.stage),to=order.indexOf(st);
 if(on&&st==="kuryede"&&!o.courier){toast("Önce kurye seçin");return false}
 if(o.channel==="masa"&&!o.items.some(i=>i.sent)){toast("Önce ürünleri mutfağa gönderin");return false}
 o.stage=st;
 if(["hazir","servis","kuryede","teslim"].includes(st))o.items.forEach(i=>{if(i.sent)i.ready=true});
 else if(to<from)o.items.forEach(i=>{if(i.sent)i.ready=false});
 if(st==="teslim"){o.status="kapali";o.closedAt=now();o.paid=[{m:o.pay==="Online"?"Online":(String(o.pay).includes("kart")?"Kart":"Nakit"),a:net(o)}];
  const c=o.custId&&C(o.custId);if(c)visit(c,CH[o.channel].n,net(o),o);toast(c?`Teslim edildi · ${c.name}: ${c.visits}. sipariş`:"Teslim edildi");return true}
 toast(`${oTitle(o)}: ${STL[st]}`);return true}

// malzeme fiyatı değişti → ürün maliyeti ve fiyat önerisi
function costChange(changes){ // [{k,old}] — ING[k].cost yeni değerde
 const ks=changes.map(c=>c.k);
 const aff=PRODUCTS.filter(p=>RECIPES[p.id].some(([k])=>ks.includes(k)));
 if(!aff.length){toast("Birim fiyat güncellendi");return}
 const oldCost=pid=>RECIPES[pid].reduce((s,[k,q])=>{const c=changes.find(x=>x.k===k);return s+(c?c.old:ING[k].cost)*q},0);
 S.pend=aff.map(p=>{const sug=sugPrice(p.id);return{pid:p.id,oc:oldCost(p.id),nc:costOf(p.id),sug,sugA:sugApp(sug)}});
 const up=changes.some(c=>ING[c.k].cost>c.old);
 modal(`<h2>${up?"Malzemeye zam geldi":"Malzeme fiyatı değişti"}</h2>
 <div class="paylist">${changes.map(c=>`<div class="split"><span>${ING[c.k].n}</span><span class="num">${fmt(isG(c.k)?c.old*1000:c.old)} → <b>${fmt(uPrice(c.k))}</b> ${uLbl(c.k)}</span></div>`).join("")}</div>
 <p class="hint" style="margin:0">Bu malzemeyi kullanan ${aff.length} ürün. Yeni fiyat tablodaki kuralla hesaplandı: maliyet ÷ %${SET.fc}, uygulama +%${SET.app}, ${SET.step} ₺'ye yuvarlama. İsterseniz değiştirin.</p>

function receive(k){
 const qIn=Math.max(0,+$("#bq-"+k)?.value||0),pIn=Math.max(0,+$("#bp-"+k)?.value||0);if(!qIn)return null;
 const qty=isG(k)?qIn*1000:qIn,old=ING[k].cost,newCost=isG(k)?pIn/1000:pIn;
 ING[k].s+=qty;LOG.unshift({t:now(),k,d:qty,why:"Tedarikçi teslimatı"});
 GIDER.push({id:++GID,cat:"Malzeme",amt:Math.round(qIn*pIn),date:today(),note:`${ING[k].n} · ${qIn} ${qLbl(k)}`});
 if(Math.abs(newCost-old)>1e-9){ING[k].cost=newCost;return{k,old}}return false}

  case "applyPrices":{let n=0;(S.pend||[]).forEach((x,i)=>{if($("#pc-"+i)?.checked){const p=P(x.pid),v=Math.round(+$("#pv-"+i).value||0),va=Math.round(+$("#pa-"+i).value||0);

  case "addGider":{const amt=Math.round(+$("#g-amt").value||0);if(amt<=0){toast("Tutarı yazın");$("#g-amt").focus();return}

  case "applyRule":{let n=0;PRODUCTS.forEach(p=>{const g=sugPrice(p.id),ga=sugApp(g);if(g!==p.price||APPK.some(k=>p[k]!==ga)){setPrice(p.id,g,"price");APPK.forEach(k=>setPrice(p.id,ga,k));n++}});toast(`${n} ürünün fiyatı kurala göre güncellendi`);break}

   const u=$("#ni-u").value,m=u==="g"?1000:1,k="m"+Date.now();
   ING[k]={n,u,cost:(+$("#ni-p").value||0)/m,pack:$("#ni-pk").checked,s:(+$("#ni-s").value||0)*m,use:(+$("#ni-use").value||0)*m,crit:(+$("#ni-c").value||0)*m};
   modal("");toast(`${n} eklendi. Reçetelere eklemek için ürün reçetesini düzenleyin.`);break}
  case "delIng":delIngModal(b.dataset.k);return;

   delete ING[k];modal("");render();toast(`${bak.n} silindi`,()=>{ING[k]=bak;Object.entries(rb).forEach(([pid,[i,row]])=>RECIPES[pid].splice(i,0,row));toast(`${bak.n} geri getirildi`)});return}

   <div class="hint">${esc(g.file.name)} · ${dLong(g.date)}</div><button class="btn danger" data-act="rmFis" data-id="${g.id}">Fişi kaldır</button><button class="btn ghost" data-act="close">Kapat</button>`);return}

 }
 render();

document.addEventListener("input",e=>{const b=e.target,a=b.dataset.act;
 if(a==="cq"){S.cq=b.value;$("#custtable").innerHTML=custTable(custRows(S.cq))}
 if(a==="cmq"){$("#cmlist").innerHTML=clistHTML(b.value)}
 if(a==="sq"){S.sq=b.value;$("#ingtable").innerHTML=ingTable(S.sq)}
 if(a==="tf"){const o=S.orders.find(x=>x.id===S.activeId);if(b.dataset.f==="note")o.note=b.value;else o.customer[b.dataset.f]=b.value}
 if(a==="delCheck"){const ok=b.value.trim().toLocaleLowerCase("tr-TR")===ING[b.dataset.k].n.toLocaleLowerCase("tr-TR");$("#del-go").disabled=!ok}
 if(a==="buyCalc"){const k=b.dataset.k;$("#bt-"+k).textContent=fmt((+$("#bq-"+k).value||0)*(+$("#bp-"+k).value||0))}
});
document.addEventListener("change",e=>{const b=e.target;const a=b.dataset.act;
 if(a==="courier"){S.orders.find(x=>x.id===+b.dataset.id).courier=b.value;toast(b.value?`Kurye: ${b.value}`:"Kurye kaldırıldı");render()}
 if(a==="price"){const p=P(b.dataset.p),k=b.dataset.k||"price",PL=Object.fromEntries(PLATS.map(x=>[x[0],x[1]]));const v=Math.max(0,Math.round(+b.value||0));const old=p[k];setPrice(p.id,v,k);
  toast(`${p.name} · ${k==="price"?"salon (masa, telefon, WhatsApp, QR menü)":PL[k]}: ${fmt(old)} → ${fmt(v)}`);render()}
 if(a==="ingUse"){const k=b.dataset.k,v=Math.max(0,+b.value||0);ING[k].use=isG(k)?v*1000:v;toast(`${ING[k].n}: günlük kullanım ${fq(ING[k].use,ING[k].u)}`);render()}
 if(a==="gfile"||a==="gfileNew"){const f=b.files&&b.files[0];if(!f)return;const file={name:f.name,url:URL.createObjectURL(f),img:f.type.startsWith("image/")};
  if(a==="gfileNew"){S.newFile=file;$("#g-fname").textContent=f.name}else{GIDER.find(x=>x.id===+b.dataset.id).file=file;toast("Fiş eklendi");render()}}
 if(a==="loySet"){const k=b.dataset.k;LOY[k]=k==="apps"?b.checked:k==="gift"?b.value:Math.max(k==="every"?2:0,+b.value||0);toast("Sadakat ayarı kaydedildi");render()}
 if(a==="set"){const v=+b.value;if(v>0){SET[b.dataset.k]=v;render()}}
 if(a==="disc"){const o=S.orders.find(x=>x.id===S.activeId);o.discount=Math.min(100,Math.max(0,+b.value||0));payModal();render()}
 if(a==="tfsave"){S.orders.find(x=>x.id===S.activeId).saveAddr=b.checked}
 if(a==="tfpay"){S.orders.find(x=>x.id===S.activeId).pay=b.value}
 if(a==="tf"&&b.dataset.f==="phone"){const o=S.orders.find(x=>x.id===S.activeId),c=byPhone(b.value);
  if(c&&o.custId!==c.id){o.custId=c.id;if(!o.customer.name)o.customer.name=c.name;toast(`Kayıtlı müşteri: ${c.name} · ${c.visits} sipariş`);render()}
  else if(!c&&o.custId){o.custId=null;render()}}
 if(a==="ingPrice"){const k=b.dataset.k,v=Math.max(0,+b.value||0),old=ING[k].cost,nc=isG(k)?v/1000:v;if(Math.abs(nc-old)<1e-9)return;ING[k].cost=nc;
  LOG.unshift({t:now(),k,d:0,why:`Birim fiyat: ${fmt(isG(k)?old*1000:old)} → ${fmt(v)} ${uLbl(k)}`});render();costChange([{k,old}])}
});

(()=>{const a=S.orders.filter(o=>o.status==="acik"&&(o.channel!=="masa"||o.items.some(i=>i.sent))).length,el=$("#lg-open");if(el)el.textContent=a})();
